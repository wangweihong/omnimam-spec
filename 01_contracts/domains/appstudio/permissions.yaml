appstudio.application.read:
  domain: appstudio
  module: application
  resource: studio_application
  action: read
  subject: owner, authorized_collaborator, system_admin
  description: 查询可见 StudioApplication 及权限裁剪摘要。
  frontend_usage: 控制 AppStudio 应用列表、详情和导航入口。
  backend_enforcement: 按 owner_user_id、协作授权或管理员范围过滤；不得与 AI 能力 Application 混用。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, BR-APPSTUDIO-013]
  related_user_stories: [US-APPSTUDIO-001]

appstudio.application.manage:
  domain: appstudio
  module: application
  resource: studio_application
  action: create, update, archive
  subject: owner, authorized_editor, system_admin
  description: 创建和管理 StudioApplication、逻辑源码仓库与默认 Workspace。
  frontend_usage: 控制应用创建、编辑和归档动作。
  backend_enforcement: 同时校验模板、技术栈、应用状态与资源版本；归档不得删除历史 Snapshot、Build 或 Release。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, BR-APPSTUDIO-002]
  related_user_stories: [US-APPSTUDIO-001]

appstudio.workspace.read:
  domain: appstudio
  module: workspace
  resource: studio_workspace, studio_source_file
  action: read, list, search
  subject: owner, authorized_editor, bound_coding_agent, system_admin
  description: 查询 Workspace、Revision 以及受控文件列表、内容和搜索结果。
  frontend_usage: 控制源码浏览、搜索和当前 Revision 展示。
  backend_enforcement: 用户请求校验应用权限；Coding Agent 请求还必须校验短期 Workspace Tool 授权和固定 Workspace 绑定。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-002, BR-APPSTUDIO-003, BR-APPSTUDIO-013]
  related_user_stories: [US-APPSTUDIO-002]

appstudio.workspace.write:
  domain: appstudio
  module: workspace
  resource: studio_change_set, studio_workspace_revision
  action: apply_change_set, restore_revision
  subject: owner, authorized_editor, bound_coding_agent, system_admin
  description: 原子应用 ChangeSet 或从历史 Revision 创建新 Revision。
  frontend_usage: 控制受控源码修改和恢复入口。
  backend_enforcement: 同时校验 appstudio.workspace.read、base_revision、受保护文件、依赖白名单、危险代码、变更大小和幂等键。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-003, BR-APPSTUDIO-004]
  related_user_stories: [US-APPSTUDIO-003]

appstudio.snapshot.manage:
  domain: appstudio
  module: source-version
  resource: studio_source_snapshot, studio_application_version
  action: create, read
  subject: owner, authorized_editor, system_admin
  description: 从当前 Workspace Revision 创建不可变 Snapshot 和 StudioApplicationVersion。
  frontend_usage: 控制创建源码快照、版本和查看版本来源。
  backend_enforcement: 校验 Workspace 当前可发布状态、Revision、短时写锁、内容 digest 与版本唯一性。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-005, BR-APPSTUDIO-006]
  related_user_stories: [US-APPSTUDIO-004]

appstudio.build.manage:
  domain: appstudio
  module: build
  resource: studio_build
  action: create, read, cancel
  subject: owner, authorized_editor, system_admin
  description: 从 Source Snapshot 创建 StudioBuild 并查看状态、诊断、任务和 Artifact 摘要。
  frontend_usage: 控制构建、构建历史、诊断和取消入口。
  backend_enforcement: 创建时只接受不可变 Snapshot；取消叠加 task.group.operate 或 task.atomic.operate，不直接写任务终态。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-005, BR-APPSTUDIO-007, BR-APPSTUDIO-008, BR-APPSTUDIO-013]
  related_user_stories: [US-APPSTUDIO-005]

appstudio.preview.operate:
  domain: appstudio
  module: preview
  resource: studio_preview_runtime
  action: read, check, refresh
  subject: owner, authorized_editor, bound_coding_agent, system_admin
  description: 运行并查看基于当前 Workspace Revision 的编辑态预览检查。
  frontend_usage: 控制预览面板、刷新和诊断入口。
  backend_enforcement: Coding Agent 必须叠加 Workspace Tool 授权；Preview 不得创建正式 Snapshot、Artifact 或 Release。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-003, BR-APPSTUDIO-009]
  related_user_stories: [US-APPSTUDIO-006]

appstudio.runtime_config.manage:
  domain: appstudio
  module: release-runtime
  resource: studio_runtime_config
  action: read, replace
  subject: owner, authorized_deployer, system_admin
  description: 按应用版本和环境管理公开运行配置及 Secret/Integration 引用。
  frontend_usage: 控制环境配置表单；只展示引用摘要，不展示解析后的 Secret。
  backend_enforcement: 验证引用可用性与环境范围；响应和审计永不包含 Secret 值。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-010, BR-APPSTUDIO-011]
  related_user_stories: [US-APPSTUDIO-009]

appstudio.release.manage:
  domain: appstudio
  module: release-runtime
  resource: studio_release, studio_runtime_instance
  action: create, read, rollback
  subject: owner, authorized_deployer, system_admin
  description: 从成功 Build 创建 preview/production Release、查询运行状态并创建回滚 Release。
  frontend_usage: 控制发布、运行状态、访问入口和回滚动作。
  backend_enforcement: 校验成功 Build、Artifact ID/digest、运行配置、环境权限和健康切换；回滚必须创建新 Release。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-008, BR-APPSTUDIO-009, BR-APPSTUDIO-010, BR-APPSTUDIO-011, BR-APPSTUDIO-012]
  related_user_stories: [US-APPSTUDIO-007, US-APPSTUDIO-008, US-APPSTUDIO-009]
