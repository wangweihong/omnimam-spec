# 权限追溯使用 US-APPSTUDIO-001/BR-APPSTUDIO-001 及具体 R-STUDIO-* 规则。
appstudio.application.read:
  domain: appstudio
  module: application
  resource: studio_application
  action: read
  subject: owner, authorized_editor, system_admin
  description: 查询 StudioApplication。
  frontend_usage: AppStudio 应用列表和详情。
  backend_enforcement: 按 owner 和授权范围过滤；不得与 application-platform.Application 混用。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-001, R-STUDIO-010]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.application.manage:
  domain: appstudio
  module: application
  resource: studio_application
  action: create, update, archive
  subject: owner, authorized_editor, system_admin
  description: 管理 StudioApplication 元数据和生命周期。
  frontend_usage: 创建、编辑和归档应用。
  backend_enforcement: 创建输入不接受 Workspace；后端初始化唯一默认源码上下文、Coding Agent 和 Session。归档不得删除历史源码、Snapshot、Build、Release 或 Runtime 历史。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-001, R-STUDIO-010, R-STUDIO-022]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.agent.read:
  domain: appstudio
  module: application-agent
  resource: studio_application_agent, agent_invocation_projection, agent_runtime_projection
  action: read, list, stream
  subject: owner, authorized_editor, system_admin
  description: 查询 StudioApplication 当前 Coding Agent、Session、Invocation 和 Runtime 脱敏投影。
  frontend_usage: 应用工作台 Agent 状态、对话历史、事件流、Runtime 详情/历史和健康。
  backend_enforcement: 先校验应用可见性，再通过当前 generation 的稳定 ID 调用 Agent 内部 owner-scoped 查询；Runtime 历史还必须按 Application grant 限定。不得返回 Workspace、Endpoint、Infra 引用、容器/Provider 信息或模型凭证，也不得使用公共 Platform Agent 查询绕过 kind guard。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-026]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.agent.runtime.logs.read:
  domain: appstudio
  module: application-agent
  resource: agent_runtime_log
  action: read
  subject: owner, authorized_editor, system_admin
  description: 查询 StudioApplication 当前 Coding Agent Runtime 的脱敏日志。
  frontend_usage: Agent Runtime 启动、OpenCode、MCP 和配置故障诊断。
  backend_enforcement: 先校验应用可见性和当前 generation，再通过 Agent Service 与 Infrastructure owner_reference 双重校验；仅返回最近 5000 行快照中的 occurred_at、level、message，不得暴露 Docker source、Infra/容器 ID、路径、地址或 Provider 响应。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-026]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.agent.operate:
  domain: appstudio
  module: application-agent
  resource: studio_application_agent, agent_invocation_projection
  action: send, cancel, suspend, resume, replace
  subject: owner, authorized_editor, system_admin
  description: 通过 StudioApplication 操作当前 Coding Agent。
  frontend_usage: 发送开发指令、取消 Invocation、挂起、恢复和替换 Agent。
  backend_enforcement: 操作当前 generation；替换成功后原子切换新 Agent/Session 并保留旧历史，失败不得清空旧引用。所有 Invocation 通过 Task Center 执行。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.source.read:
  domain: appstudio
  module: source
  resource: studio_application_source, studio_source_file
  action: read, list, search
  subject: owner, authorized_editor, bound_coding_agent, system_admin
  description: 按 StudioApplication 查询源码状态、Revision、文件索引和受控文件内容。
  frontend_usage: 源码浏览、搜索和 Revision 展示。
  backend_enforcement: 通过 studio_application_id 解析内部默认 Workspace；Coding Agent 还必须通过固定绑定和短期 Tool 授权；禁止返回 Workspace ID 或 storage_ref。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-003, R-STUDIO-010, R-STUDIO-022]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.source.write:
  domain: appstudio
  module: source
  resource: studio_change_set, studio_source_revision
  action: apply_change_set, restore_revision
  subject: owner, authorized_editor, bound_coding_agent, system_admin
  description: 按 StudioApplication 原子应用 ChangeSet 或恢复历史源码 Revision。
  frontend_usage: 受控源码修改和恢复。
  backend_enforcement: 必须校验 base_revision、路径、依赖、危险代码、大小和幂等键；冲突不得自动合并。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-003, R-STUDIO-010, R-STUDIO-022]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.snapshot.manage:
  domain: appstudio
  module: source-version
  resource: studio_source_snapshot, studio_application_version
  action: create, read
  subject: owner, authorized_editor, system_admin
  description: 创建和读取不可变源码 Snapshot/Version。
  frontend_usage: 版本和 Snapshot 入口。
  backend_enforcement: Build 只能使用 READY Snapshot，Snapshot/Version 创建后不可换绑。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-010, R-STUDIO-011]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.build.manage:
  domain: appstudio
  module: build
  resource: studio_build
  action: create, read, cancel, retry
  subject: owner, authorized_editor, system_admin
  description: 从固定 Snapshot 创建和观察 Build，并提供受控 StudioBuild producer 摘要。
  frontend_usage: 构建、诊断和取消；Asset Library 使用同一权限读取一跳摘要。
  backend_enforcement: owner、authorized_editor 与 system_admin 只在各自 Build 授权范围内可见；批量摘要限制 1..200 项、保持请求顺序，仅返回 id/owner_user_id/name/status，不存在或不可见统一返回 null。受信服务调用还必须携带原任务 authorization_ref 并按委托用户重新校验，不得仅凭服务身份绕过用户权限。Task 状态由 task-center 拥有，Artifact 由 asset-library 拥有且继续按 Artifact owner 校验；Build authorized_editor 或管理员角色不继承 Artifact 权限。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-011, R-STUDIO-017, R-STUDIO-018]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.preview.operate:
  domain: appstudio
  module: preview
  resource: studio_preview_runtime
  action: read, check, refresh, stop
  subject: owner, authorized_editor, bound_coding_agent, system_admin
  description: 管理基于应用当前源码 Revision 的 Preview。
  frontend_usage: 预览、刷新和诊断。
  backend_enforcement: Preview 不创建正式 Snapshot、Artifact、Release，Coding Agent 需额外 Tool 授权。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-009, R-STUDIO-010, R-STUDIO-023, R-STUDIO-024]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.runtime_config.manage:
  domain: appstudio
  module: release-runtime
  resource: studio_runtime_config
  action: read, replace
  subject: owner, authorized_deployer, system_admin
  description: 管理公开配置和 Secret/Integration 引用。
  frontend_usage: 环境配置入口。
  backend_enforcement: 只保存引用和校验状态；禁止读取、返回或记录 Secret 值。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-008, R-STUDIO-013, R-STUDIO-022]
  related_user_stories: [US-APPSTUDIO-001]
appstudio.release.manage:
  domain: appstudio
  module: release-runtime
  resource: studio_release, studio_runtime_instance
  action: create, read, rollback, deploy
  subject: owner, authorized_deployer, system_admin
  description: 创建、部署、查询和回滚固定 Artifact Release。
  frontend_usage: 发布、运行状态、访问入口和回滚。
  backend_enforcement: 只接受成功 Build 和 digest 校验通过的 Artifact；健康切换失败不得影响旧健康实例。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-009, R-STUDIO-013, R-STUDIO-015, R-STUDIO-016, R-STUDIO-018, R-STUDIO-023, R-STUDIO-024]
  related_user_stories: [US-APPSTUDIO-001]
