openapi: 3.0.3
info:
  title: OmniMAM AppStudio API
  version: 0.1.0-draft
  description: >-
    StudioApplication 源码、Workspace Revision、Snapshot、Build、Release 和 Runtime 的 S2 合同。
    业务错误使用 HTTP 200 和稳定 code/value；404 仅表示路由不存在，500 仅表示未预期异常。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - {name: studio-applications}
  - {name: studio-workspaces}
  - {name: studio-source-versions}
  - {name: studio-builds}
  - {name: studio-preview}
  - {name: studio-releases}

paths:
  /api/v1/studio-applications:
    get:
      tags: [studio-applications]
      summary: 查询 StudioApplication 列表
      operationId: list_studio_applications
      x-permission: appstudio.application.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001, BR-APPSTUDIO-013]}
      x-error-codes: [ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
        - {$ref: '#/components/parameters/keyword'}
        - {$ref: '#/components/parameters/search_fields'}
        - {$ref: '#/components/parameters/sort_field'}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
        - {name: statuses, in: query, description: 状态逗号分隔。, schema: {type: string}}
      responses:
        '200': {description: StudioApplication 列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioApplicationListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [studio-applications]
      summary: 创建 StudioApplication、源码仓库和默认 Workspace
      operationId: create_studio_application
      x-permission: appstudio.application.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001, BR-APPSTUDIO-002]}
      x-error-codes: [ERR_APPSTUDIO_TEMPLATE_INVALID, ERR_APPSTUDIO_ACCESS_DENIED]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationCreateRequest'}}}}
      responses:
        '200': {description: 已创建的 StudioApplication 或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioApplication'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-applications/{studio_application_id}:
    get:
      tags: [studio-applications]
      summary: 获取 StudioApplication 详情
      operationId: get_studio_application
      x-permission: appstudio.application.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001, BR-APPSTUDIO-002, BR-APPSTUDIO-013]}
      x-error-codes: [ERR_APPSTUDIO_APPLICATION_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      responses:
        '200': {description: StudioApplication 详情或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioApplication'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    patch:
      tags: [studio-applications]
      summary: 更新 StudioApplication
      operationId: update_studio_application
      x-permission: appstudio.application.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001, BR-APPSTUDIO-002]}
      x-error-codes: [ERR_APPSTUDIO_APPLICATION_NOT_VISIBLE, ERR_APPSTUDIO_APPLICATION_STATE_INVALID, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationUpdateRequest'}}}}
      responses:
        '200': {description: 更新后的 StudioApplication 或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioApplication'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-applications/{studio_application_id}/archive:
    post:
      tags: [studio-applications]
      summary: 归档 StudioApplication
      operationId: archive_studio_application
      x-permission: appstudio.application.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-002, BR-APPSTUDIO-013]}
      x-error-codes: [ERR_APPSTUDIO_APPLICATION_NOT_VISIBLE, ERR_APPSTUDIO_APPLICATION_STATE_INVALID, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {$ref: '#/components/requestBodies/ActionReason'}
      responses:
        '200': {description: 归档后的应用；历史 Snapshot、Build、Release 不删除，或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioApplication'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-applications/{studio_application_id}/workspaces:
    get:
      tags: [studio-workspaces]
      summary: 查询 StudioWorkspace 列表
      operationId: list_studio_workspaces
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-002], business_rules: [BR-APPSTUDIO-002, BR-APPSTUDIO-003]}
      x-error-codes: [ERR_APPSTUDIO_APPLICATION_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/studio_application_id'}
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
        - {$ref: '#/components/parameters/keyword'}
        - {$ref: '#/components/parameters/search_fields'}
        - {$ref: '#/components/parameters/sort_field'}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
        - {name: statuses, in: query, description: Workspace 状态逗号分隔。, schema: {type: string}}
      responses:
        '200': {description: Workspace 列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioWorkspaceListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-workspaces/{workspace_id}:
    get:
      tags: [studio-workspaces]
      summary: 获取 StudioWorkspace 详情
      operationId: get_studio_workspace
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-002], business_rules: [BR-APPSTUDIO-002, BR-APPSTUDIO-003]}
      x-error-codes: [ERR_APPSTUDIO_WORKSPACE_NOT_VISIBLE, ERR_APPSTUDIO_WORKSPACE_TOOL_AUTH_FAILED, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/workspace_id'}
        - {$ref: '#/components/parameters/workspace_tool_authorization'}
      responses:
        '200': {description: Workspace 详情，不返回 storage_ref，或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioWorkspace'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-workspaces/{workspace_id}/files:
    get:
      tags: [studio-workspaces]
      summary: 列出 StudioWorkspace 文件
      operationId: list_studio_workspace_files
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-002], business_rules: [BR-APPSTUDIO-002, BR-APPSTUDIO-003]}
      x-error-codes: [ERR_APPSTUDIO_WORKSPACE_NOT_VISIBLE, ERR_APPSTUDIO_WORKSPACE_STATE_INVALID, ERR_APPSTUDIO_WORKSPACE_TOOL_AUTH_FAILED, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/workspace_id'}
        - {$ref: '#/components/parameters/workspace_tool_authorization'}
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
        - {$ref: '#/components/parameters/keyword'}
        - {name: search_fields, in: query, schema: {type: string, default: 'path,name'}}
        - {name: sort_field, in: query, schema: {type: string, enum: [path,updated_at,size_bytes], default: path}}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
        - {name: path_prefix, in: query, schema: {type: string}, description: 相对 Workspace 根目录的路径前缀。}
      responses:
        '200': {description: 文件索引列表或业务错误；不包含文件内容和存储位置。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioSourceFileListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-workspaces/{workspace_id}/file-content:
    get:
      tags: [studio-workspaces]
      summary: 读取 StudioWorkspace 文件内容
      operationId: read_studio_workspace_file
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-002], business_rules: [BR-APPSTUDIO-002, BR-APPSTUDIO-003]}
      x-error-codes: [ERR_APPSTUDIO_WORKSPACE_NOT_VISIBLE, ERR_APPSTUDIO_WORKSPACE_STATE_INVALID, ERR_APPSTUDIO_WORKSPACE_TOOL_AUTH_FAILED, ERR_APPSTUDIO_FILE_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/workspace_id'}
        - {$ref: '#/components/parameters/workspace_tool_authorization'}
        - {name: path, in: query, required: true, schema: {type: string, minLength: 1}, description: 受控相对路径，不允许绝对路径或 `..`。}
        - {name: revision, in: query, required: false, schema: {type: integer, minimum: 1}, description: 省略时读取当前 Revision。}
      responses:
        '200': {description: 文件内容、digest 与 Revision，或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioFileContent'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-workspaces/{workspace_id}/search:
    get:
      tags: [studio-workspaces]
      summary: 搜索 StudioWorkspace 文件内容
      operationId: search_studio_workspace_files
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-002], business_rules: [BR-APPSTUDIO-002, BR-APPSTUDIO-003]}
      x-error-codes: [ERR_APPSTUDIO_WORKSPACE_NOT_VISIBLE, ERR_APPSTUDIO_WORKSPACE_STATE_INVALID, ERR_APPSTUDIO_WORKSPACE_TOOL_AUTH_FAILED, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/workspace_id'}
        - {$ref: '#/components/parameters/workspace_tool_authorization'}
        - {$ref: '#/components/parameters/page_num'}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: keyword, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: search_fields, in: query, schema: {type: string, default: 'path,content'}}
        - {name: sort_field, in: query, schema: {type: string, enum: [path,line_no], default: path}}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
        - {name: path_prefix, in: query, schema: {type: string}}
      responses:
        '200': {description: 权限裁剪的匹配片段或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioSearchResultListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-workspaces/{workspace_id}/change-sets:
    get:
      tags: [studio-workspaces]
      summary: 查询 StudioChangeSet 历史
      operationId: list_studio_change_sets
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-003], business_rules: [BR-APPSTUDIO-003, BR-APPSTUDIO-004]}
      x-error-codes: [ERR_APPSTUDIO_WORKSPACE_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/workspace_id'}
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
        - {$ref: '#/components/parameters/keyword'}
        - {$ref: '#/components/parameters/search_fields'}
        - {$ref: '#/components/parameters/sort_field'}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
        - {name: statuses, in: query, description: ChangeSet 状态逗号分隔。, schema: {type: string}}
      responses:
        '200': {description: ChangeSet 历史或业务错误；不返回完整源码正文。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioChangeSetListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [studio-workspaces]
      summary: 原子应用 StudioChangeSet
      operationId: apply_studio_change_set
      x-permission: appstudio.workspace.write
      x-s1-refs: {user_stories: [US-APPSTUDIO-003], business_rules: [BR-APPSTUDIO-003, BR-APPSTUDIO-004, BR-APPSTUDIO-010, BR-APPSTUDIO-013]}
      x-error-codes: [ERR_APPSTUDIO_WORKSPACE_NOT_VISIBLE, ERR_APPSTUDIO_WORKSPACE_STATE_INVALID, ERR_APPSTUDIO_WORKSPACE_TOOL_AUTH_FAILED, ERR_APPSTUDIO_WORKSPACE_REVISION_CONFLICT, ERR_APPSTUDIO_CHANGESET_INVALID, ERR_APPSTUDIO_PROTECTED_FILE_CHANGE, ERR_APPSTUDIO_DANGEROUS_CHANGE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/workspace_id'}
        - {$ref: '#/components/parameters/workspace_tool_authorization'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioChangeSetCreateRequest'}}}}
      responses:
        '200': {description: 已应用 ChangeSet 或完整失败结果；任何失败都不产生 target_revision。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioChangeSet'}, {$ref: '#/components/schemas/RevisionConflictError'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-workspaces/{workspace_id}/restore:
    post:
      tags: [studio-workspaces]
      summary: 从历史 Revision 创建新的恢复 Revision
      operationId: restore_studio_workspace_revision
      x-permission: appstudio.workspace.write
      x-s1-refs: {user_stories: [US-APPSTUDIO-003], business_rules: [BR-APPSTUDIO-004]}
      x-error-codes: [ERR_APPSTUDIO_WORKSPACE_NOT_VISIBLE, ERR_APPSTUDIO_WORKSPACE_STATE_INVALID, ERR_APPSTUDIO_WORKSPACE_REVISION_CONFLICT, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/workspace_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceRestoreRequest'}}}}
      responses:
        '200': {description: 新 Revision 摘要或业务错误；历史 Revision 不删除。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/WorkspaceRevision'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-workspaces/{workspace_id}/source-snapshots:
    get:
      tags: [studio-source-versions]
      summary: 查询 Workspace Source Snapshot
      operationId: list_studio_source_snapshots
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-004], business_rules: [BR-APPSTUDIO-005, BR-APPSTUDIO-006]}
      x-error-codes: [ERR_APPSTUDIO_WORKSPACE_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/workspace_id'}
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
        - {$ref: '#/components/parameters/keyword'}
        - {$ref: '#/components/parameters/search_fields'}
        - {$ref: '#/components/parameters/sort_field'}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
      responses:
        '200': {description: Snapshot 列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioSourceSnapshotListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [studio-source-versions]
      summary: 从当前 Workspace Revision 创建不可变 Snapshot
      operationId: create_studio_source_snapshot
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-004], business_rules: [BR-APPSTUDIO-004, BR-APPSTUDIO-005]}
      x-error-codes: [ERR_APPSTUDIO_WORKSPACE_NOT_VISIBLE, ERR_APPSTUDIO_WORKSPACE_STATE_INVALID, ERR_APPSTUDIO_WORKSPACE_REVISION_CONFLICT, ERR_APPSTUDIO_SNAPSHOT_CREATION_FAILED, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/workspace_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioSourceSnapshotCreateRequest'}}}}
      responses:
        '200': {description: Snapshot 或业务错误；失败不得留下可供 Build 使用的部分 Snapshot。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioSourceSnapshot'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-source-snapshots/{source_snapshot_id}:
    get:
      tags: [studio-source-versions]
      summary: 获取 StudioSourceSnapshot
      operationId: get_studio_source_snapshot
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-004, US-APPSTUDIO-005], business_rules: [BR-APPSTUDIO-005, BR-APPSTUDIO-006]}
      x-error-codes: [ERR_APPSTUDIO_SNAPSHOT_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/source_snapshot_id'}]
      responses:
        '200': {description: Snapshot 详情，不返回 storage_ref，或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioSourceSnapshot'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-applications/{studio_application_id}/versions:
    get:
      tags: [studio-source-versions]
      summary: 查询 StudioApplicationVersion
      operationId: list_studio_application_versions
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-004], business_rules: [BR-APPSTUDIO-005, BR-APPSTUDIO-006]}
      x-error-codes: [ERR_APPSTUDIO_APPLICATION_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/studio_application_id'}
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
        - {$ref: '#/components/parameters/keyword'}
        - {$ref: '#/components/parameters/search_fields'}
        - {$ref: '#/components/parameters/sort_field'}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
      responses:
        '200': {description: Version 列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioApplicationVersionListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [studio-source-versions]
      summary: 创建 StudioApplicationVersion
      operationId: create_studio_application_version
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-004], business_rules: [BR-APPSTUDIO-005, BR-APPSTUDIO-006]}
      x-error-codes: [ERR_APPSTUDIO_APPLICATION_NOT_VISIBLE, ERR_APPSTUDIO_SNAPSHOT_NOT_VISIBLE, ERR_APPSTUDIO_VERSION_INVALID, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationVersionCreateRequest'}}}}
      responses:
        '200': {description: 固定 Snapshot 的 Version 或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioApplicationVersion'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-applications/{studio_application_id}/builds:
    get:
      tags: [studio-builds]
      summary: 查询 StudioBuild 列表
      operationId: list_studio_builds
      x-permission: appstudio.build.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-005], business_rules: [BR-APPSTUDIO-005, BR-APPSTUDIO-007, BR-APPSTUDIO-008]}
      x-error-codes: [ERR_APPSTUDIO_APPLICATION_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/studio_application_id'}
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
        - {$ref: '#/components/parameters/keyword'}
        - {$ref: '#/components/parameters/search_fields'}
        - {$ref: '#/components/parameters/sort_field'}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
        - {name: statuses, in: query, description: Build 状态逗号分隔。, schema: {type: string}}
      responses:
        '200': {description: Build 列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioBuildListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [studio-builds]
      summary: 从 Source Snapshot 创建 StudioBuild
      operationId: create_studio_build
      x-permission: appstudio.build.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-005], business_rules: [BR-APPSTUDIO-005, BR-APPSTUDIO-006, BR-APPSTUDIO-007, BR-APPSTUDIO-008, BR-APPSTUDIO-013]}
      x-error-codes: [ERR_APPSTUDIO_APPLICATION_NOT_VISIBLE, ERR_APPSTUDIO_SNAPSHOT_NOT_VISIBLE, ERR_APPSTUDIO_BUILD_SOURCE_INVALID, ERR_APPSTUDIO_BUILD_TASK_UNAVAILABLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioBuildCreateRequest'}}}}
      responses:
        '200': {description: 已绑定 TaskGroup/AtomicTask 的 Build 或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioBuild'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-builds/{studio_build_id}:
