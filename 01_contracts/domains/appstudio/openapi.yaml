components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    studio_application_id: {name: studio_application_id, in: path, required: true, schema: {type: string}}
    source_snapshot_id: {name: source_snapshot_id, in: path, required: true, schema: {type: string}}
    studio_build_id: {name: studio_build_id, in: path, required: true, schema: {type: string}}
    studio_application_version_id: {name: studio_application_version_id, in: path, required: true, schema: {type: string}}
    studio_release_id: {name: studio_release_id, in: path, required: true, schema: {type: string}}
    studio_runtime_instance_id: {name: studio_runtime_instance_id, in: path, required: true, schema: {type: string}}
    agent_invocation_id: {name: agent_invocation_id, in: path, required: true, schema: {type: string}}
    environment: {name: environment, in: path, required: true, schema: {type: string, enum: [preview, production]}}
    page_num: {name: page_num, in: query, schema: {type: integer, minimum: 0, default: 0}}
    page_size: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    runtime_health_probe: {name: probe, in: query, required: false, schema: {type: boolean, default: false}, description: false 读取持久化健康投影，true 执行只读实时探测。}
    keyword: {name: keyword, in: query, schema: {type: string, maxLength: 256}}
    last_event_id: {name: Last-Event-ID, in: header, required: false, schema: {type: string, pattern: '^(0|[1-9][0-9]*)$'}, description: 非负十进制恢复游标；只重放 sequence_no 严格大于该值的事件，0 表示从第一条开始；非法值按既有请求校验语义拒绝。, x-naming-exception: SSE 标准请求头，必须保留协议原始拼写。}
  responses: {UnexpectedError: {description: 未预期服务异常。, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  schemas:
    StudioApplication:
      type: object
      required: [id, name, status, created_at, updated_at]
      properties: {id: {type: string}, name: {type: string}, description: {type: string}, status: {type: string, enum: [CREATING, READY, ARCHIVED, ERROR]}, current_version_id: {type: string, nullable: true}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    StudioApplicationCreateRequest:
      type: object
      additionalProperties: false
      required: [name, initial_requirement, coding_model_selection, idempotency_key]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        initial_requirement: {type: string, minLength: 1, maxLength: 20000}
        application_type: {type: string, enum: [STATIC_WEB, WEB_WITH_LIGHT_BACKEND], default: STATIC_WEB}
        backend_required: {type: boolean, default: false}
        coding_agent_profile: {type: string, minLength: 1, maxLength: 200}
        coding_model_selection: {$ref: '#/components/schemas/StudioCodingModelSelection'}
        attachments: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/StudioAgentAttachment'}}
        idempotency_key: {type: string, minLength: 1, maxLength: 200}
    StudioApplicationCreateResponse:
      type: object
      additionalProperties: false
      required: [application, coding_agent, initial_invocation]
      properties:
        application: {$ref: '#/components/schemas/StudioApplication'}
        coding_agent: {$ref: '#/components/schemas/StudioAgentStatus'}
        initial_invocation: {$ref: '#/components/schemas/StudioAgentInvocation'}
    StudioCodingModelSelection:
      type: object
      additionalProperties: false
      required: [source_type, source_ref]
      properties:
        source_type: {type: string, enum: [USER_DEFAULT_MODEL, USER_PROVIDER_MODEL, PLATFORM_MODEL]}
        source_ref: {type: string, minLength: 1, maxLength: 500}
    StudioApplicationUpdateRequest:
      type: object
      properties: {name: {type: string, maxLength: 200}, description: {type: string, maxLength: 2000}, resource_version: {type: integer}}
    StudioAgentStatus:
      type: object
      additionalProperties: false
      required: [studio_application_id, agent_id, session_id, generation, status]
      properties:
        studio_application_id: {type: string}
        agent_id: {type: string, description: 当前 generation 的稳定 Agent ID；不允许经公共 Agent API读取 Coding Agent。}
        session_id: {type: string}
        generation: {type: integer, minimum: 1}
        status: {type: string, enum: [CREATING, READY, STARTING, RUNNING, IDLE, SUSPENDED, ERROR, DISABLED, DELETING]}
        current_invocation_id: {type: string, nullable: true}
    StudioAgentRuntime:
      type: object
      additionalProperties: false
      required: [runtime_id, agent_id, generation, state, activity_state, health_status, uptime_seconds, idle_timeout_seconds, maximum_lifetime_seconds]
      properties:
        runtime_id: {type: string, description: AgentRuntimeBinding 稳定 ID；不是 Infrastructure Runtime ID。}
        agent_id: {type: string}
        generation: {type: integer, minimum: 1}
        state: {type: string, enum: [CREATING, STARTING, READY, RUNNING, STOPPING, STOPPED, FAILED, DELETED]}
        activity_state: {type: string, enum: [IDLE, ACTIVE]}
        health_status: {type: string, enum: [HEALTHY, UNHEALTHY, UNKNOWN]}
        started_at: {type: string, format: date-time, nullable: true}
        stopped_at: {type: string, format: date-time, nullable: true}
        last_health_at: {type: string, format: date-time, nullable: true}
        uptime_seconds: {type: integer, format: int64, minimum: 0}
        idle_timeout_seconds: {type: integer, format: int64, enum: [1800]}
        maximum_lifetime_seconds: {type: integer, format: int64, enum: [28800]}
        current_task: {$ref: '#/components/schemas/StudioAgentRuntimeCurrentTask'}
    StudioAgentRuntimeHistoryItem:
      allOf:
        - {$ref: '#/components/schemas/StudioAgentRuntime'}
        - type: object
          additionalProperties: false
          required: [is_current]
          properties: {is_current: {type: boolean}}
    StudioAgentRuntimeCurrentTask:
      type: object
      additionalProperties: false
      required: [id, type, status]
      properties:
        id: {type: string}
        type: {type: string, enum: [CHAT, CODING, TOOL_OPERATION, BACKGROUND_OPERATION]}
        status: {type: string, enum: [QUEUED, STARTING, RUNNING, WAITING_FOR_TOOL, WAITING_FOR_USER, CANCELING]}
        started_at: {type: string, format: date-time, nullable: true}
    StudioAgentRuntimeListResponse:
      type: object
      additionalProperties: false
      required: [total, items]
      properties: {total: {type: integer, minimum: 0}, items: {type: array, items: {$ref: '#/components/schemas/StudioAgentRuntimeHistoryItem'}}}
    StudioAgentRuntimeLogEntry:
      type: object
      additionalProperties: false
      required: [occurred_at, level, message]
      properties: {occurred_at: {type: string, format: date-time}, level: {type: string, enum: [INFO, WARN, ERROR]}, message: {type: string}}
    StudioAgentRuntimeLogListResponse:
      type: object
      additionalProperties: false
      required: [total, items]
      properties: {total: {type: integer, minimum: 0, maximum: 5000}, items: {type: array, items: {$ref: '#/components/schemas/StudioAgentRuntimeLogEntry'}}}
    StudioAgentRuntimeHealth:
      type: object
      additionalProperties: false
      required: [status, source, checked_at]
      properties:
        status: {type: string, enum: [HEALTHY, UNHEALTHY, UNKNOWN]}
        source: {type: string, enum: [PROJECTION, LIVE]}
        checked_at: {type: string, format: date-time}
        reason: {type: string, nullable: true, enum: [NO_HEALTH_OBSERVATION, RUNTIME_NOT_PROVISIONED, RUNTIME_NOT_RUNNING, RUNTIME_SERVICE_UNREACHABLE, RUNTIME_SERVICE_UNHEALTHY, INFRASTRUCTURE_UNAVAILABLE, PROBE_INDETERMINATE], description: 健康时省略或为空。}
    StudioAgentMessageRequest:
      type: object
      additionalProperties: false
