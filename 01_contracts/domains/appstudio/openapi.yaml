    StudioAgentInvocation:
      type: object
      additionalProperties: false
      required: [id, agent_id, session_id, generation, type, status, user_message_id, assistant_message_id, created_at, updated_at]
      properties:
        id: {type: string}
        agent_id: {type: string}
        session_id: {type: string}
        generation: {type: integer, minimum: 1}
        type: {type: string, enum: [CODING]}
