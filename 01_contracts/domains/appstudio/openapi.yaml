        resulting_source_revision: {type: integer, nullable: true, minimum: 0, description: 该 Invocation 所有已应用 ChangeSet 的最大 target_revision。}
        failure_code: {type: string, nullable: true}
        failure_message: {type: string, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
