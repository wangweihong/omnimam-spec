openapi: 3.0.3
info:
  title: OmniMAM AppStudio API
  version: 1.0.0-draft
  description: >-
    StudioApplication、源码 Workspace、Snapshot、Build、Preview、Release 与 RuntimeInstance 的实现契约。
    本文件只按当前 AppStudio S1 生成；旧版 S2 不属于本契约输入。
servers: [{url: /}]
security: [{bearerAuth: []}]
tags: [{name: applications}, {name: workspaces}, {name: builds}, {name: preview}, {name: releases}, {name: runtime}]
paths:
  /api/v1/studio-applications:
    get:
      tags: [applications]
      operationId: list_studio_applications
      summary: 查询 StudioApplication
      x-permission: appstudio.application.read
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-001, R-STUDIO-010], source_sections: ['2.1 StudioApp 与 Application Platform 分离', '17 权限模型']}
      parameters: [{$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}, {$ref: '#/components/parameters/keyword'}]
      responses: {'200': {description: 应用列表。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    post:
      tags: [applications]
      operationId: create_studio_application
      summary: 创建 StudioApplication
      x-permission: appstudio.application.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-001, R-STUDIO-010, R-STUDIO-013], source_sections: ['6 项目创建']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationCreateRequest'}}}}
      responses: {'200': {description: 创建后的应用。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplication'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}:
    parameters: [{$ref: '#/components/parameters/studio_application_id'}]
    get:
      tags: [applications]
      operationId: get_studio_application
      summary: 获取 StudioApplication
      x-permission: appstudio.application.read
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-001, R-STUDIO-010], source_sections: ['5 核心领域对象', '17 权限模型']}
      responses: {'200': {description: StudioApplication。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplication'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    patch:
      tags: [applications]
      operationId: update_studio_application
      summary: 更新应用元数据
      x-permission: appstudio.application.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-001, R-STUDIO-010], source_sections: ['5.1 StudioProject', '16 Agent 与项目生命周期']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationUpdateRequest'}}}}
      responses: {'200': {description: 更新后的应用。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplication'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/archive:
    post:
      tags: [applications]
      operationId: archive_studio_application
      summary: 归档 StudioApplication
      x-permission: appstudio.application.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-010, R-STUDIO-014], source_sections: ['16.1 项目归档']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: 归档后的应用。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplication'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/workspaces:
    get:
      tags: [workspaces]
      operationId: get_studio_application_workspace
      summary: 获取应用 Workspace
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-002, R-STUDIO-003, R-STUDIO-010], source_sections: ['5.3 WorkspaceBinding', '7 Coding Agent 开发']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      responses: {'200': {description: Workspace 摘要。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioWorkspace'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-workspaces/{workspace_id}:
    get:
      tags: [workspaces]
      operationId: get_studio_workspace
      summary: 获取 Workspace
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-002, R-STUDIO-003, R-STUDIO-010], source_sections: ['5.3 WorkspaceBinding', '17 权限模型']}
      parameters: [{$ref: '#/components/parameters/workspace_id'}]
      responses: {'200': {description: Workspace。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioWorkspace'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-workspaces/{workspace_id}/files:
    get:
      tags: [workspaces]
      operationId: list_studio_source_files
      summary: 查询 Workspace 文件索引
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-002, R-STUDIO-003], source_sections: ['3.2 源码不保存到数据库字段']}
      parameters: [{$ref: '#/components/parameters/workspace_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}, {name: revision, in: query, schema: {type: integer}}, {name: prefix, in: query, schema: {type: string}}]
      responses: {'200': {description: 文件索引列表，不返回存储定位。, content: {application/json: {schema: {$ref: '#/components/schemas/SourceFileListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-workspaces/{workspace_id}/file-content:
    get:
      tags: [workspaces]
      operationId: get_studio_file_content
      summary: 读取受控源码文件
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-002, R-STUDIO-003, R-STUDIO-005], source_sections: ['7.4 Coding Agent 权限']}
      parameters: [{$ref: '#/components/parameters/workspace_id'}, {name: path, in: query, required: true, schema: {type: string}}, {name: revision, in: query, schema: {type: integer}}]
      responses: {'200': {description: 文件内容及截断标记。, content: {application/json: {schema: {$ref: '#/components/schemas/FileContent'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-workspaces/{workspace_id}/change-sets:
    post:
      tags: [workspaces]
      operationId: apply_studio_change_set
      summary: 原子应用 ChangeSet
      x-permission: appstudio.workspace.write
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-002, R-STUDIO-003, R-STUDIO-004, R-STUDIO-005], source_sections: ['7.1 发送开发指令', '7.4 Coding Agent 权限']}
      parameters: [{$ref: '#/components/parameters/workspace_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSetRequest'}}}}
      responses: {'200': {description: ChangeSet 和目标 Revision 摘要。, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSet'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-workspaces/{workspace_id}/source-snapshots:
    post:
      tags: [workspaces]
      operationId: create_studio_source_snapshot
      summary: 从 Workspace 创建不可变 Snapshot
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-011, R-STUDIO-012], source_sections: ['10 Build']}
      parameters: [{$ref: '#/components/parameters/workspace_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SnapshotRequest'}}}}
      responses: {'200': {description: Snapshot。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioSourceSnapshot'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-source-snapshots/{source_snapshot_id}:
    get:
      tags: [workspaces]
      operationId: get_studio_source_snapshot
      summary: 获取不可变 Snapshot
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-011, R-STUDIO-012], source_sections: ['5.4 WorkspaceSnapshot', '10 Build']}
      parameters: [{$ref: '#/components/parameters/source_snapshot_id'}]
      responses: {'200': {description: Snapshot。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioSourceSnapshot'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/builds:
    get:
      tags: [builds]
      operationId: list_studio_builds
      summary: 查询 Build
      x-permission: appstudio.build.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-011, R-STUDIO-013], source_sections: ['10 Build']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: Build 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioBuildListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    post:
      tags: [builds]
      operationId: create_studio_build
      summary: 创建 Build
      x-permission: appstudio.build.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-011, R-STUDIO-012, R-STUDIO-013], source_sections: ['10.1 Build 输入', '10.2 Build 输出']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BuildRequest'}}}}
      responses: {'200': {description: Build。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioBuild'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-builds/{studio_build_id}:
    get:
      tags: [builds]
      operationId: get_studio_build
      summary: 获取 Build
      x-permission: appstudio.build.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-011, R-STUDIO-013], source_sections: ['10 Build']}
      parameters: [{$ref: '#/components/parameters/studio_build_id'}]
      responses: {'200': {description: Build。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioBuild'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-builds/{studio_build_id}/cancel:
    post:
      tags: [builds]
      operationId: cancel_studio_build
      summary: 请求取消 Build
      x-permission: appstudio.build.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-013, R-STUDIO-018], source_sections: ['10.3 Build 流程']}
      parameters: [{$ref: '#/components/parameters/studio_build_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: Build。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioBuild'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-workspaces/{workspace_id}/preview-runtime:
    get:
      tags: [preview]
      operationId: get_studio_preview_runtime
      summary: 获取 PreviewRuntime
      x-permission: appstudio.preview.operate
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-004, R-STUDIO-009, R-STUDIO-010], source_sections: ['9 Preview']}
      parameters: [{$ref: '#/components/parameters/workspace_id'}]
      responses: {'200': {description: PreviewRuntime。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioPreviewRuntime'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-workspaces/{workspace_id}/preview-checks:
    post:
      tags: [preview]
      operationId: refresh_studio_preview
      summary: 创建或刷新 Preview
      x-permission: appstudio.preview.operate
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-003, R-STUDIO-004, R-STUDIO-009], source_sections: ['9.2 Preview 流程']}
      parameters: [{$ref: '#/components/parameters/workspace_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/PreviewRequest'}}}}
      responses: {'200': {description: PreviewRuntime。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioPreviewRuntime'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-application-versions/{studio_application_version_id}/runtime-configs/{environment}:
    parameters: [{$ref: '#/components/parameters/studio_application_version_id'}, {$ref: '#/components/parameters/environment'}]
    get:
      tags: [releases]
      operationId: get_runtime_config
      summary: 获取运行配置引用
      x-permission: appstudio.runtime_config.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-008, R-STUDIO-015], source_sections: ['18 Secret 与配置']}
      responses: {'200': {description: 运行配置。, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeConfig'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    put:
      tags: [releases]
      operationId: replace_runtime_config
      summary: 整体替换运行配置
      x-permission: appstudio.runtime_config.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-008, R-STUDIO-015], source_sections: ['18.1 Environment Schema', '18.2 Secret 规则']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeConfigRequest'}}}}
      responses: {'200': {description: 运行配置。, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeConfig'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/releases:
    get:
      tags: [releases]
      operationId: list_studio_releases
      summary: 查询 Release
      x-permission: appstudio.release.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-004, R-STUDIO-009, R-STUDIO-012], source_sections: ['11 Release', '12 发布与 Deployment']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: Release 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioReleaseListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    post:
      tags: [releases]
      operationId: create_studio_release
      summary: 创建并发布 Release
      x-permission: appstudio.release.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-004, R-STUDIO-009, R-STUDIO-012, R-STUDIO-013], source_sections: ['11 Release', '15 Hotfix 与回滚']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseRequest'}}}}
      responses: {'200': {description: Release。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioRelease'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-releases/{studio_release_id}:
    get:
      tags: [releases]
      operationId: get_studio_release
      summary: 获取 Release
      x-permission: appstudio.release.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-009, R-STUDIO-012], source_sections: ['11 Release']}
      parameters: [{$ref: '#/components/parameters/studio_release_id'}]
      responses: {'200': {description: Release。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioRelease'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-releases/{studio_release_id}/rollback:
    post:
      tags: [releases]
      operationId: rollback_studio_release
      summary: 从历史 Release 创建回滚 Release
      x-permission: appstudio.release.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-012, R-STUDIO-013], source_sections: ['15.2 回滚']}
      parameters: [{$ref: '#/components/parameters/studio_release_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: 新 Release。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioRelease'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-workspaces/{workspace_id}/search:
    get:
      tags: [workspaces]
      operationId: search_studio_workspace
      summary: 搜索受控源码文件
      x-permission: appstudio.workspace.read
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-002, R-STUDIO-003, R-STUDIO-005], source_sections: ['7 Coding Agent 开发']}
      parameters: [{$ref: '#/components/parameters/workspace_id'}, {name: query, in: query, required: true, schema: {type: string, maxLength: 256}}, {name: revision, in: query, schema: {type: integer}}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: 搜索结果。, content: {application/json: {schema: {$ref: '#/components/schemas/SourceSearchResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-workspaces/{workspace_id}/restore:
    post:
      tags: [workspaces]
      operationId: restore_studio_workspace_revision
      summary: 从历史 Revision 创建当前新 Revision
      x-permission: appstudio.workspace.write
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-003, R-STUDIO-004], source_sections: ['7.3 AppStudio 保存的信息']}
      parameters: [{$ref: '#/components/parameters/workspace_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RestoreRevisionRequest'}}}}
      responses: {'200': {description: 新 Revision 摘要。, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSet'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/versions:
    get:
      tags: [applications]
      operationId: list_studio_application_versions
      summary: 查询 StudioApplicationVersion
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-011, R-STUDIO-012], source_sections: ['5.4 WorkspaceSnapshot', '10 Build']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: Version 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationVersionListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-builds/{studio_build_id}/logs:
    get:
      tags: [builds]
      operationId: get_studio_build_logs
      summary: 查询 Build 脱敏日志
      x-permission: appstudio.build.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-004, R-STUDIO-013], source_sections: ['10.3 Build 流程']}
      parameters: [{$ref: '#/components/parameters/studio_build_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: Build 日志页。, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeLogListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-runtime-instances/{studio_runtime_instance_id}:
    get:
      tags: [runtime]
      operationId: get_studio_runtime_instance
      summary: 获取 StudioRuntimeInstance
      x-permission: appstudio.release.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-004, R-STUDIO-009, R-STUDIO-012], source_sections: ['12 发布与 Deployment']}
      parameters: [{$ref: '#/components/parameters/studio_runtime_instance_id'}]
      responses: {'200': {description: RuntimeInstance；入口字段为受控摘要。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioRuntimeInstance'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-runtime-instances/{studio_runtime_instance_id}/logs:
    get:
      tags: [runtime]
      operationId: get_studio_runtime_logs
      summary: 查询 RuntimeInstance 脱敏日志
      x-permission: appstudio.release.manage
      x-s1-refs: {user_stories: [], business_rules: [R-STUDIO-004, R-STUDIO-009, R-STUDIO-012], source_sections: ['12 发布与 Deployment']}
      parameters: [{$ref: '#/components/parameters/studio_runtime_instance_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: Runtime 日志页。, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeLogListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    studio_application_id: {name: studio_application_id, in: path, required: true, schema: {type: string}}
    workspace_id: {name: workspace_id, in: path, required: true, schema: {type: string}}
    source_snapshot_id: {name: source_snapshot_id, in: path, required: true, schema: {type: string}}
    studio_build_id: {name: studio_build_id, in: path, required: true, schema: {type: string}}
    studio_application_version_id: {name: studio_application_version_id, in: path, required: true, schema: {type: string}}
    studio_release_id: {name: studio_release_id, in: path, required: true, schema: {type: string}}
    studio_runtime_instance_id: {name: studio_runtime_instance_id, in: path, required: true, schema: {type: string}}
    environment: {name: environment, in: path, required: true, schema: {type: string, enum: [preview, production]}}
    page_num: {name: page_num, in: query, schema: {type: integer, minimum: 0, default: 0}}
    page_size: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    keyword: {name: keyword, in: query, schema: {type: string, maxLength: 256}}
  responses: {UnexpectedError: {description: 未预期服务异常。, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  schemas:
    StudioApplication:
      type: object
      required: [id, name, status, workspace_id, created_at, updated_at]
      properties: {id: {type: string}, name: {type: string}, description: {type: string}, status: {type: string, enum: [CREATING, READY, ARCHIVED, ERROR]}, workspace_id: {type: string}, current_version_id: {type: string, nullable: true}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    StudioApplicationCreateRequest:
      type: object
      required: [name]
      properties: {name: {type: string, minLength: 1, maxLength: 200}, description: {type: string, maxLength: 2000}, template_id: {type: string}, technology_stack: {type: string}}
    StudioApplicationUpdateRequest:
      type: object
      properties: {name: {type: string, maxLength: 200}, description: {type: string, maxLength: 2000}, resource_version: {type: integer}}
    StudioWorkspace:
      type: object
      required: [id, studio_application_id, current_revision, status, created_at, updated_at]
