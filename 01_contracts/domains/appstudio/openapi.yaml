      x-s1-refs: {user_stories: [US-APPSTUDIO-007, US-APPSTUDIO-009], business_rules: [BR-APPSTUDIO-008, BR-APPSTUDIO-009, BR-APPSTUDIO-010, BR-APPSTUDIO-011, BR-APPSTUDIO-013]}
      x-error-codes: [ERR_APPSTUDIO_APPLICATION_NOT_VISIBLE, ERR_APPSTUDIO_BUILD_NOT_VISIBLE, ERR_APPSTUDIO_BUILD_STATE_INVALID, ERR_APPSTUDIO_BUILD_ARTIFACT_INVALID, ERR_APPSTUDIO_RELEASE_CONFIG_INVALID, ERR_APPSTUDIO_DEPLOYMENT_PROVIDER_UNAVAILABLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioReleaseCreateRequest'}}}}
      responses:
        '200': {description: 已固定 Artifact digest 的 Release 或业务错误；新实例健康前不切换访问入口。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioRelease'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-releases/{studio_release_id}:
    get:
      tags: [studio-releases]
      summary: 获取 StudioRelease 详情
      operationId: get_studio_release
      x-permission: appstudio.release.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-007, US-APPSTUDIO-008], business_rules: [BR-APPSTUDIO-009, BR-APPSTUDIO-011, BR-APPSTUDIO-012]}
      x-error-codes: [ERR_APPSTUDIO_RELEASE_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/studio_release_id'}]
      responses:
        '200': {description: Release 与 Runtime 一跳摘要或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioRelease'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-releases/{studio_release_id}/rollback:
    post:
      tags: [studio-releases]
      summary: 从历史 Release 创建回滚 Release
      operationId: rollback_studio_release
      x-permission: appstudio.release.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-008], business_rules: [BR-APPSTUDIO-008, BR-APPSTUDIO-011, BR-APPSTUDIO-012]}
      x-error-codes: [ERR_APPSTUDIO_RELEASE_NOT_VISIBLE, ERR_APPSTUDIO_ROLLBACK_SOURCE_INVALID, ERR_APPSTUDIO_RELEASE_CONFIG_INVALID, ERR_APPSTUDIO_DEPLOYMENT_PROVIDER_UNAVAILABLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/studio_release_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioRollbackRequest'}}}}
      responses:
        '200': {description: 新的回滚 Release 或业务错误；原 Release 历史不变。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioRelease'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-runtime-instances/{studio_runtime_instance_id}:
    get:
      tags: [studio-releases]
      summary: 获取 StudioRuntimeInstance
      operationId: get_studio_runtime_instance
      x-permission: appstudio.release.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-007, US-APPSTUDIO-008], business_rules: [BR-APPSTUDIO-009, BR-APPSTUDIO-011, BR-APPSTUDIO-012]}
      x-error-codes: [ERR_APPSTUDIO_RELEASE_NOT_VISIBLE, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters: [{$ref: '#/components/parameters/studio_runtime_instance_id'}]
      responses:
        '200': {description: RuntimeInstance 权限裁剪详情或业务错误；不返回 provider_runtime_id。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioRuntimeInstance'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    studio_application_id: {name: studio_application_id, in: path, required: true, schema: {type: string}}
    workspace_id: {name: workspace_id, in: path, required: true, schema: {type: string}}
    source_snapshot_id: {name: source_snapshot_id, in: path, required: true, schema: {type: string}}
    studio_build_id: {name: studio_build_id, in: path, required: true, schema: {type: string}}
    studio_application_version_id: {name: studio_application_version_id, in: path, required: true, schema: {type: string}}
    studio_release_id: {name: studio_release_id, in: path, required: true, schema: {type: string}}
    studio_runtime_instance_id: {name: studio_runtime_instance_id, in: path, required: true, schema: {type: string}}
    environment: {name: environment, in: path, required: true, schema: {type: string, enum: [preview, production]}}
    workspace_tool_authorization:
      name: X-Workspace-Tool-Authorization
      in: header
      required: false
      schema: {type: string}
      x-naming-exception: AppStudio 内部安全 Header 的稳定协议名；仅此 Header 使用连字符与首字母大写。
      description: >-
        Coding Agent 调用时必填的短期有界授权；用户交互请求使用 Identity/RBAC，不发送此 Header。
        服务端必须绑定 Principal、Agent、Session、Invocation、Workspace、动作和有效期，且不得记录其值。
    page_num: {name: page_num, in: query, schema: {type: integer, minimum: 0, default: 0}}
    page_size: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
    keyword: {name: keyword, in: query, schema: {type: string, default: '', maxLength: 256}}
    search_fields: {name: search_fields, in: query, schema: {type: string, default: 'name,description'}}
    sort_field: {name: sort_field, in: query, schema: {type: string, default: created_at}, description: '允许 created_at,updated_at,name；逗号分隔多字段。'}
    sort_order: {name: sort_order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
    created_after: {name: created_after, in: query, schema: {type: string, format: date-time}}
    created_before: {name: created_before, in: query, schema: {type: string, format: date-time}}
  requestBodies:
    ActionReason:
      required: false
      content: {application/json: {schema: {$ref: '#/components/schemas/ActionReason'}}}
  responses:
    UnexpectedError:
      description: 未预期服务器异常。
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, value, message, messages, retryable]
      properties:
        code: {type: string, pattern: '^ERR_APPSTUDIO_'}
        value: {type: integer}
        message: {type: string}
        messages:
          type: object
          additionalProperties: false
          x-naming-exception: BCP 47 语言标签必须保留 `zh-CN` 与 `en-US`。
          required: [zh-CN, en-US]
          properties: {zh-CN: {type: string}, en-US: {type: string}}
        retryable: {type: boolean}
        detail: {type: string}
        data: {type: object, additionalProperties: true}
    RevisionConflictError:
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - type: object
          properties:
            code: {type: string, enum: [ERR_APPSTUDIO_WORKSPACE_REVISION_CONFLICT]}
            value: {type: integer, enum: [210403]}
            data:
              type: object
              additionalProperties: false
              required: [workspace_id, base_revision, current_revision]
              properties:
                workspace_id: {type: string}
                base_revision: {type: integer}
                current_revision: {type: integer}
                current_revision_summary: {$ref: '#/components/schemas/WorkspaceRevision'}
    ActionReason:
      type: object
      additionalProperties: false
      properties: {reason: {type: string, maxLength: 512}}
    EndpointSummary:
      type: object
      additionalProperties: false
      properties:
        url: {type: string, format: uri}
        hostname: {type: string}
      description: 只返回当前用户可访问的受控入口；不含私网地址、签名 Query 或 Provider 配置。
    StudioApplicationSummary:
      type: object
      additionalProperties: false
      required: [id, name, status, runtime_profile]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, enum: [CREATING, READY, ERROR, ARCHIVED]}
        runtime_profile: {type: string}
    StudioWorkspaceSummary:
      type: object
      additionalProperties: false
      required: [id, name, status, current_revision]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, enum: [initializing, ready, modifying, previewing, conflicted, locked, archived]}
        current_revision: {type: integer}
    StudioReleaseSummary:
      type: object
      additionalProperties: false
      required: [id, environment, status, artifact_digest]
      properties:
        id: {type: string}
        environment: {type: string, enum: [preview, production]}
        status: {type: string, enum: [pending, deploying, ready, failed, superseded]}
        artifact_digest: {type: string}
        endpoint: {type: object, allOf: [{$ref: '#/components/schemas/EndpointSummary'}], nullable: true}
    StudioApplication:
      type: object
      additionalProperties: false
      required: [id, name, description, owner_user_id, status, technology_profile, runtime_profile, default_workspace_id, default_workspace, resource_version, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        owner_user_id: {type: string, description: 当前资源所有者；无需递归展开 Identity。}
        status: {type: string, enum: [CREATING, READY, ERROR, ARCHIVED]}
        status_reason_code: {type: string, nullable: true}
        technology_profile: {type: string}
        runtime_profile: {type: string}
        source_repository_id: {type: string, description: AppStudio 内部逻辑仓库 ID；客户端无需读取存储实现。}
        default_workspace_id: {type: string}
        default_workspace: {$ref: '#/components/schemas/StudioWorkspaceSummary'}
        current_production_release_id: {type: string, nullable: true}
        current_production_release: {type: object, allOf: [{$ref: '#/components/schemas/StudioReleaseSummary'}], nullable: true}
        current_preview_release_id: {type: string, nullable: true}
        current_preview_release: {type: object, allOf: [{$ref: '#/components/schemas/StudioReleaseSummary'}], nullable: true}
        archived_at: {type: string, format: date-time, nullable: true}
        resource_version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    StudioApplicationCreateRequest:
      type: object
      additionalProperties: false
      required: [name, template_id, idempotency_key]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048, default: ''}
        template_id: {type: string, description: 平台受控生成应用模板 ID；不是 application-platform ApplicationTemplate。}
        technology_profile: {type: string, default: typescript_light_bff}
        runtime_profile: {type: string, default: web_light_bff}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
    StudioApplicationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2048}
        resource_version: {type: integer, minimum: 0}
    StudioApplicationListResponse:
      type: object
      additionalProperties: false
      required: [total, items]
      properties: {total: {type: integer, minimum: 0}, items: {type: array, items: {$ref: '#/components/schemas/StudioApplication'}}}
    StudioPreviewRuntimeSummary:
      type: object
      additionalProperties: false
      required: [id, workspace_revision, status]
      properties:
        id: {type: string}
        workspace_revision: {type: integer}
        status: {type: string, enum: [starting, running, refreshing, failed, stopped, expired]}
        endpoint: {type: object, allOf: [{$ref: '#/components/schemas/EndpointSummary'}], nullable: true}
    StudioWorkspace:
      type: object
      additionalProperties: false
      required: [id, name, description, studio_application_id, studio_application, source_repository_id, current_revision, status, resource_version, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        studio_application_id: {type: string}
        studio_application: {$ref: '#/components/schemas/StudioApplicationSummary'}
        source_repository_id: {type: string, description: 同一 AppStudio 聚合内部 ID；不展开 storage_ref。}
        base_snapshot_id: {type: string, nullable: true}
        base_snapshot: {type: object, allOf: [{$ref: '#/components/schemas/StudioSourceSnapshotSummary'}], nullable: true}
        current_revision: {type: integer}
        preview_runtime_id: {type: string, nullable: true}
        preview_runtime: {type: object, allOf: [{$ref: '#/components/schemas/StudioPreviewRuntimeSummary'}], nullable: true}
        status: {type: string, enum: [initializing, ready, modifying, previewing, conflicted, locked, archived]}
        status_reason_code: {type: string, nullable: true}
        resource_version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      description: storage_ref、源码存储位置和锁实现细节永不公开。
    StudioWorkspaceListResponse:
      type: object
      additionalProperties: false
      required: [total, items]
      properties: {total: {type: integer, minimum: 0}, items: {type: array, items: {$ref: '#/components/schemas/StudioWorkspace'}}}
    StudioSourceFile:
      type: object
      additionalProperties: false
      required: [id, path, name, file_type, size_bytes, indexed_revision, protected, updated_at]
      properties:
        id: {type: string}
        path: {type: string}
        name: {type: string}
        file_type: {type: string, enum: [file, directory]}
        content_digest: {type: string, nullable: true}
        size_bytes: {type: integer, format: int64}
        indexed_revision: {type: integer}
        protected: {type: boolean}
        updated_at: {type: string, format: date-time}
    StudioSourceFileListResponse:
      type: object
      additionalProperties: false
      required: [total, items]
      properties: {total: {type: integer, minimum: 0}, items: {type: array, items: {$ref: '#/components/schemas/StudioSourceFile'}}}
    StudioFileContent:
      type: object
      additionalProperties: false
      required: [workspace_id, revision, path, content, content_digest]
      properties:
        workspace_id: {type: string, description: 当前调用上下文已明确，无需展开。}
        revision: {type: integer}
        path: {type: string}
        content: {type: string}
        content_digest: {type: string}
        truncated: {type: boolean, default: false}
    StudioSearchResult:
      type: object
      additionalProperties: false
      required: [path, line_no, preview]
      properties:
        path: {type: string}
        line_no: {type: integer, minimum: 1}
        preview: {type: string}
    StudioSearchResultListResponse:
      type: object
      additionalProperties: false
      required: [total, items, workspace_revision]
      properties:
        total: {type: integer, minimum: 0}
        items: {type: array, items: {$ref: '#/components/schemas/StudioSearchResult'}}
        workspace_revision: {type: integer}
    AgentActorSummary:
      type: object
      additionalProperties: false
      required: [agent_id, agent_name]
      properties:
        agent_id: {type: string}
        agent_name: {type: string}
        agent_session_id: {type: string, nullable: true}
        agent_invocation_id: {type: string, nullable: true}
      description: 由 Agent 受控批量摘要提供；Agent 不可见或删除时 actor 为 null，稳定 ID 仍保留。
    StudioChangeSet:
      type: object
      additionalProperties: false
