openapi: 3.0.3
info:
  title: OmniMAM AppStudio API
  version: 1.0.0-draft
  description: >-
    StudioApplication、源码、Revision、Snapshot、Build、Preview、Release 与 RuntimeInstance 的公共实现契约。
    StudioWorkspace 是后端内部持久化事实，不作为公共资源、导航层或请求参数暴露。
    本文件只按当前 AppStudio S1 生成；旧版 S2 不属于本契约输入。
servers: [{url: /}]
security: [{bearerAuth: []}]
tags: [{name: applications}, {name: agent}, {name: source}, {name: builds}, {name: preview}, {name: releases}, {name: runtime}]
paths:
  /api/v1/studio-applications:
    get:
      tags: [applications]
      operationId: list_studio_applications
      summary: 查询 StudioApplication
      x-permission: appstudio.application.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-001, R-STUDIO-010], source_sections: ['2.1 StudioApplication 与 Application Platform 分离', '17 权限模型']}
      parameters: [{$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}, {$ref: '#/components/parameters/keyword'}]
      responses: {'200': {description: 应用列表。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    post:
      tags: [applications]
      operationId: create_studio_application
      summary: 创建 StudioApplication
      x-permission: appstudio.application.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-001, R-STUDIO-010], source_sections: ['6 StudioApplication 创建']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationCreateRequest'}}}}
      responses: {'200': {description: 后端已初始化 Repository、默认源码上下文、Coding Agent 和 Session，并返回首次 CODING Invocation 投影。首次 Task 提交失败不回滚 READY 应用。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationCreateResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}:
    parameters: [{$ref: '#/components/parameters/studio_application_id'}]
    get:
      tags: [applications]
      operationId: get_studio_application
      summary: 获取 StudioApplication
      x-permission: appstudio.application.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-001, R-STUDIO-010], source_sections: ['5 核心领域对象', '17 权限模型']}
      responses: {'200': {description: StudioApplication。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplication'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    patch:
      tags: [applications]
      operationId: update_studio_application
      summary: 更新应用元数据
      x-permission: appstudio.application.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-001, R-STUDIO-010], source_sections: ['5.1 StudioApplication', '16 Agent 与 StudioApplication 生命周期']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplicationUpdateRequest'}}}}
      responses: {'200': {description: 更新后的应用。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplication'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/archive:
    post:
      tags: [applications]
      operationId: archive_studio_application
      summary: 归档 StudioApplication
      x-permission: appstudio.application.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-010, R-STUDIO-022], source_sections: ['16.1 StudioApplication 归档']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: 归档后的应用。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioApplication'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent:
    get:
      tags: [agent]
      operationId: get_studio_agent_status
      summary: 查询当前 Coding Agent 状态
      x-permission: appstudio.agent.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001], source_sections: ['7 Coding Agent 开发', '20.2 Agent 协作']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      responses: {'200': {description: 当前 generation 的 Coding Agent/Session 状态；不返回 Workspace 或 Runtime Endpoint。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentStatus'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/runtime:
    get:
      tags: [agent]
      operationId: get_studio_agent_runtime
      summary: 查询当前 Coding Agent Runtime 详情
      description: 选择当前 generation 的最新 Runtime Binding；无关联 Runtime 或不可见时返回既有 Agent Runtime 不可见业务错误。
      x-permission: appstudio.agent.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-020, R-STUDIO-026], source_sections: ['7.6 Coding Agent Runtime 诊断', '19.3 Agent 面板', '20.2 Agent 协作']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      responses: {'200': {description: 当前 generation 的脱敏 Runtime 详情；不返回 Runtime Endpoint、Infra Runtime ID、容器或 Provider 信息。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentRuntime'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/runtimes:
    get:
      tags: [agent]
      operationId: list_studio_agent_runtimes
      summary: 查询 Coding Agent Runtime 历史
      description: 经 AgentRuntimeGrant 查询该 Application 全部 generation，按 Runtime Binding 去重，并按 generation、创建时间和 ID 稳定倒序。
      x-permission: appstudio.agent.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-020, R-STUDIO-026], source_sections: ['7.5 挂起、恢复与替换', '7.6 Coding Agent Runtime 诊断']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: Runtime 历史页；仅当前 generation 选中的最新 Runtime 标记 is_current。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentRuntimeListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/runtime/logs:
    get:
      tags: [agent]
      operationId: list_studio_agent_runtime_logs
      summary: 查询当前 Coding Agent Runtime 脱敏日志
      description: 在 Infrastructure 最近 5000 行有界快照内分页，仅公开 occurred_at、level 和 message。
      x-permission: appstudio.agent.runtime.logs.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-020, R-STUDIO-026], source_sections: ['7.6 Coding Agent Runtime 诊断', '19.3 Agent 面板']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: 当前 Runtime 的脱敏日志页。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentRuntimeLogListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/runtime/health:
    get:
      tags: [agent]
      operationId: get_studio_agent_runtime_health
      summary: 查询当前 Coding Agent Runtime 健康状态
      description: probe=false 读取持久化投影；probe=true 执行只读实时探测。探测故障返回 UNHEALTHY 或 UNKNOWN 的 HTTP 200 DTO，不改变 Runtime 生命周期。
      x-permission: appstudio.agent.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-020, R-STUDIO-026], source_sections: ['7.6 Coding Agent Runtime 诊断', '19.3 Agent 面板']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/runtime_health_probe'}]
      responses: {'200': {description: 投影或实时健康结果；不返回 Endpoint、Infra 或 Provider 数据。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentRuntimeHealth'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/messages:
    get:
      tags: [agent]
      operationId: list_studio_agent_messages
      summary: 查询当前 Coding Agent 消息历史
      description: 仅返回当前 StudioApplication 的当前 Coding Agent generation/session，固定按 created_at DESC、id DESC 稳定排序。
      x-permission: appstudio.agent.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-003, R-STUDIO-020, R-STUDIO-025], source_sections: ['7.1 发送开发指令', '20.2 Agent 协作']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: 当前 generation/session 的消息列表，newest-first。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentMessageListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    post:
      tags: [agent]
      operationId: send_studio_agent_message
      summary: 向当前 Coding Agent 发送开发指令
      x-permission: appstudio.agent.operate
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001], source_sections: ['7.1 发送开发指令', '7.2 开发流程']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentMessageRequest'}}}}
      responses: {'200': {description: 已持久化并绑定 AtomicTask 的 Coding Invocation 投影。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentInvocation'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/invocations:
    get:
      tags: [agent]
      operationId: list_studio_agent_invocations
      summary: 查询当前 Coding Agent Invocation
      x-permission: appstudio.agent.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001], source_sections: ['7 Coding Agent 开发', '20.2 Agent 协作']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: 当前 generation 的 Invocation 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentInvocationListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/invocations/{agent_invocation_id}:
    get:
      tags: [agent]
      operationId: get_studio_agent_invocation
      summary: 查询 Coding Agent Invocation
      x-permission: appstudio.agent.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001], source_sections: ['7 Coding Agent 开发', '20.2 Agent 协作']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/agent_invocation_id'}]
      responses: {'200': {description: Invocation 投影。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentInvocation'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/invocations/{agent_invocation_id}/cancel:
    post:
      tags: [agent]
      operationId: cancel_studio_agent_invocation
      summary: 取消 Coding Agent Invocation
      x-permission: appstudio.agent.operate
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001], source_sections: ['7 Coding Agent 开发', '20.2 Agent 协作']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/agent_invocation_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: 取消请求后的 Invocation 投影。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentInvocation'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/invocations/{agent_invocation_id}/events:
    get:
      tags: [agent]
      operationId: stream_studio_agent_invocation_events
      summary: 订阅 Coding Agent Invocation 事件
      description: 按持久化 sequence_no 重放后继续实时推送；唯一终态事件 flush 后关闭，已终态 Invocation 补完重放后立即关闭。
      x-permission: appstudio.agent.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-003, R-STUDIO-020, R-STUDIO-025], source_sections: ['7.2 开发流程', '20.2 Agent 协作']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/agent_invocation_id'}, {$ref: '#/components/parameters/last_event_id'}]
      responses: {'200': {description: 标准 SSE 事件流；id 为十进制 sequence_no，event 为统一事件名，data 为类型化 JSON envelope；payload 不含 Workspace。, content: {text/event-stream: {schema: {$ref: '#/components/schemas/StudioAgentInvocationEventEnvelope'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/suspend:
    post:
      tags: [agent]
      operationId: suspend_studio_agent
      summary: 挂起当前 Coding Agent
      x-permission: appstudio.agent.operate
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001], source_sections: ['7.5 挂起、恢复与替换']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: 当前 Coding Agent 状态。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentStatus'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/resume:
    post:
      tags: [agent]
      operationId: resume_studio_agent
      summary: 恢复当前 Coding Agent
      x-permission: appstudio.agent.operate
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001], source_sections: ['7.5 挂起、恢复与替换']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: 当前 Coding Agent 状态。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentStatus'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/agent/replace:
    post:
      tags: [agent]
      operationId: replace_studio_agent
      summary: 替换当前 Coding Agent
      x-permission: appstudio.agent.operate
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [BR-APPSTUDIO-001], source_sections: ['7.5 挂起、恢复与替换']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentReplaceRequest'}}}}
      responses: {'200': {description: 新 generation 的 Coding Agent 状态；旧历史保留。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioAgentStatus'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/source:
    get:
      tags: [source]
      operationId: get_studio_source_state
      summary: 获取应用源码状态
      x-permission: appstudio.source.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-003, R-STUDIO-010, R-STUDIO-022], source_sections: ['5.3 StudioWorkspace', '7 Coding Agent 开发']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      responses: {'200': {description: 应用级源码当前 Revision 和状态，不返回内部 Workspace ID。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioSourceState'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/source/files:
    get:
      tags: [source]
      operationId: list_studio_source_files
      summary: 查询应用源码文件索引
      x-permission: appstudio.source.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-003, R-STUDIO-010, R-STUDIO-022], source_sections: ['4.3 Source Repository 与 StudioWorkspace']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}, {name: source_revision, in: query, schema: {type: integer}}, {name: prefix, in: query, schema: {type: string}}]
      responses: {'200': {description: 文件索引列表，不返回存储定位。, content: {application/json: {schema: {$ref: '#/components/schemas/SourceFileListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/source/file-content:
    get:
      tags: [source]
      operationId: get_studio_file_content
      summary: 读取受控源码文件
      x-permission: appstudio.source.read
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-003, R-STUDIO-010, R-STUDIO-022], source_sections: ['7.4 Coding Agent 权限']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {name: path, in: query, required: true, schema: {type: string}}, {name: source_revision, in: query, schema: {type: integer}}]
      responses: {'200': {description: 文件内容及截断标记。, content: {application/json: {schema: {$ref: '#/components/schemas/FileContent'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/source/change-sets:
    post:
      tags: [source]
      operationId: apply_studio_change_set
      summary: 原子应用 ChangeSet
      x-permission: appstudio.source.write
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-003, R-STUDIO-010, R-STUDIO-022], source_sections: ['7.1 发送开发指令', '7.4 Coding Agent 权限']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSetRequest'}}}}
      responses: {'200': {description: ChangeSet 和目标 Revision 摘要。, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSet'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/source-snapshots:
    post:
      tags: [source]
      operationId: create_studio_source_snapshot
      summary: 从应用源码 Revision 创建不可变 Snapshot
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-010, R-STUDIO-011], source_sections: ['10 Build']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SnapshotRequest'}}}}
      responses: {'200': {description: Snapshot。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioSourceSnapshot'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/source-snapshots/{source_snapshot_id}:
    get:
      tags: [source]
      operationId: get_studio_source_snapshot
      summary: 获取不可变 Snapshot
      x-permission: appstudio.snapshot.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-010, R-STUDIO-011], source_sections: ['5.5 StudioSourceSnapshot', '10 Build']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/source_snapshot_id'}]
      responses: {'200': {description: Snapshot。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioSourceSnapshot'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-applications/{studio_application_id}/builds:
    get:
      tags: [builds]
      operationId: list_studio_builds
      summary: 查询 Build
      x-permission: appstudio.build.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-011, R-STUDIO-017, R-STUDIO-018], source_sections: ['10 Build']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: Build 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioBuildListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    post:
      tags: [builds]
      operationId: create_studio_build
      summary: 创建 Build
      x-permission: appstudio.build.manage
      x-s1-refs: {user_stories: [US-APPSTUDIO-001], business_rules: [R-STUDIO-011, R-STUDIO-017, R-STUDIO-018], source_sections: ['10.1 Build 输入', '10.2 Build 输出']}
      parameters: [{$ref: '#/components/parameters/studio_application_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BuildRequest'}}}}
      responses: {'200': {description: Build。, content: {application/json: {schema: {$ref: '#/components/schemas/StudioBuild'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/studio-builds/batch-summaries:
    post:
      tags: [builds]
      operationId: batch_get_studio_build_summaries
      summary: 按调用者可见性批量读取 StudioBuild producer 摘要
      description: >-
        Asset Library 使用当前调用者身份读取 Artifact producer 摘要；受信 Task Worker 在创建 Artifact 时必须在认证上下文携带原 Build Task 的
        authorization_ref，AppStudio 按委托用户执行相同权限校验。不存在或不可见统一返回 studio_build=null，响应严格保持请求顺序。
      x-permission: appstudio.build.manage
