      x-error-codes: [ERR_APPSTUDIO_VERSION_INVALID, ERR_APPSTUDIO_RELEASE_CONFIG_INVALID, ERR_APPSTUDIO_ACCESS_DENIED]
      parameters:
        - {$ref: '#/components/parameters/studio_application_version_id'}
        - {$ref: '#/components/parameters/environment'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudioRuntimeConfigReplaceRequest'}}}}
      responses:
        '200': {description: 保存后的配置引用，或业务错误；响应不包含解析后的 Secret。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/StudioRuntimeConfig'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/studio-applications/{studio_application_id}/releases:
