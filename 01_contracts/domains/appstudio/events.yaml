# 事件追溯使用 US-APPSTUDIO-001/BR-APPSTUDIO-001 及具体 R-STUDIO-* 规则。
studio_application_lifecycle_changed:
  producer: appstudio-application-service
  consumers: [notification-center, sse, audit-service]
  trigger_condition: StudioApplication 创建或状态、元数据发生已持久化变化。
  payload:
    studio_application_id: string
    owner_user_id: string
    from_status: string|null
    to_status: string
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: studio_application_id:resource_version
  retry_policy: appstudio outbox 重试，消费者按版本幂等。
  failure_policy: 事件失败不回滚应用、内部源码上下文或历史事实；通知和 SSE 不得补充 Workspace 字段。
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-001, R-STUDIO-010, R-STUDIO-022]
  related_user_stories: [US-APPSTUDIO-001]
studio_source_revision_changed:
  producer: appstudio-source-service
  consumers: [agent, sse, audit-service]
  trigger_condition: ChangeSet 原子成功、历史恢复或初始化产生新的应用源码 Revision。
  payload:
    studio_application_id: string
    previous_revision: integer|null
    current_revision: integer
    change_set_id: string|null
    agent_id: string|null
    agent_invocation_id: string|null
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: studio_application_id:current_revision
  retry_policy: appstudio outbox 重试，消费者按 StudioApplication/Revision 幂等。
  failure_policy: 不重复应用 ChangeSet；事件可从 Revision 事实重放。
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-003, R-STUDIO-010, R-STUDIO-022]
  related_user_stories: [US-APPSTUDIO-001]
studio_source_snapshot_created:
  producer: appstudio-source-service
  consumers: [appstudio-build-service, audit-service]
  trigger_condition: READY Snapshot 的 digest 和 manifest 摘要已完整持久化。
  payload:
    studio_application_id: string
    source_snapshot_id: string
    source_revision: integer
    content_digest: string
    manifest_digest: string
    created_by: string
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: source_snapshot_id:resource_version
  retry_policy: appstudio outbox 重试，消费者按 Snapshot ID/digest 幂等。
  failure_policy: 失败或不完整 Snapshot 不发布该事件。
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-010, R-STUDIO-011]
  related_user_stories: [US-APPSTUDIO-001]
studio_build_projection_changed:
  producer: appstudio-build-service
  consumers: [notification-center, sse, audit-service]
  trigger_condition: Build 创建，或依据 Task Center/Asset Library 事实单调更新状态、诊断或 Artifact 引用。
  payload:
    studio_build_id: string
    studio_application_id: string
    source_snapshot_id: string
    atomic_task_id: string|null
    artifact_id: string|null
    artifact_digest: string|null
    from_status: string|null
    to_status: string
    error_code: string|null
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: studio_build_id:resource_version
  retry_policy: appstudio outbox 重试，消费者按 Build 版本幂等。
  failure_policy: 不反向修改 Task Center 或 Artifact；可对账重放。
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-011, R-STUDIO-017, R-STUDIO-018]
  related_user_stories: [US-APPSTUDIO-001]
studio_preview_runtime_status_changed:
  producer: appstudio-preview-service
  consumers: [agent, notification-center, sse, audit-service]
  trigger_condition: Preview 创建、刷新、停止、失败或过期已持久化。
  payload:
    preview_runtime_id: string
    studio_application_id: string
    source_revision: integer
    from_status: string|null
    to_status: string
    diagnostics_summary: object
    error_code: string|null
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: preview_runtime_id:resource_version
  retry_policy: appstudio outbox 重试；消费者按 Preview 版本幂等。
  failure_policy: Preview 事件失败不得创建正式 Snapshot、Artifact 或 Release；通知和 SSE 不得投影内部 Workspace 字段。
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-009, R-STUDIO-010, R-STUDIO-023, R-STUDIO-024]
  related_user_stories: [US-APPSTUDIO-001]
studio_release_status_changed:
  producer: appstudio-release-service
  consumers: [notification-center, sse, audit-service]
  trigger_condition: Release 创建、部署、健康切换、失败或回滚结果已持久化。
  payload:
    studio_release_id: string
    studio_application_id: string
    studio_application_version_id: string
    studio_build_id: string
    runtime_config_id: string
    artifact_id: string
    artifact_digest: string
    environment: string
    runtime_instance_id: string|null
    rollback_of_release_id: string|null
    from_status: string|null
    to_status: string
    error_code: string|null
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: studio_release_id:resource_version
  retry_policy: appstudio outbox 重试；消费者按 Release 版本幂等。
  failure_policy: 事件失败不重新部署或切换入口；Release 事实可重放。
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-009, R-STUDIO-013, R-STUDIO-015, R-STUDIO-016, R-STUDIO-018, R-STUDIO-023, R-STUDIO-024]
  related_user_stories: [US-APPSTUDIO-001]
studio_runtime_instance_status_changed:
  producer: appstudio-release-service
  consumers: [notification-center, sse, audit-service]
  trigger_condition: StudioRuntimeInstance 创建、健康、入口切换、停止或失败状态已持久化。
  payload:
    runtime_instance_id: string
    studio_application_id: string
    studio_release_id: string
    environment: string
    atomic_task_id: string|null
    infra_runtime_id: string|null
    from_status: string|null
    to_status: string
    health_status: string
    is_current: boolean
    error_code: string|null
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: runtime_instance_id:resource_version
  retry_policy: appstudio outbox 重试；消费者按 RuntimeInstance 版本幂等。
  failure_policy: 事件失败不执行第二次入口切换；RuntimeInstance 事实可重放，旧健康实例不得受影响。
  related_rules: [BR-APPSTUDIO-001, R-STUDIO-009, R-STUDIO-013, R-STUDIO-015, R-STUDIO-016, R-STUDIO-023, R-STUDIO-024]
  related_user_stories: [US-APPSTUDIO-001]
