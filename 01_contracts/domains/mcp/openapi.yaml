openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OmniMAM MCP Server API
  version: 0.1.0
  description: >-
    OmniMAM MCP `2026-07-28` Streamable HTTP、12 个固定 Tool、6 类 Resource
    和 MCP Tasks 映射合同。Capability 只读发现；唯一异步业务执行入口是已发布
    Application。OAuth/PAT、直接 Capability 执行、泛化 Invocation、
    input_required、tasks/update、动态 Tool 和直接 StorageBackend 上传未开放。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: mcp
    description: MCP `2026-07-28` 标准协议入口。

x-mcp-path-exception:
  path: /mcp
  confirmed_by: user
  reason: 第三方 MCP Streamable HTTP 标准传输端点，不是 OmniMAM REST 资源 API。
  related_rules: [BR-MCP-002, BR-MCP-020]

x-mcp-tool-contracts:
  omnimam.capabilities.list:
    input_schema: {$ref: '#/components/schemas/CapabilitiesListArguments'}
    output_schema: {$ref: '#/components/schemas/CapabilityListResult'}
    delegated_permissions: [aiapp.provider_capability.read]
  omnimam.capabilities.get:
    input_schema: {$ref: '#/components/schemas/CapabilitiesGetArguments'}
    output_schema: {$ref: '#/components/schemas/CapabilityDetail'}
    delegated_permissions: [aiapp.provider_capability.read]
  omnimam.applications.list:
    input_schema: {$ref: '#/components/schemas/ApplicationsListArguments'}
    output_schema: {$ref: '#/components/schemas/ApplicationListResult'}
    delegated_permissions: [aiapp.application.read]
  omnimam.applications.get:
    input_schema: {$ref: '#/components/schemas/ApplicationsGetArguments'}
    output_schema: {$ref: '#/components/schemas/ApplicationDetail'}
    delegated_permissions: [aiapp.application.read]
  omnimam.applications.run:
    input_schema: {$ref: '#/components/schemas/ApplicationsRunArguments'}
    output_schema: {$ref: '#/components/schemas/ApplicationRunAccepted'}
    delegated_permissions: [aiapp.application.read, aiapp.application.run]
  omnimam.application_runs.get:
    input_schema: {$ref: '#/components/schemas/ApplicationRunsGetArguments'}
    output_schema: {$ref: '#/components/schemas/ApplicationRunProjection'}
    delegated_permissions: [aiapp.application.run]
  omnimam.application_runs.cancel:
    input_schema: {$ref: '#/components/schemas/ApplicationRunsCancelArguments'}
    output_schema: {$ref: '#/components/schemas/ApplicationRunCancelResult'}
    delegated_permissions: [aiapp.application.run, task.atomic.operate]
  omnimam.assets.search:
    input_schema: {$ref: '#/components/schemas/AssetsSearchArguments'}
    output_schema: {$ref: '#/components/schemas/AssetListResult'}
    delegated_permissions: [asset.read]
  omnimam.assets.get:
    input_schema: {$ref: '#/components/schemas/AssetsGetArguments'}
    output_schema: {$ref: '#/components/schemas/AssetDetailProjection'}
    delegated_permissions: [asset.read]
  omnimam.assets.prepare_upload:
    input_schema: {$ref: '#/components/schemas/AssetsPrepareUploadArguments'}
    output_schema: {$ref: '#/components/schemas/AssetUploadPrepared'}
    delegated_permissions: [asset.upload]
  omnimam.assets.complete_upload:
    input_schema: {$ref: '#/components/schemas/AssetsCompleteUploadArguments'}
    output_schema: {$ref: '#/components/schemas/AssetUploadCompleted'}
    delegated_permissions: [asset.upload]
  omnimam.assets.delete:
    input_schema: {$ref: '#/components/schemas/AssetsDeleteArguments'}
    output_schema: {$ref: '#/components/schemas/AssetDeleteResult'}
    delegated_permissions: [asset.delete]

paths:
  /mcp:
    post:
      tags: [mcp]
      operationId: handle_mcp_request
      summary: 处理 MCP `2026-07-28` JSON-RPC 请求
      description: >-
        已确认的 `/api/v1` 路径例外。每个请求重新携带版本、客户端能力和 USER 或 `aud=mcp` AGENT_WORKLOAD JWT；
        不创建 Mcp-Session-Id。HTTP 400/403 仅用于 MCP 规范要求的传输拒绝，
        所有进入 JSON-RPC 调度的业务错误使用 HTTP 200。
      x-permission: mcp.protocol.access
      x-delegated-permissions:
        discovery: mcp.discovery.read
        resource_read: mcp.resource.read + target-domain read permission
        task_get: mcp.task.read + aiapp.application.run
        task_cancel: mcp.task.cancel + aiapp.application.run + task.atomic.operate
        tool_call: 见根级 x-mcp-tool-contracts
      x-s1-refs:
        user_stories: [US-MCP-001, US-MCP-002, US-MCP-003, US-MCP-004, US-MCP-005, US-MCP-006, US-MCP-007, US-MCP-008]
        business_rules: [BR-MCP-001, BR-MCP-002, BR-MCP-003, BR-MCP-004, BR-MCP-005, BR-MCP-006, BR-MCP-007, BR-MCP-008, BR-MCP-009, BR-MCP-010, BR-MCP-011, BR-MCP-012, BR-MCP-013, BR-MCP-014, BR-MCP-015, BR-MCP-016, BR-MCP-017, BR-MCP-018, BR-MCP-019, BR-MCP-020, BR-MCP-021, BR-MCP-022]
      parameters:
        - $ref: '#/components/parameters/mcp_protocol_version'
        - $ref: '#/components/parameters/mcp_method'
        - $ref: '#/components/parameters/mcp_name'
        - $ref: '#/components/parameters/origin'
        - $ref: '#/components/parameters/traceparent'
        - $ref: '#/components/parameters/tracestate'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/McpJsonRpcRequest'}
      responses:
        '200':
          description: JSON-RPC 响应或与当前请求关联的 SSE 响应流。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpJsonRpcResponse'}
            text/event-stream:
              schema:
                type: string
                description: 当前 JSON-RPC 请求的 MCP SSE 响应；不是独立 GET 事件流。
        '400':
          description: >-
            MCP 传输例外：必需协议 Header 缺失、Header/Body 不一致或请求无法作为
            JSON-RPC 解析。不得用于 OmniMAM 业务校验。
          x-protocol-exception: MCP `2026-07-28` Streamable HTTP server validation。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpJsonRpcErrorResponse'}
        '403':
          description: MCP 传输安全例外：Origin 校验失败。
          x-protocol-exception: MCP Streamable HTTP Origin 防护。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpJsonRpcErrorResponse'}
        '404':
          description: 路由不存在，仅表示 `/mcp` 未部署或未匹配。
        '500':
          description: 未预期服务异常。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpJsonRpcErrorResponse'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (USER or AGENT_WORKLOAD with aud=mcp)

  parameters:
    mcp_protocol_version:
      name: MCP-Protocol-Version
      in: header
      required: true
      x-naming-exception: MCP `2026-07-28` official transport header.
      schema: {type: string, const: '2026-07-28'}
    mcp_method:
      name: Mcp-Method
      in: header
      required: true
      x-naming-exception: MCP `2026-07-28` official transport header.
      schema:
        type: string
        enum:
          - server/discover
          - tools/list
          - tools/call
          - resources/list
          - resources/templates/list
          - resources/read
          - tasks/get
          - tasks/cancel
      description: 必须与 JSON-RPC Body method 相同。
    mcp_name:
      name: Mcp-Name
      in: header
      required: false
      x-naming-exception: MCP `2026-07-28` official transport header.
      schema: {type: string, maxLength: 2048}
      description: >-
        tools/call 时必须等于 params.name；resources/read 时必须等于 params.uri；
        其他 method 省略。Base64 sentinel 值先解码再比较。
    origin:
      name: Origin
      in: header
      required: false
      x-naming-exception: Standard HTTP header.
      schema: {type: string, format: uri, maxLength: 2048}
    traceparent:
      name: traceparent
      in: header
      required: false
      schema: {type: string, maxLength: 128}
    tracestate:
      name: tracestate
      in: header
      required: false
      schema: {type: string, maxLength: 512}

  schemas:
    McpJsonRpcRequest:
      oneOf:
        - $ref: '#/components/schemas/DiscoverRequest'
        - $ref: '#/components/schemas/ToolsListRequest'
        - $ref: '#/components/schemas/ToolsCallRequest'
        - $ref: '#/components/schemas/ResourcesListRequest'
        - $ref: '#/components/schemas/ResourceTemplatesListRequest'
        - $ref: '#/components/schemas/ResourcesReadRequest'
        - $ref: '#/components/schemas/TasksGetRequest'
        - $ref: '#/components/schemas/TasksCancelRequest'
      discriminator:
        propertyName: method

    McpRequestBase:
      type: object
      x-naming-exception: jsonrpc and official MCP params fields preserve MCP schema names.
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id:
          oneOf:
            - {type: string, maxLength: 128}
            - {type: integer}
        method: {type: string}
        params: {type: object}

    McpRequestMeta:
      type: object
      additionalProperties: true
      x-naming-exception: Keys are official MCP `_meta` names.
      required:
        - io.modelcontextprotocol/protocolVersion
        - io.modelcontextprotocol/clientCapabilities
      properties:
        io.modelcontextprotocol/protocolVersion:
          type: string
          const: '2026-07-28'
        io.modelcontextprotocol/clientCapabilities:
          $ref: '#/components/schemas/McpClientCapabilities'
        io.modelcontextprotocol/clientInfo:
          $ref: '#/components/schemas/McpImplementation'
        progressToken:
          oneOf:
            - {type: string, maxLength: 128}
            - {type: integer}

    McpClientCapabilities:
      type: object
      additionalProperties: true
      properties:
        extensions:
          type: object
          additionalProperties: {type: object}
          properties:
            io.modelcontextprotocol/tasks:
              type: object
              additionalProperties: false

    McpImplementation:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        title: {type: string, maxLength: 255}
        version: {type: string, minLength: 1, maxLength: 64}
        description: {type: string, maxLength: 1000}
        websiteUrl:
          type: string
          format: uri
          x-naming-exception: Official MCP Implementation field.

    StandardRequestParams:
      type: object
      additionalProperties: false
      required: [_meta]
      properties:
        _meta: {$ref: '#/components/schemas/McpRequestMeta'}

    PaginatedRequestParams:
      type: object
      additionalProperties: false
      required: [_meta]
      properties:
        _meta: {$ref: '#/components/schemas/McpRequestMeta'}
        cursor: {type: string, maxLength: 512}

    DiscoverRequest:
      allOf:
        - $ref: '#/components/schemas/McpRequestBase'
        - type: object
          properties:
            method: {const: server/discover}
            params: {$ref: '#/components/schemas/StandardRequestParams'}

    ToolsListRequest:
      allOf:
        - $ref: '#/components/schemas/McpRequestBase'
        - type: object
          properties:
            method: {const: tools/list}
            params: {$ref: '#/components/schemas/PaginatedRequestParams'}

    ToolsCallRequest:
      allOf:
        - $ref: '#/components/schemas/McpRequestBase'
        - type: object
          properties:
            method: {const: tools/call}
            params:
              oneOf:
                - $ref: '#/components/schemas/CallCapabilitiesListParams'
                - $ref: '#/components/schemas/CallCapabilitiesGetParams'
                - $ref: '#/components/schemas/CallApplicationsListParams'
                - $ref: '#/components/schemas/CallApplicationsGetParams'
                - $ref: '#/components/schemas/CallApplicationsRunParams'
                - $ref: '#/components/schemas/CallApplicationRunsGetParams'
                - $ref: '#/components/schemas/CallApplicationRunsCancelParams'
                - $ref: '#/components/schemas/CallAssetsSearchParams'
                - $ref: '#/components/schemas/CallAssetsGetParams'
                - $ref: '#/components/schemas/CallAssetsPrepareUploadParams'
                - $ref: '#/components/schemas/CallAssetsCompleteUploadParams'
                - $ref: '#/components/schemas/CallAssetsDeleteParams'
              discriminator:
                propertyName: name

    ResourcesListRequest:
      allOf:
        - $ref: '#/components/schemas/McpRequestBase'
        - type: object
          properties:
            method: {const: resources/list}
            params: {$ref: '#/components/schemas/PaginatedRequestParams'}

    ResourceTemplatesListRequest:
      allOf:
        - $ref: '#/components/schemas/McpRequestBase'
        - type: object
          properties:
            method: {const: resources/templates/list}
            params: {$ref: '#/components/schemas/PaginatedRequestParams'}

    ResourcesReadRequest:
      allOf:
        - $ref: '#/components/schemas/McpRequestBase'
        - type: object
          properties:
            method: {const: resources/read}
            params: {$ref: '#/components/schemas/ResourceReadParams'}

    TasksGetRequest:
      allOf:
        - $ref: '#/components/schemas/McpRequestBase'
        - type: object
          x-naming-exception: taskId is defined by the MCP Tasks extension.
          properties:
            method: {const: tasks/get}
            params: {$ref: '#/components/schemas/TaskRequestParams'}

    TasksCancelRequest:
      allOf:
        - $ref: '#/components/schemas/McpRequestBase'
        - type: object
          x-naming-exception: taskId is defined by the MCP Tasks extension.
          properties:
            method: {const: tasks/cancel}
            params: {$ref: '#/components/schemas/TaskRequestParams'}

    ToolCallParamsBase:
      type: object
      additionalProperties: false
      required: [_meta, name, arguments]
      properties:
        _meta: {$ref: '#/components/schemas/McpRequestMeta'}
        name: {type: string}
        arguments: {type: object}

    CallCapabilitiesListParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.capabilities.list}
            arguments: {$ref: '#/components/schemas/CapabilitiesListArguments'}
    CallCapabilitiesGetParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.capabilities.get}
            arguments: {$ref: '#/components/schemas/CapabilitiesGetArguments'}
    CallApplicationsListParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.applications.list}
            arguments: {$ref: '#/components/schemas/ApplicationsListArguments'}
    CallApplicationsGetParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.applications.get}
            arguments: {$ref: '#/components/schemas/ApplicationsGetArguments'}
    CallApplicationsRunParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.applications.run}
            arguments: {$ref: '#/components/schemas/ApplicationsRunArguments'}
    CallApplicationRunsGetParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.application_runs.get}
            arguments: {$ref: '#/components/schemas/ApplicationRunsGetArguments'}
    CallApplicationRunsCancelParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.application_runs.cancel}
            arguments: {$ref: '#/components/schemas/ApplicationRunsCancelArguments'}
    CallAssetsSearchParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.assets.search}
            arguments: {$ref: '#/components/schemas/AssetsSearchArguments'}
    CallAssetsGetParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.assets.get}
            arguments: {$ref: '#/components/schemas/AssetsGetArguments'}
    CallAssetsPrepareUploadParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.assets.prepare_upload}
            arguments: {$ref: '#/components/schemas/AssetsPrepareUploadArguments'}
    CallAssetsCompleteUploadParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.assets.complete_upload}
            arguments: {$ref: '#/components/schemas/AssetsCompleteUploadArguments'}
    CallAssetsDeleteParams:
      allOf:
        - $ref: '#/components/schemas/ToolCallParamsBase'
        - type: object
          properties:
            name: {const: omnimam.assets.delete}
            arguments: {$ref: '#/components/schemas/AssetsDeleteArguments'}

    CapabilitiesListArguments:
      type: object
      additionalProperties: false
      properties:
        domain: {type: string, maxLength: 64}
        query: {type: string, maxLength: 255}
        status: {type: string, enum: [available], default: available}
        cursor: {type: string, maxLength: 512}
        limit: {type: integer, minimum: 1, maximum: 100, default: 50}

    CapabilitiesGetArguments:
      type: object
      additionalProperties: false
      required: [capability_id]
      properties:
        capability_id: {type: string, minLength: 1, maxLength: 255}

    ApplicationsListArguments:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, maxLength: 255}
        capability_id: {type: string, maxLength: 255}
        cursor: {type: string, maxLength: 512}
        limit: {type: integer, minimum: 1, maximum: 100, default: 50}

    ApplicationsGetArguments:
      type: object
      additionalProperties: false
      required: [application_id]
      properties:
        application_id: {type: string, minLength: 1, maxLength: 255}

    ApplicationsRunArguments:
      type: object
      additionalProperties: false
      required: [application_id, input, idempotency_key]
      properties:
        application_id: {type: string, minLength: 1, maxLength: 255}
        application_version_id: {type: string, minLength: 1, maxLength: 255}
        input:
          type: object
          additionalProperties: true
          maxProperties: 256
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
        metadata:
          type: object
          maxProperties: 64
          additionalProperties:
            type: [string, number, boolean, 'null']

    ApplicationRunsGetArguments:
      type: object
      additionalProperties: false
      required: [application_run_id]
      properties:
        application_run_id: {type: string, minLength: 1, maxLength: 255}

    ApplicationRunsCancelArguments:
      type: object
      additionalProperties: false
      required: [application_run_id]
      properties:
        application_run_id: {type: string, minLength: 1, maxLength: 255}
        reason: {type: string, maxLength: 500, default: ''}

    AssetsSearchArguments:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, maxLength: 500}
        media_types:
          type: array
          uniqueItems: true
          maxItems: 10
          items: {$ref: '#/components/schemas/MediaType'}
        tags:
          type: array
          uniqueItems: true
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 128}
        sort: {type: string, enum: [created_at_asc, created_at_desc, updated_at_asc, updated_at_desc], default: created_at_desc}
        cursor: {type: string, maxLength: 512}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}

    AssetsGetArguments:
      type: object
      additionalProperties: false
      required: [asset_id]
      properties:
        asset_id: {type: string, minLength: 1, maxLength: 255}
        include_representations: {type: boolean, default: true}

    AssetsPrepareUploadArguments:
      type: object
      additionalProperties: false
      required: [filename, media_type, size_bytes, checksum, idempotency_key]
      properties:
        filename: {type: string, minLength: 1, maxLength: 255}
        media_type: {type: string, minLength: 1, maxLength: 255}
        size_bytes: {type: integer, format: int64, minimum: 1}
        checksum: {$ref: '#/components/schemas/Checksum'}
        metadata:
          type: object
          maxProperties: 64
          additionalProperties:
            type: [string, number, boolean, 'null']
        idempotency_key: {type: string, minLength: 1, maxLength: 128}

    AssetsCompleteUploadArguments:
      type: object
      additionalProperties: false
      required: [upload_id, idempotency_key]
      properties:
        upload_id: {type: string, minLength: 1, maxLength: 255}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}

    AssetsDeleteArguments:
      type: object
      additionalProperties: false
      required: [asset_id, idempotency_key]
      properties:
        asset_id: {type: string, minLength: 1, maxLength: 255}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}

    Checksum:
      type: object
      additionalProperties: false
      required: [algorithm, value]
      properties:
        algorithm: {type: string, const: sha256}
        value: {type: string, pattern: '^[a-fA-F0-9]{64}$'}

    ResourceReadParams:
      type: object
      additionalProperties: false
      required: [_meta, uri]
      properties:
        _meta: {$ref: '#/components/schemas/McpRequestMeta'}
        uri:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^omnimam://(capabilities|applications|application-runs|assets|artifacts)/'

    TaskRequestParams:
      type: object
      additionalProperties: false
      x-naming-exception: taskId is defined by the MCP Tasks extension.
      required: [_meta, taskId]
      properties:
        _meta: {$ref: '#/components/schemas/McpRequestMeta'}
        taskId: {type: string, minLength: 1, maxLength: 255}

    McpJsonRpcResponse:
      oneOf:
        - $ref: '#/components/schemas/McpJsonRpcSuccessResponse'
        - $ref: '#/components/schemas/McpJsonRpcErrorResponse'

    McpJsonRpcSuccessResponse:
      type: object
      x-naming-exception: JSON-RPC and MCP result fields preserve official names.
      required: [jsonrpc, id, result]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id:
          oneOf:
            - {type: string}
            - {type: integer}
        result:
          oneOf:
            - $ref: '#/components/schemas/DiscoverResult'
            - $ref: '#/components/schemas/ToolsListResult'
            - $ref: '#/components/schemas/ToolCallResult'
            - $ref: '#/components/schemas/ResourcesListResult'
            - $ref: '#/components/schemas/ResourceTemplatesListResult'
            - $ref: '#/components/schemas/ResourceReadResult'
            - $ref: '#/components/schemas/McpTask'

    McpJsonRpcErrorResponse:
      type: object
      required: [jsonrpc, id, error]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id:
          oneOf:
            - {type: string}
            - {type: integer}
            - {type: 'null'}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: integer}
            message: {type: string}
            data:
              oneOf:
                - $ref: '#/components/schemas/McpBusinessError'
                - type: object
                  additionalProperties: true

    DiscoverResult:
      type: object
      x-naming-exception: Fields preserve official MCP DiscoverResult names.
      required: [resultType, supportedVersions, capabilities, cacheScope, ttlMs]
      properties:
        resultType: {type: string, const: complete}
        supportedVersions:
          type: array
          items: {type: string, const: '2026-07-28'}
          minItems: 1
          maxItems: 1
        capabilities:
          type: object
          additionalProperties: false
          required: [tools, resources, extensions]
          properties:
            tools:
              type: object
              additionalProperties: false
              properties:
                listChanged: {type: boolean, const: false}
            resources:
              type: object
              additionalProperties: false
              properties:
                listChanged: {type: boolean, const: false}
                subscribe: {type: boolean, const: false}
            extensions:
              type: object
              additionalProperties: false
              properties:
                io.modelcontextprotocol/tasks:
                  type: object
                  additionalProperties: false
        instructions:
          type: string
          maxLength: 2000
        cacheScope: {type: string, const: private}
        ttlMs: {type: integer, minimum: 0, maximum: 3600000}

    ToolsListResult:
      type: object
