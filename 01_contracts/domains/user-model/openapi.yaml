openapi: 3.0.3
info:
  title: OmniMAM User Model API
  version: 0.3.0
  description: User Model S2 API 契约。canonical 路由统一位于 /api/v1/user-model/，Provider 协议、发现、探测和执行委托 Model Gateway。
servers:
  - url: /api/v1
security:
  - bearer_auth: []
tags:
  - name: provider-types
    description: Model Gateway Runtime Registry 提供的稳定只读 Provider Type 目录。
  - name: model-providers
    description: 当前用户模型提供商配置与连接检测。
  - name: provider-models
    description: 当前用户提供商模型清单、同步与健康检测。
  - name: default-models
    description: 当前用户按用途保存的默认模型。
  - name: model-options
    description: 下游功能可读取的当前用户模型选项。
paths:
  /api/v1/user-model/provider-types:
    get:
      tags: [provider-types]
      summary: 查询 Provider Type 目录
      operationId: listProviderTypes
      x-permission: MODEL_CONFIG_READ
      x-s1-refs:
        user_stories: [US-USER-MODEL-15]
        business_rules: [BR-USER-MODEL-33, BR-USER-MODEL-34]
      responses:
        "200":
          description: 可供用户选择的稳定 Provider Type；不包含 Adapter 或 Executor ID。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTypeListResponse"
  /api/v1/user-model/providers:
    get:
      tags: [model-providers]
      summary: 查询当前用户模型提供商
      operationId: listModelProviders
      x-permission: MODEL_CONFIG_READ
      x-s1-refs:
        user_stories: [US-USER-MODEL-01]
        business_rules: [BR-USER-MODEL-02, BR-USER-MODEL-03, BR-USER-MODEL-04]
      parameters:
        - $ref: "#/components/parameters/page_num"
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/keyword"
        - name: sort_field
          in: query
          description: 排序字段；默认按 created_at 排序。
          schema:
            type: string
            enum: [name, created_at, updated_at, provider_type, enabled]
        - name: sort_order
          in: query
          description: 排序方向。
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: 当前用户模型提供商列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelProviderListResponse"
    post:
      tags: [model-providers]
      summary: 创建模型提供商
      operationId: createModelProvider
      x-permission: MODEL_CONFIG_WRITE
      x-s1-refs:
        user_stories: [US-USER-MODEL-02]
        business_rules: [BR-USER-MODEL-02, BR-USER-MODEL-03, BR-USER-MODEL-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelProviderCreateRequest"
      responses:
        "200":
          description: 已创建的模型提供商。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelProvider"
  /api/v1/user-model/providers/test:
    post:
      tags: [model-providers]
      summary: 检测未保存的提供商配置
      operationId: testUnsavedModelProvider
      x-permission: MODEL_HEALTH_TEST
      x-s1-refs:
        user_stories: [US-USER-MODEL-05]
        business_rules: [BR-USER-MODEL-08, BR-USER-MODEL-09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelProviderTestRequest"
      responses:
        "200":
          description: 未保存表单连接检测结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResult"
  /api/v1/user-model/providers/{provider_id}:
    get:
      tags: [model-providers]
      summary: 查询模型提供商详情
      operationId: getModelProvider
      x-permission: MODEL_CONFIG_READ
      x-s1-refs:
        user_stories: [US-USER-MODEL-01]
        business_rules: [BR-USER-MODEL-02, BR-USER-MODEL-04]
      parameters:
        - $ref: "#/components/parameters/provider_id"
      responses:
        "200":
          description: 模型提供商详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelProvider"
    patch:
      tags: [model-providers]
      summary: 更新模型提供商
      operationId: updateModelProvider
      x-permission: MODEL_CONFIG_WRITE
      x-s1-refs:
        user_stories: [US-USER-MODEL-03]
        business_rules: [BR-USER-MODEL-03, BR-USER-MODEL-05, BR-USER-MODEL-06]
      parameters:
        - $ref: "#/components/parameters/provider_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelProviderUpdateRequest"
      responses:
        "200":
          description: 已更新的模型提供商。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelProvider"
    delete:
      tags: [model-providers]
      summary: 删除模型提供商
      operationId: deleteModelProvider
      x-permission: MODEL_CONFIG_WRITE
      x-s1-refs:
        user_stories: [US-USER-MODEL-04]
        business_rules: [BR-USER-MODEL-07]
      parameters:
        - $ref: "#/components/parameters/provider_id"
      responses:
        "200":
          description: 删除结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/v1/user-model/providers/{provider_id}/test:
    post:
      tags: [model-providers]
      summary: 检测已保存模型提供商
      operationId: testModelProvider
      x-permission: MODEL_HEALTH_TEST
      x-s1-refs:
        user_stories: [US-USER-MODEL-05]
        business_rules: [BR-USER-MODEL-08, BR-USER-MODEL-09]
      parameters:
        - $ref: "#/components/parameters/provider_id"
      responses:
        "200":
          description: 已保存提供商连接检测结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResult"
  /api/v1/user-model/providers/{provider_id}/models:
    get:
      tags: [provider-models]
      summary: 查询提供商模型列表
      operationId: listProviderModels
      x-permission: MODEL_CONFIG_READ
      x-s1-refs:
        user_stories: [US-USER-MODEL-09]
        business_rules: [BR-USER-MODEL-02, BR-USER-MODEL-12, BR-USER-MODEL-15]
      parameters:
        - $ref: "#/components/parameters/provider_id"
        - $ref: "#/components/parameters/page_num"
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/keyword"
        - name: sort_field
          in: query
          description: 排序字段；默认按 created_at 排序。
          schema:
            type: string
            enum: [model, display_name, group, health_status, enabled, created_at, updated_at]
        - name: sort_order
          in: query
          description: 排序方向。
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: 提供商模型列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModelListResponse"
    post:
      tags: [provider-models]
      summary: 手动创建提供商模型
      operationId: createProviderModel
      x-permission: MODEL_CONFIG_WRITE
      x-s1-refs:
        user_stories: [US-USER-MODEL-07]
        business_rules: [BR-USER-MODEL-11, BR-USER-MODEL-12]
      parameters:
        - $ref: "#/components/parameters/provider_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderModelCreateRequest"
      responses:
        "200":
          description: 已创建的模型。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModel"
  /api/v1/user-model/providers/{provider_id}/models/sync:
    post:
      tags: [provider-models]
      summary: 同步提供商模型清单
      operationId: syncProviderModels
      x-permission: MODEL_CONFIG_WRITE
      x-s1-refs:
        user_stories: [US-USER-MODEL-06]
        business_rules: [BR-USER-MODEL-10, BR-USER-MODEL-12]
      parameters:
        - $ref: "#/components/parameters/provider_id"
      responses:
        "200":
          description: 同步结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSyncResult"
  /api/v1/user-model/models/{model_id}:
    patch:
      tags: [provider-models]
      summary: 更新提供商模型
      operationId: updateProviderModel
      x-permission: MODEL_CONFIG_WRITE
      x-s1-refs:
        user_stories: [US-USER-MODEL-08]
        business_rules: [BR-USER-MODEL-12, BR-USER-MODEL-13, BR-USER-MODEL-14]
      parameters:
        - $ref: "#/components/parameters/model_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderModelUpdateRequest"
      responses:
        "200":
          description: 已更新的模型。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModel"
    delete:
      tags: [provider-models]
      summary: 删除提供商模型
      operationId: deleteProviderModel
      x-permission: MODEL_CONFIG_WRITE
      x-s1-refs:
        user_stories: [US-USER-MODEL-11]
        business_rules: [BR-USER-MODEL-22]
      parameters:
        - $ref: "#/components/parameters/model_id"
      responses:
        "200":
          description: 删除结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/v1/user-model/models/{model_id}/test:
    post:
      tags: [provider-models]
      summary: 检测单个提供商模型
      operationId: testProviderModel
      x-permission: MODEL_HEALTH_TEST
      x-s1-refs:
        user_stories: [US-USER-MODEL-10]
        business_rules: [BR-USER-MODEL-19]
      parameters:
        - $ref: "#/components/parameters/model_id"
      responses:
        "200":
          description: 单模型连接检测结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResult"
  /api/v1/user-model/defaults/{usage}:
    get:
      tags: [default-models]
      summary: 查询指定用途默认模型
      operationId: getDefaultModel
      x-permission: MODEL_CONFIG_READ
      x-s1-refs:
        user_stories: [US-USER-MODEL-12, US-USER-MODEL-13]
        business_rules: [BR-USER-MODEL-23, BR-USER-MODEL-24, BR-USER-MODEL-26]
      parameters:
        - $ref: "#/components/parameters/usage"
      responses:
        "200":
          description: 当前用户默认模型配置。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultModelConfig"
    put:
      tags: [default-models]
      summary: 保存指定用途默认模型
      operationId: saveDefaultModel
      x-permission: MODEL_DEFAULT_WRITE
      x-s1-refs:
        user_stories: [US-USER-MODEL-12]
        business_rules: [BR-USER-MODEL-23, BR-USER-MODEL-24, BR-USER-MODEL-25]
      parameters:
        - $ref: "#/components/parameters/usage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefaultModelSaveRequest"
      responses:
        "200":
          description: 已保存的默认模型配置。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultModelConfig"
  /api/v1/user-model/options:
    get:
      tags: [model-options]
      summary: 查询下游可用模型选项
      operationId: listModelOptions
      x-permission: MODEL_CONFIG_READ
      x-s1-refs:
        user_stories: [US-USER-MODEL-13]
        business_rules: [BR-USER-MODEL-24, BR-USER-MODEL-26, BR-USER-MODEL-27]
      parameters:
        - name: usage
          in: query
          schema:
            $ref: "#/components/schemas/DefaultUsage"
        - name: capability_definition_id
          in: query
          description: Gateway CapabilityDefinition 稳定 ID；不接受标签或 Executor ID。
          schema:
            type: string
        - name: sort_field
          in: query
          description: 排序字段；默认按 display_name 排序。
          schema:
            type: string
            enum: [provider_name, display_name, model, health_status, enabled, created_at, updated_at]
        - name: sort_order
          in: query
          description: 排序方向。
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: 下游功能可选择的当前用户模型。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelOptionListResponse"
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page_num:
      name: page_num
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    page_size:
      name: page_size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    keyword:
      name: keyword
      in: query
      schema: { type: string, default: "" }
    provider_id:
      name: provider_id
      in: path
      required: true
      schema: { type: string }
    model_id:
      name: model_id
      in: path
      required: true
      schema: { type: string }
    usage:
      name: usage
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DefaultUsage"
  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    DefaultUsage:
      type: string
      enum: [assistant.default, quick, translation, agent.chat, agent.coding]
    HealthStatus:
      type: string
      enum: [unknown, healthy, unhealthy]
    CapabilityResolutionStatus:
      type: string
      enum: [unknown, resolved, unavailable, stale]
    ProviderType:
      type: object
      required: [id, display_name, authentication_types, configuration_schema, supports_model_discovery, supports_model_probe]
      properties:
        id:
          type: string
          description: 稳定 provider_type；客户端保存此值，不保存 Adapter ID。
        display_name: { type: string }
        authentication_types:
          type: array
          items: { type: string }
        configuration_schema:
          type: object
          additionalProperties: true
        supports_model_discovery: { type: boolean }
        supports_model_probe: { type: boolean }
    ModelProvider:
      type: object
      required: [id, owner_user_id, name, provider_type, api_base_url, auth_type, enabled, config_version, created_at, updated_at]
      properties:
        id: { type: string }
        owner_user_id: { type: string }
        name: { type: string }
        provider_type: { type: string, description: 必须来自只读 ProviderType 目录；不接受 Adapter ID。 }
        api_base_url: { type: string, format: uri }
        auth_type: { type: string }
        api_key_ref: { type: string }
        enabled: { type: boolean }
        description: { type: string }
        extra_config: { type: object, additionalProperties: true }
        config_version: { type: integer, minimum: 0, readOnly: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModelProviderCreateRequest:
      type: object
      required: [name, provider_type, api_base_url, auth_type, enabled]
      properties:
        name: { type: string }
        provider_type: { type: string, description: 稳定 ProviderType ID；不得提交 adapter_id。 }
        api_base_url: { type: string, format: uri }
        auth_type: { type: string }
        api_key_ref: { type: string }
        enabled: { type: boolean }
        description: { type: string }
        extra_config: { type: object, additionalProperties: true }
    ModelProviderUpdateRequest:
      type: object
      properties:
        name: { type: string }
        provider_type: { type: string, description: 稳定 ProviderType ID；不得提交 adapter_id。 }
        api_base_url: { type: string, format: uri }
        auth_type: { type: string }
        api_key_ref: { type: string }
        enabled: { type: boolean }
        description: { type: string }
        extra_config: { type: object, additionalProperties: true }
    ModelProviderTestRequest:
      allOf:
        - $ref: "#/components/schemas/ModelProviderCreateRequest"
    ProviderModel:
      type: object
      required: [id, owner_user_id, provider_id, provider_name, model, display_name, feature_labels, disabled_capability_definition_ids, capability_definition_ids, stream_supported, executable, capability_resolution_status, health_status, enabled, config_version, created_at, updated_at]
      properties:
        id: { type: string }
        owner_user_id: { type: string, description: 当前登录用户的数据隔离字段，客户端无需补查用户详情。 }
        provider_id: { type: string, description: 稳定 Provider 引用；同一对象的 provider_name 已提供可读展示。 }
        provider_name: { type: string, description: 当前用户可见 Provider 的一跳名称投影。 }
        model: { type: string }
        display_name: { type: string }
        group: { type: string }
        feature_labels:
          type: array
          description: 用户维护的展示和筛选标签，不能扩张 Gateway 实际能力。
          items: { type: string }
        disabled_capability_definition_ids:
          type: array
          description: 用户从 Gateway 已验证能力中关闭的 CapabilityDefinition ID。
          items: { type: string }
        capability_definition_ids:
          type: array
          readOnly: true
          description: Gateway 派生的最终可执行能力。
          items: { type: string }
        stream_supported:
          type: boolean
          readOnly: true
          description: Gateway 根据 Adapter 与 Operation 派生。
        executable:
          type: boolean
          readOnly: true
        unavailable_reason:
          type: string
          readOnly: true
          description: 不可执行原因的安全摘要。
        capability_resolution_status:
          allOf:
            - $ref: "#/components/schemas/CapabilityResolutionStatus"
          readOnly: true
        health_status:
          $ref: "#/components/schemas/HealthStatus"
        unhealthy_reason: { type: string }
        enabled: { type: boolean }
        config_version: { type: integer, minimum: 0, readOnly: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProviderModelCreateRequest:
      type: object
      required: [model, display_name]
      properties:
        model: { type: string }
        display_name: { type: string }
        group: { type: string }
        feature_labels:
          type: array
          description: 仅用于展示和筛选。
          items: { type: string }
        enabled: { type: boolean, default: true }
    ProviderModelUpdateRequest:
      type: object
      properties:
        display_name: { type: string }
        group: { type: string }
        feature_labels:
          type: array
          items: { type: string }
        disabled_capability_definition_ids:
          type: array
          description: 只能包含 Gateway 已验证并当前返回的能力 ID。
          items: { type: string }
        enabled: { type: boolean }
    DefaultModelConfig:
      type: object
      required: [id, owner_user_id, usage, provider_id, model_id, created_at, updated_at]
      properties:
        id: { type: string }
        owner_user_id: { type: string, description: 当前登录用户的数据隔离字段，客户端无需补查用户详情。 }
        usage:
          $ref: "#/components/schemas/DefaultUsage"
        provider_id: { type: string, description: 内嵌 model 已包含 provider_name，客户端无需补查 Provider。 }
        model_id: { type: string, description: 内嵌 model 是该 ID 对应的非敏感完整模型投影。 }
        model:
          $ref: "#/components/schemas/ProviderModel"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DefaultModelSaveRequest:
      type: object
      required: [provider_id, model_id]
      properties:
        provider_id: { type: string, description: 当前保存动作选中的 Provider ID，请求不返回关联摘要。 }
        model_id: { type: string, description: 当前保存动作选中的 ProviderModel ID，请求不返回关联摘要。 }
    HealthCheckResult:
      type: object
      required: [target_type, provider_id, success, health_status, checked_at]
      properties:
        target_type: { type: string, enum: [provider, model] }
        provider_id: { type: string, description: 当前检测 endpoint 的目标 Provider，调用方已有目标上下文。 }
        model_id: { type: string, description: 仅模型检测返回；由当前 endpoint 目标上下文解析，不额外展开。 }
        success: { type: boolean }
        health_status:
          $ref: "#/components/schemas/HealthStatus"
        message: { type: string }
        gateway_error_category:
          type: string
          description: Gateway 归一化的安全错误分类，不包含上游原始响应或凭证。
        checked_at: { type: string, format: date-time }
    ModelSyncResult:
      type: object
      required: [total, created, updated, skipped]
      properties:
        total: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        models:
          type: array
          items:
            $ref: "#/components/schemas/ProviderModel"
    ModelProviderListResponse:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelProvider"
    ProviderTypeListResponse:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProviderType"
    ProviderModelListResponse:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProviderModel"
    ModelOptionListResponse:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProviderModel"
