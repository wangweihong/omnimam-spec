# Infrastructure 事件只表达运行层事实，不携带业务正文、凭证、宿主路径或 Provider 原始响应。
infra_runtime_status_changed:
  producer: infrastructure-runtime-service
  consumers: [task-center, agent, appstudio, operations-monitor, audit-service]
  trigger_condition: InfraRuntime 状态、健康、失败分类或受控 Endpoint 摘要发生单调变化。
  payload:
    infra_runtime_id: string
    requesting_service: string
    owner_domain: string
    owner_reference: string
    from_status: string|null
    to_status: string
    health_status: string
    endpoint_ref: string|null
    failure_code: string|null
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: infra_runtime_id:resource_version
  retry_policy: infrastructure outbox 重试，消费者按 Runtime 版本幂等。
  failure_policy: 事件失败不回滚 Provider 或 InfraRuntime；Task Center/来源领域可对账。
  related_rules: [R-INFRA-002, R-INFRA-006, R-INFRA-015, R-INFRA-018]
  related_user_stories: []
infra_runtime_output_changed:
  producer: infrastructure-output-service
  consumers: [task-center, appstudio, asset-library, audit-service]
  trigger_condition: Runtime 输出引用收集或交付状态发生变化。
  payload:
    infra_runtime_id: string
    output_id: string
    output_key: string
    artifact_id: string|null
    status: string
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: output_id:resource_version
  retry_policy: outbox 重试；消费者按输出版本幂等。
  failure_policy: 不在 Infra 事件中保存媒体正文；Artifact 内容由 asset-library 负责。
  related_rules: [R-INFRA-002, R-INFRA-008]
  related_user_stories: []
infra_runtime_reconciled:
  producer: infrastructure-reconciler
  consumers: [task-center, operations-monitor, audit-service]
  trigger_condition: 对账完成并修复 InfraRuntime 与 Docker Provider 状态差异。
  payload:
    infra_runtime_id: string
    previous_status: string
    current_status: string
    provider_type: string
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: infra_runtime_id:resource_version:reconciled
  retry_policy: outbox 重试。
  failure_policy: 对账记录保留；事件失败不撤销已完成的单调修复。
  related_rules: [R-INFRA-017, R-INFRA-018]
  related_user_stories: []
