schema_version: "1.1"
description: Agent Runtime 固定镜像协议 fixture；用于发布前验证，不是运行时配置。
x-s1-refs:
  user_stories: [US-AGENT-001]
  business_rules: [BR-AGENT-001, R-AGENT-020, R-AGENT-021, R-AGENT-024, R-AGENT-025, R-AGENT-026, R-AGENT-027]
normalized_invocation_events:
  sequence_scope: invocation
  first_sequence_no: 1
  persistence_rule: 完整 envelope 必须先持久化再推送；Task 重试或 Runtime 重连不得为同一事实生成重复序号。
  sse_rule: id 使用 sequence_no 十进制文本，event 使用统一事件名，data 使用对应 JSON envelope；Last-Event-ID 只重放更大序号。
  terminal_rule: invocation.completed、invocation.failed、invocation.canceled 只能出现一个；发送并 flush 后关闭，已终态 Invocation 补完重放后关闭。
  envelope_fixture:
    invocation_id: invocation-001
    sequence_no: 1
    occurred_at: "2026-08-09T12:00:00Z"
    event: invocation.started
    payload: {status: RUNNING}
  payload_fixtures:
    invocation.started: {status: RUNNING}
    message.delta: {message_id: message-assistant-001, delta: hello}
    message.completed: {message_id: message-assistant-001, role: ASSISTANT, content: hello, attachments: [], created_at: "2026-08-09T12:00:01Z"}
    tool.requested: {tool_call_id: tool-call-001, tool_name: omnimam.assets.search, input_summary: redacted search request}
    tool.started: {tool_call_id: tool-call-001, tool_name: omnimam.assets.search}
    tool.progress: {tool_call_id: tool-call-001, tool_name: omnimam.assets.search, progress_message: searching, progress_percent: 50}
    tool.completed: {tool_call_id: tool-call-001, tool_name: omnimam.assets.search, output_summary: 2 results}
    tool.failed: {tool_call_id: tool-call-001, tool_name: omnimam.assets.search, failure_code: TOOL_EXECUTION_FAILED, failure_message: sanitized failure}
    user.input_required: {request_id: input-001, prompt: Select a target file.}
    invocation.completed: {status: SUCCEEDED, assistant_message_id: message-assistant-001}
    invocation.failed: {status: FAILED, failure_code: INVOCATION_FAILED, failure_message: sanitized failure}
    invocation.canceled: {status: CANCELED, reason: user requested cancellation}
profiles:
  - profile_id: agent.hermes
    image: nousresearch/hermes-agent:v2026.8.3
    manifest_digest: sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
    headless_command: [hermes, serve, --host, 127.0.0.1, --port, "9119", --skip-build]
    discovery_path: /openapi.json
    transport: JSON_RPC_WEBSOCKET_NDJSON
    control_path: /api/ws
    operations:
      create_session: session.create
      send_message: prompt.submit
      cancel_invocation: session.interrupt
    events:
      - message.start
      - message.delta
      - message.complete
      - tool.start
      - tool.complete
      - error
      - session.info
      - status.update
    idempotency:
      session_key: agent_session_id
      invocation_key: agent_invocation_id
      replay_rule: 复用已接受的 runtime_session_ref/runtime_invocation_ref，不重复提交 prompt。
    mcp_configuration:
      supported: false
      reason: 当前 release 不定义 Hermes MCP 配置注入合同。
  - profile_id: agent.opencode
    runtime_profile_contract: agent.coding@1.0
    image: ghcr.io/anomalyco/opencode:1.18.13
    manifest_digest: sha256:246ebd75d25380cde481b7507d38ed01ce813d541eb4c7412a25ba7d9bd1abe7
    headless_command: [opencode, serve, --hostname, 127.0.0.1, --port, "4096"]
    discovery_path: /doc
    transport: REST_AND_SSE
    operations:
      health: GET /global/health
      create_session: POST /session
      send_message: POST /session/{sessionID}/message
      cancel_invocation: POST /session/{sessionID}/abort
      stream_events: GET /event
    idempotency:
      session_key: agent_session_id
      invocation_key: agent_invocation_id
      replay_rule: 复用已接受的 session ID 和 Runtime Invocation 关联，不重复提交 message。
    mcp_configuration:
      supported: true
      config_path: /root/.config/opencode/opencode.json
      storage: tmpfs
      file_mode: "0600"
      server_key: binding_id
      server_types: [PLATFORM, REMOTE, RUNTIME_LOCAL]
      endpoint_rule: resolver 必须按 RuntimeProfile 与 Grant 生成受控 endpoint；禁止调用方提供任意内部 URL、宿主机命令或未授权网络目标。
      credential_rule: 只允许受信 resolver 在容器启动门闩释放前注入；不得出现在环境变量、命令参数或 inspect 可见字段。
      tool_allowlist:
        empty_means: DENY_ALL
        unknown_tool: DENY
        matching: MCP server 返回的完整 tool name 必须逐项精确匹配 allowed_tools。
      json_fixture:
        mcp:
          binding-001:
            type: remote
            url: https://resolved.invalid/mcp
            enabled: true
            headers:
              Authorization: Bearer <runtime-only-secret>
        tools:
          binding-001_*: false
          binding-001_omnimam.assets.search: true
      startup_gate: 先启动等待配置的入口；完成 archive/exec 写入、校验 0600 后才释放门闩并启动 headless_command。
release_gate:
  required_checks: [image_manifest, headless_start, health, create_session, send_message, event_stream, typed_event_payloads, terminal_stream_close, cancel, idempotent_replay, opencode_mcp_config, config_mode_0600, deny_unlisted_tool, secret_non_disclosure]
  failure_policy: 任一固定 Profile 未通过时不得发布或启用该 Profile 合同。
