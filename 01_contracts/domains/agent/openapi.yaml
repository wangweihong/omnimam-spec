openapi: 3.0.3
info:
  title: OmniMAM Agent API
  version: 1.0.0-draft
  description: >-
    Agent、Session、Invocation、Memory、Workspace Binding 与 AgentRuntime 的实现契约。
    本文件只按当前 Agent S1 生成；旧版 S2 不属于本契约输入。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - {name: agent-profiles}
  - {name: agents}
  - {name: sessions}
  - {name: invocations}
  - {name: memories}
  - {name: runtimes}
paths:
  /api/v1/agent-profiles:
    get:
      tags: [agent-profiles]
      operationId: list_agent_profiles
      summary: 查询只读 AgentProfile
      x-permission: agent.profile.read
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-001, R-AGENT-005], source_sections: ['6 Agent 类型与 AgentProfile']}
      responses:
        '200': {description: AgentProfile 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProfileListResponse'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agents:
    get:
      tags: [agents]
      operationId: list_agents
      summary: 查询当前主体可见 Agent
      x-permission: agent.read
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-001, R-AGENT-017], source_sections: ['8.1 Agent', '23 权限模型']}
      parameters: [{$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}, {$ref: '#/components/parameters/keyword'}, {name: statuses, in: query, schema: {type: string}, description: Agent 状态，逗号分隔。}]
      responses:
        '200': {description: Agent 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentListResponse'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [agents]
      operationId: create_agent
      summary: 创建 Agent
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-001, R-AGENT-010, R-AGENT-014, R-AGENT-016], source_sections: ['10 创建 Agent']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentCreateRequest'}}}}
      responses:
        '200': {description: 创建后的 Agent。, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agents/{agent_id}:
    parameters: [{$ref: '#/components/parameters/agent_id'}]
    get:
      tags: [agents]
      operationId: get_agent
      summary: 获取 Agent
      x-permission: agent.read
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-001, R-AGENT-017], source_sections: ['8.1 Agent', '23 权限模型']}
      responses:
        '200': {description: Agent。, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    patch:
      tags: [agents]
      operationId: update_agent
      summary: 更新 Agent 非敏感配置
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-001, R-AGENT-016, R-AGENT-017], source_sections: ['10 创建 Agent', '23 权限模型']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentUpdateRequest'}}}}
      responses:
        '200': {description: 更新后的 Agent。, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    delete:
      tags: [agents]
      operationId: delete_agent
      summary: 删除 Agent
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-001, R-AGENT-010, R-AGENT-011], source_sections: ['18.3 Agent 删除']}
      responses:
        '200': {description: 进入删除流程的 Agent。, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agents/{agent_id}/runtime/start:
    post:
      tags: [runtimes]
      operationId: start_agent_runtime
      summary: 启动或恢复 AgentRuntime
      x-permission: agent.runtime.operate
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-003, R-AGENT-004, R-AGENT-008, R-AGENT-014, R-AGENT-018], source_sections: ['11 Runtime 启动', '19 挂起与恢复']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeActionRequest'}}}}
      responses:
        '200': {description: AgentRuntime。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRuntime'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agents/{agent_id}/runtime/suspend:
    post:
      tags: [runtimes]
      operationId: suspend_agent_runtime
      summary: 挂起 AgentRuntime
      x-permission: agent.runtime.operate
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-003, R-AGENT-010, R-AGENT-018], source_sections: ['19 挂起与恢复']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses:
        '200': {description: AgentRuntime。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRuntime'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agents/{agent_id}/runtime/recover:
    post:
      tags: [runtimes]
      operationId: recover_agent_runtime
      summary: 对账并恢复 AgentRuntime
      x-permission: agent.runtime.operate
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-004, R-AGENT-018, R-AGENT-019], source_sections: ['20 异常恢复', '27.1 Task Center 结果与 Infra 事件处理']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeActionRequest'}}}}
      responses:
        '200': {description: AgentRuntime。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRuntime'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agents/{agent_id}/enable:
    post:
      tags: [agents]
      operationId: enable_agent
      summary: 启用 Agent
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-001, R-AGENT-017], source_sections: ['9 Agent 状态模型', '23 权限模型']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      responses: {'200': {description: Agent。, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/agents/{agent_id}/disable:
    post:
      tags: [agents]
      operationId: disable_agent
      summary: 禁用 Agent
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-001, R-AGENT-017], source_sections: ['9 Agent 状态模型', '23 权限模型']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: Agent。, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/agents/{agent_id}/runtime/stop:
    post:
      tags: [runtimes]
      operationId: stop_agent_runtime
      summary: 停止 AgentRuntime
      x-permission: agent.runtime.operate
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-003, R-AGENT-004, R-AGENT-018], source_sections: ['19 挂起与恢复']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: AgentRuntime。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRuntime'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/agents/{agent_id}/sessions:
    parameters: [{$ref: '#/components/parameters/agent_id'}]
    get:
      tags: [sessions]
      operationId: list_agent_sessions
      summary: 查询 AgentSession
      x-permission: agent.session.read
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002, R-AGENT-017], source_sections: ['8.2 AgentSession']}
      parameters: [{$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses:
        '200': {description: Session 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSessionListResponse'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [sessions]
      operationId: create_agent_session
      summary: 创建 AgentSession
      x-permission: agent.session.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002, R-AGENT-017], source_sections: ['8.2 AgentSession', '12 消息与交互']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSessionCreateRequest'}}}}
      responses:
        '200': {description: AgentSession。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSession'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agent-sessions/{session_id}:
    parameters: [{$ref: '#/components/parameters/session_id'}]
    get:
      tags: [sessions]
      operationId: get_agent_session
      summary: 获取 AgentSession
      x-permission: agent.session.read
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002, R-AGENT-017], source_sections: ['8.2 AgentSession']}
      responses:
        '200': {description: AgentSession。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSession'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    patch:
      tags: [sessions]
      operationId: update_agent_session
      summary: 更新 Session 元数据
      x-permission: agent.session.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002], source_sections: ['8.2 AgentSession']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSessionUpdateRequest'}}}}
      responses:
        '200': {description: AgentSession。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSession'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agent-sessions/{session_id}/messages:
    post:
      tags: [invocations]
      operationId: send_agent_message
      summary: 发送消息并创建 AgentInvocation
      x-permission: agent.invoke
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002, R-AGENT-005, R-AGENT-014, R-AGENT-020], source_sections: ['12 消息与交互']}
      parameters: [{$ref: '#/components/parameters/session_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMessageRequest'}}}}
      responses:
        '200': {description: Invocation 和输入 Message 的持久化摘要。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentInvocation'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    get:
      tags: [sessions]
      operationId: list_agent_messages
      summary: 查询 Session 消息
      x-permission: agent.session.read
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002], source_sections: ['8.3 AgentMessage']}
      parameters: [{$ref: '#/components/parameters/session_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses:
        '200': {description: 消息列表。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMessageListResponse'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agent-sessions/{session_id}/close:
    post:
      tags: [sessions]
      operationId: close_agent_session
      summary: 关闭 Session
      x-permission: agent.session.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002], source_sections: ['8.2 AgentSession']}
      parameters: [{$ref: '#/components/parameters/session_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: AgentSession。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSession'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/agent-sessions/{session_id}/archive:
    post:
      tags: [sessions]
      operationId: archive_agent_session
      summary: 归档 Session
      x-permission: agent.session.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002], source_sections: ['8.2 AgentSession']}
      parameters: [{$ref: '#/components/parameters/session_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'200': {description: AgentSession。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSession'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/agent-sessions/{session_id}/operations:
    get:
      tags: [invocations]
      operationId: list_agent_invocations
      summary: 查询 Session Invocation
      x-permission: agent.invoke
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002, R-AGENT-014], source_sections: ['8.4 AgentInvocation']}
      parameters: [{$ref: '#/components/parameters/session_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses: {'200': {description: Invocation 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentInvocationListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/agent-invocations/{invocation_id}:
    get:
      tags: [invocations]
      operationId: get_agent_invocation
      summary: 获取 AgentInvocation
      x-permission: agent.invoke
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002, R-AGENT-014, R-AGENT-018], source_sections: ['8.4 AgentInvocation', '21 Task Center 集成']}
      parameters: [{$ref: '#/components/parameters/invocation_id'}]
      responses:
        '200': {description: Invocation。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentInvocation'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agent-invocations/{invocation_id}/cancel:
    post:
      tags: [invocations]
      operationId: cancel_agent_invocation
      summary: 请求取消 Invocation
      x-permission: agent.invoke
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-014, R-AGENT-018, R-AGENT-020], source_sections: ['12 消息与交互', '21 Task Center 集成']}
      parameters: [{$ref: '#/components/parameters/invocation_id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses:
        '200': {description: 取消请求后的 Invocation。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentInvocation'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agent-invocations/{invocation_id}/events:
    get:
      tags: [invocations]
      operationId: stream_agent_invocation_events
      summary: 订阅 Invocation 事件
      x-permission: agent.invoke
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002, R-AGENT-020], source_sections: ['12.3 Agent Invocation Event', '12.4 Streaming']}
      parameters: [{$ref: '#/components/parameters/invocation_id'}, {name: Last-Event-ID, in: header, schema: {type: string}, description: 当前 Invocation 的短期恢复游标。, x-naming-exception: SSE 标准请求头，必须保留协议原始拼写。}]
      responses:
        '200': {description: SSE 事件流。, content: {text/event-stream: {schema: {type: string}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agents/{agent_id}/memories:
    parameters: [{$ref: '#/components/parameters/agent_id'}]
    get:
      tags: [memories]
      operationId: list_agent_memories
      summary: 查询 AgentMemory
      x-permission: agent.memory.read
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002, R-AGENT-017], source_sections: ['14 Memory']}
      parameters: [{$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}, {name: scope, in: query, schema: {type: string, enum: [AGENT, SESSION]}}]
      responses:
        '200': {description: Memory 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMemoryListResponse'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [memories]
      operationId: create_agent_memory
      summary: 创建 AgentMemory
      x-permission: agent.memory.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002, R-AGENT-017], source_sections: ['14.2 Memory 写入方式']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMemoryCreateRequest'}}}}
      responses:
        '200': {description: AgentMemory。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMemory'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agent-memories/{memory_id}:
    parameters: [{$ref: '#/components/parameters/memory_id'}]
    get:
      tags: [memories]
      operationId: get_agent_memory
      summary: 获取 AgentMemory
      x-permission: agent.memory.read
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002], source_sections: ['14 Memory']}
      responses:
        '200': {description: AgentMemory。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMemory'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    patch:
      tags: [memories]
      operationId: update_agent_memory
      summary: 更新 AgentMemory
      x-permission: agent.memory.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002], source_sections: ['14 Memory']}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMemoryUpdateRequest'}}}}
      responses:
        '200': {description: AgentMemory。, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMemory'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    delete:
      tags: [memories]
      operationId: delete_agent_memory
      summary: 删除 AgentMemory
      x-permission: agent.memory.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-002], source_sections: ['14 Memory']}
      responses:
        '200': {description: 删除结果。, content: {application/json: {schema: {$ref: '#/components/schemas/OperationResult'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /api/v1/agents/{agent_id}/workspace-binding:
    get:
      tags: [agents]
      operationId: get_agent_workspace_binding
      summary: 查询 Agent 固定 Workspace Binding
      x-permission: agent.workspace.read
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-010, R-AGENT-017], source_sections: ['18 Workspace']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      responses: {'200': {description: 创建 Agent 时固定且不可切换的 Workspace Binding。, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceBinding'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/agents/{agent_id}/model-bindings:
    get:
      tags: [agents]
      operationId: list_agent_model_bindings
      summary: 查询 Agent ModelBinding
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-005, R-AGENT-006, R-AGENT-007], source_sections: ['8.6 AgentModelBinding', '24 Secret 与模型凭证']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      responses: {'200': {description: ModelBinding 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/ModelBindingListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    put:
      tags: [agents]
      operationId: replace_agent_model_binding
      summary: 设置 Agent ModelBinding
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-005, R-AGENT-006, R-AGENT-007], source_sections: ['8.6 AgentModelBinding']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelBindingInput'}}}}
      responses: {'200': {description: ModelBinding。, content: {application/json: {schema: {$ref: '#/components/schemas/ModelBinding'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/agents/{agent_id}/skill-bindings:
    get:
      tags: [agents]
      operationId: list_agent_skill_bindings
      summary: 查询 Skill Binding
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-016], source_sections: ['15 Skills', '17 工具权限']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      responses: {'200': {description: Skill Binding 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/SkillBindingListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
  /api/v1/agents/{agent_id}/mcp-bindings:
    get:
      tags: [agents]
      operationId: list_agent_mcp_bindings
      summary: 查询 MCP Binding
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-016], source_sections: ['16 MCP Server Binding']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      responses: {'200': {description: MCP Binding 列表。, content: {application/json: {schema: {$ref: '#/components/schemas/McpBindingListResponse'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
    post:
      tags: [agents]
      operationId: create_agent_mcp_binding
      summary: 创建 MCP Binding
      x-permission: agent.manage
      x-s1-refs: {user_stories: [US-AGENT-001], business_rules: [R-AGENT-016], source_sections: ['16 MCP Server Binding']}
      parameters: [{$ref: '#/components/parameters/agent_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/McpBindingRequest'}}}}
      responses: {'200': {description: MCP Binding。, content: {application/json: {schema: {$ref: '#/components/schemas/McpBinding'}}}}, '500': {$ref: '#/components/responses/UnexpectedError'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    agent_id: {name: agent_id, in: path, required: true, schema: {type: string}}
    session_id: {name: session_id, in: path, required: true, schema: {type: string}}
    invocation_id: {name: invocation_id, in: path, required: true, schema: {type: string}}
    memory_id: {name: memory_id, in: path, required: true, schema: {type: string}}
    page_num: {name: page_num, in: query, schema: {type: integer, minimum: 0, default: 0}}
    page_size: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    keyword: {name: keyword, in: query, schema: {type: string, maxLength: 256}}
  responses:
    UnexpectedError:
      description: 未预期服务异常。
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    AgentProfile:
      type: object
      required: [id, name, revision, status, supported_agent_kinds]
      properties:
        id: {type: string}
        name: {type: string}
        revision: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        supported_agent_kinds: {type: array, items: {type: string, enum: [platform, coding]}}
        description: {type: string}
    Agent:
      type: object
      required: [id, name, agent_profile_id, kind, workspace_type, workspace_id, status, disabled, resource_version, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        agent_profile_id: {type: string}
        agent_profile_revision: {type: string}
        kind: {type: string, enum: [platform, coding]}
        workspace_type: {type: string, enum: [agent, studio]}
        workspace_id: {type: string}
        status: {type: string, enum: [CREATING, READY, STARTING, RUNNING, IDLE, SUSPENDED, ERROR, DISABLED, DELETING]}
        disabled: {type: boolean}
        resource_version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_active_at: {type: string, format: date-time, nullable: true}
    AgentCreateRequest:
      type: object
      required: [name, agent_profile_id, kind, workspace_type, workspace_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        agent_profile_id: {type: string}
        agent_profile_revision: {type: string}
        kind: {type: string, enum: [platform, coding]}
        workspace_type: {type: string, enum: [agent, studio]}
        workspace_id: {type: string}
        model_binding: {$ref: '#/components/schemas/ModelBindingInput'}
        runtime_policy: {type: object, additionalProperties: false}
    AgentUpdateRequest:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 2000}
        runtime_policy: {type: object, additionalProperties: false}
        resource_version: {type: integer}
    AgentSession:
      type: object
      required: [id, agent_id, status, created_at, updated_at]
      properties:
        id: {type: string}
        agent_id: {type: string}
        title: {type: string}
        status: {type: string, enum: [OPEN, CLOSED, ARCHIVED]}
        runtime_session_ref: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentSessionCreateRequest:
      type: object
      properties: {title: {type: string, maxLength: 200}}
    AgentSessionUpdateRequest:
      type: object
      properties: {title: {type: string, maxLength: 200}, resource_version: {type: integer}}
    AgentMessageRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 20000}
        attachments: {type: array, items: {$ref: '#/components/schemas/Reference'}}
        idempotency_key: {type: string, maxLength: 200}
    AgentInvocation:
      type: object
      required: [id, agent_id, session_id, type, status, created_at, updated_at]
      properties:
        id: {type: string}
        agent_id: {type: string}
        session_id: {type: string}
        type: {type: string, enum: [CHAT, CODING, TOOL_OPERATION, BACKGROUND_OPERATION]}
        status: {type: string, enum: [QUEUED, STARTING, RUNNING, WAITING_FOR_TOOL, WAITING_FOR_USER, SUCCEEDED, FAILED, CANCELING, CANCELED]}
        user_message_id: {type: string, nullable: true}
        assistant_message_id: {type: string, nullable: true}
        atomic_task_id: {type: string, nullable: true, description: 纯 CHAT 可为空；CODING、TOOL_OPERATION、BACKGROUND_OPERATION 和 Runtime 生命周期 Invocation 必填。}
        failure_code: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentMessage:
      type: object
      required: [id, session_id, role, content, created_at]
      properties:
        id: {type: string}
        session_id: {type: string}
        invocation_id: {type: string, nullable: true}
        role: {type: string, enum: [USER, ASSISTANT, SYSTEM, TOOL]}
        content: {type: string}
        attachments: {type: array, items: {$ref: '#/components/schemas/Reference'}}
        created_at: {type: string, format: date-time}
    AgentMemory:
      type: object
      required: [id, agent_id, scope, type, content, created_at, updated_at]
      properties:
        id: {type: string}
        agent_id: {type: string}
        session_id: {type: string, nullable: true}
        scope: {type: string, enum: [AGENT, SESSION]}
        type: {type: string, enum: [FACT, PREFERENCE, SUMMARY, INSTRUCTION, CONTEXT]}
        content: {type: string, maxLength: 20000}
        source_message_id: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentMemoryCreateRequest:
      type: object
      required: [scope, type, content]
      properties:
        session_id: {type: string, nullable: true}
        scope: {type: string, enum: [AGENT, SESSION]}
        type: {type: string, enum: [FACT, PREFERENCE, SUMMARY, INSTRUCTION, CONTEXT]}
        content: {type: string, maxLength: 20000}
        source_message_id: {type: string, nullable: true}
    AgentMemoryUpdateRequest:
      type: object
      required: [content]
      properties: {content: {type: string, maxLength: 20000}, resource_version: {type: integer}}
    AgentRuntime:
      type: object
      required: [id, agent_id, state, activity_state, runtime_profile_id, runtime_profile_revision, created_at, updated_at]
      properties:
        id: {type: string}
        agent_id: {type: string}
        infra_runtime_id: {type: string, nullable: true}
        endpoint_ref: {type: string, nullable: true}
        runtime_profile_id: {type: string}
        runtime_profile_revision: {type: string}
        state: {type: string, enum: [CREATING, STARTING, READY, RUNNING, STOPPING, STOPPED, FAILED, DELETED]}
        activity_state: {type: string, enum: [IDLE, ACTIVE, SUSPENDED]}
        health_status: {type: string, enum: [UNKNOWN, HEALTHY, UNHEALTHY]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RuntimeActionRequest:
      type: object
      properties: {request_id: {type: string, maxLength: 200}, resource_version: {type: integer}}
    ActionRequest:
      type: object
      properties: {reason: {type: string, maxLength: 1000}, request_id: {type: string, maxLength: 200}, resource_version: {type: integer}}
    ModelBindingInput:
      type: object
      required: [source_type, source_ref, purpose]
      properties:
        source_type: {type: string, enum: [USER_DEFAULT_MODEL, USER_PROVIDER_MODEL, PLATFORM_MODEL]}
        source_ref: {type: string}
        purpose: {type: string, enum: [CHAT, CODING, VISION, EMBEDDING]}
    Reference:
      type: object
      required: [reference_type, reference_id]
      properties: {reference_type: {type: string}, reference_id: {type: string}}
    OperationResult:
      type: object
      required: [success]
      properties: {success: {type: boolean}}
    AgentProfileListResponse:
      type: object
      required: [total, items]
      properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/AgentProfile'}}}
    AgentListResponse:
      type: object
      required: [total, items]
      properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/Agent'}}}
    AgentSessionListResponse:
      type: object
      required: [total, items]
      properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/AgentSession'}}}
    AgentMessageListResponse:
      type: object
      required: [total, items]
      properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/AgentMessage'}}}
    AgentMemoryListResponse:
      type: object
      required: [total, items]
      properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/AgentMemory'}}}
    AgentInvocationListResponse:
      type: object
      required: [total, items]
      properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/AgentInvocation'}}}
    WorkspaceBinding:
      type: object
      required: [id, agent_id, workspace_type, workspace_id, access_mode]
      properties:
        id: {type: string}
        agent_id: {type: string}
        workspace_type: {type: string, enum: [agent, studio]}
        workspace_id: {type: string}
        access_mode: {type: string, enum: [READ_ONLY, READ_WRITE]}
        authorization_summary:
          type: object
          additionalProperties: false
          properties:
            source: {type: string, enum: [agent, appstudio]}
            validated_at: {type: string, format: date-time, nullable: true}
    ModelBinding:
      allOf: [{$ref: '#/components/schemas/ModelBindingInput'}, {type: object, properties: {id: {type: string}, status: {type: string}, is_primary: {type: boolean}}}]
    SkillBinding:
      type: object
      required: [id, agent_id, skill_id, skill_version, enabled]
      properties: {id: {type: string}, agent_id: {type: string}, skill_id: {type: string}, skill_version: {type: string}, enabled: {type: boolean}, configuration: {type: object, additionalProperties: true}}
    McpBinding:
      type: object
      required: [id, agent_id, name, server_type, endpoint_ref, enabled]
      properties: {id: {type: string}, agent_id: {type: string}, name: {type: string}, server_type: {type: string, enum: [PLATFORM, REMOTE, RUNTIME_LOCAL]}, endpoint_ref: {type: string}, allowed_tools: {type: array, items: {type: string}}, enabled: {type: boolean}}
    McpBindingRequest:
      type: object
      required: [name, server_type, endpoint_ref]
      properties: {name: {type: string}, server_type: {type: string, enum: [PLATFORM, REMOTE, RUNTIME_LOCAL]}, endpoint_ref: {type: string}, credential_ref: {type: string, nullable: true}, allowed_tools: {type: array, items: {type: string}}, configuration: {type: object, additionalProperties: true}}
    ModelBindingListResponse: {type: object, required: [total, items], properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/ModelBinding'}}}}
    SkillBindingListResponse: {type: object, required: [total, items], properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/SkillBinding'}}}}
    McpBindingListResponse: {type: object, required: [total, items], properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/McpBinding'}}}}
    ErrorResponse:
      type: object
      required: [code, value, message]
      properties:
        code: {type: string}
        value: {type: integer}
        message: {type: string}
        retryable: {type: boolean}
        data: {type: object, additionalProperties: true}
