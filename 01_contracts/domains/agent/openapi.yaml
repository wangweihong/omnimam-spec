        reason: {type: string, maxLength: 512}
    TaskReference:
      type: object
      additionalProperties: false
      required: [atomic_task_id, atomic_task]
      properties:
        atomic_task_id: {type: string}
        atomic_task: {$ref: '#/components/schemas/AtomicTaskSummary'}
