# 权限追溯使用 US-AGENT-001/BR-AGENT-001 及具体 R-AGENT-* 规则。
agent.profile.read:
  domain: agent
  module: agent-core
  resource: agent_profile
  action: read
  subject: owner, system_admin
  description: 查询只读 AgentProfile。
  frontend_usage: 控制 Agent 类型和 Profile 选择器。
  backend_enforcement: 只返回当前启用且允许使用的 Profile；不得返回 Provider Secret。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-001, R-AGENT-005]
  related_user_stories: [US-AGENT-001]
agent.read:
  domain: agent
  module: agent-core
  resource: agent
  action: read
  subject: owner, system_admin
  description: 查询 Agent 及其非敏感状态摘要。
  frontend_usage: Agent 列表、详情和状态入口。
  backend_enforcement: 按 owner_user_id 或显式管理员范围过滤；不存在与不可见统一处理。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-001, R-AGENT-017]
  related_user_stories: [US-AGENT-001]
agent.manage:
  domain: agent
  module: agent-core
  resource: agent
  action: create, update, enable, disable, delete
  subject: owner, system_admin
  description: 管理 Agent 配置和业务生命周期。
  frontend_usage: Agent 创建、编辑、启停和删除。
  backend_enforcement: 校验 Profile、类型、固定 Workspace、资源版本；不得删除 StudioWorkspace 或 AppStudio 事实。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-001, R-AGENT-010, R-AGENT-011, R-AGENT-017]
  related_user_stories: [US-AGENT-001]
agent.invoke:
  domain: agent
  module: interaction
  resource: agent_session, agent_invocation, agent_message
  action: create, read, send, cancel, stream
  subject: owner, system_admin
  description: 管理 Session 并发送、查询或取消 Invocation。
  frontend_usage: Agent 对话、消息流和取消入口。
  backend_enforcement: 校验 Agent/Session 所有权、Session 状态、单轮并发和 Task Center 取消边界。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-002, R-AGENT-014, R-AGENT-017, R-AGENT-020]
  related_user_stories: [US-AGENT-001]
agent.session.read:
  domain: agent
  module: interaction
  resource: agent_session, agent_message
  action: read, list
  subject: owner, system_admin
  description: 查询 AgentSession 和 Message 历史。
  frontend_usage: Session 列表、历史消息和 Invocation 上下文。
  backend_enforcement: 按 Agent/Session owner 过滤；不得返回其他用户消息、Runtime Secret 或 Provider 原始响应。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-002, R-AGENT-017]
  related_user_stories: [US-AGENT-001]
agent.session.manage:
  domain: agent
  module: interaction
  resource: agent_session
  action: create, update, close, archive
  subject: owner, system_admin
  description: 管理 AgentSession 生命周期。
  frontend_usage: Session 创建、关闭和归档。
  backend_enforcement: 关闭/归档后拒绝新消息；历史 Message 和 Memory 继续保留。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-002]
  related_user_stories: [US-AGENT-001]
agent.workspace.read:
  domain: agent
  module: workspace
  resource: agent_workspace_binding
  action: read
  subject: owner, system_admin
  description: 查询 Agent 创建时固定的 Workspace Binding 摘要。
  frontend_usage: Agent 详情中的 Workspace 类型、稳定引用和授权状态。
  backend_enforcement: 只返回当前 Agent 的唯一固定 Binding；Coding Agent 不返回 StudioWorkspace 内容、物理路径、挂载路径或短期 Tool Token。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-010, R-AGENT-011, R-AGENT-017]
  related_user_stories: [US-AGENT-001]
agent.memory.read:
  domain: agent
  module: workspace
  resource: agent_memory
  action: read
  subject: owner, system_admin
  description: 查询 AgentMemory。
  frontend_usage: 记忆列表和诊断入口。
  backend_enforcement: 只返回当前 Agent 可见的 AGENT/SESSION scope 记忆。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-002, R-AGENT-017]
  related_user_stories: [US-AGENT-001]
agent.memory.manage:
  domain: agent
  module: workspace
  resource: agent_memory
  action: create, update, delete
  subject: owner, system_admin
  description: 管理 AgentMemory。
  frontend_usage: 显式记忆、摘要和偏好管理。
  backend_enforcement: 禁止跨用户共享；校验 Session scope 关联关系。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-002, R-AGENT-017]
  related_user_stories: [US-AGENT-001]
agent.runtime.operate:
  domain: agent
  module: runtime
  resource: agent_runtime
  action: read, start, suspend, resume, stop, recover
  subject: owner, system_admin
  description: 操作 AgentRuntime 业务绑定。
  frontend_usage: Runtime 启动、挂起、恢复、停止和恢复入口。
  backend_enforcement: 通过 Task Center 已注册 functionRef；不得直接调用 Infra 或暴露容器细节。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-003, R-AGENT-004, R-AGENT-014, R-AGENT-018, R-AGENT-019]
  related_user_stories: [US-AGENT-001]
agent.runtime.logs.read:
  domain: agent
  module: runtime
  resource: agent_runtime_log
  action: read
  subject: owner, system_admin
  description: 读取 AgentRuntime 脱敏日志摘要。
  frontend_usage: Runtime 诊断入口。
  backend_enforcement: 移除 Secret、Provider 原始响应、宿主路径、容器 ID 和内部地址。
  default_roles: [REGULAR_USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-AGENT-001, R-AGENT-007, R-AGENT-008, R-AGENT-018]
  related_user_stories: [US-AGENT-001]
