# 事件追溯使用 US-AGENT-001/BR-AGENT-001 及具体 R-AGENT-* 规则。
agent_lifecycle_changed:
  producer: agent-service
  consumers: [notification-center, sse, audit-service]
  trigger_condition: 用户可见 Platform Agent 创建或 status、disabled、deleted_at 发生已持久化单调变化。
  payload:
    agent_id: string
    owner_user_id: string
    kind: string
    from_status: string|null
    to_status: string
    deleted_at: string(date-time)|null
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: agent_id:resource_version
  retry_policy: agent outbox 持续重试，消费者按 agent_id/resource_version 幂等。
  failure_policy: 事件失败不回滚 Agent；可从 Agent 事实重放；通知、SSE 和公共响应不得补充内部 Workspace 字段。
  related_rules: [BR-AGENT-001, R-AGENT-001, R-AGENT-010, R-AGENT-017]
  related_user_stories: [US-AGENT-001]
agent_session_status_changed:
  producer: agent-session-service
  consumers: [notification-center, sse, audit-service]
  trigger_condition: Session 创建、关闭、归档或错误状态已持久化。
  payload:
    session_id: string
    agent_id: string
    owner_user_id: string
    from_status: string|null
    to_status: string
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: session_id:resource_version
  retry_policy: agent outbox 重试，消费者按 Session 版本幂等。
  failure_policy: 不删除 Session、Message 或 Memory；可从事实重放。
  related_rules: [BR-AGENT-001, R-AGENT-002, R-AGENT-017]
  related_user_stories: [US-AGENT-001]
agent_invocation_status_changed:
  producer: agent-interaction-service
  consumers: [notification-center, sse, audit-service]
  trigger_condition: Invocation 创建、状态、结果摘要或失败分类发生已持久化变化。
  payload:
    invocation_id: string
    agent_id: string
    session_id: string
    atomic_task_id: string|null
    from_status: string|null
    to_status: string
    output_summary: string|null
    error_code: string|null
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: invocation_id:resource_version
  retry_policy: agent outbox 重试，消费者按 Invocation 版本幂等。
  failure_policy: Invocation 是 Agent 业务投影；事件不得反向覆盖 AtomicTask 终态，重复或乱序 Runtime 事件不得回退 sequence/resource_version。
  related_rules: [BR-AGENT-001, R-AGENT-002, R-AGENT-014, R-AGENT-020, R-AGENT-022]
  related_user_stories: [US-AGENT-001]
agent_runtime_status_changed:
  producer: agent-runtime-service
  consumers: [notification-center, sse, audit-service, operations-monitor]
  trigger_condition: AgentRuntimeBinding 的 state、activity_state、健康或失败分类发生单调变化。
  payload:
    runtime_binding_id: string
    agent_id: string
    infra_runtime_id: string|null
    from_state: string|null
    to_state: string
    activity_state: string
    health_status: string
    current_task_id: string|null
    current_operation: string|null
    error_code: string|null
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: runtime_binding_id:resource_version
  retry_policy: agent outbox 重试；消费者按 Runtime Binding 版本幂等。
  failure_policy: 发布失败不回滚 Runtime 操作；对账后可重放；消费者只接受匹配当前 Task/operation 的结果。
  related_rules: [BR-AGENT-001, R-AGENT-003, R-AGENT-004, R-AGENT-018, R-AGENT-019, R-AGENT-022]
  related_user_stories: [US-AGENT-001]
agent_memory_changed:
  producer: agent-memory-service
  consumers: [audit-service]
  trigger_condition: AgentMemory 创建、更新或删除已提交。
  payload:
    memory_id: string
    agent_id: string
    session_id: string|null
    change_type: string
    scope: string
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: memory_id:resource_version
  retry_policy: outbox 重试。
  failure_policy: 事件失败不影响 Memory 事实；不在事件中携带记忆正文。
  related_rules: [BR-AGENT-001, R-AGENT-002, R-AGENT-017]
  related_user_stories: [US-AGENT-001]
