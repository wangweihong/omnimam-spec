identity.user.created:
  producer: identity.user
  consumers: [notification-service, admin-projection]
  trigger_condition: 用户注册成功或管理员创建用户并完成 User 持久化后。
  payload:
    event_id: string
    event_name: string
    occurred_at: string(date-time)
    aggregate_id: string
    aggregate_version: integer
    user_id: string
    actor_principal_type: string(USER|SERVICE_ACCOUNT)
    actor_principal_id: string
    actor_user_id: string|null
    status: string(ACTIVE|PENDING)
    source: string(LOCAL)
  idempotency_key: identity.user.created:{user_id}:{aggregate_version}
  retry_policy: 持久化 Outbox 重试；消费者按 event_id 去重。
  failure_policy: 事件投递失败不回滚 User；Outbox 不得丢失。
  related_rules: [BR-IAM-002, BR-IAM-015]
  related_user_stories: [US-IAM-001, US-IAM-002, US-IAM-009]

identity.user.status_changed:
  producer: identity.user
  consumers: [notification-service, principal-cache]
  trigger_condition: User 因注册批准/拒绝、禁用、恢复、解锁或逻辑删除发生状态变化并提交后。
  payload:
    event_id: string
    event_name: string
    occurred_at: string(date-time)
    aggregate_id: string
    aggregate_version: integer
    user_id: string
    previous_status: string
    status: string
    security_version: integer
    actor_principal_type: string(USER|SERVICE_ACCOUNT)
    actor_principal_id: string
    actor_user_id: string|null
  idempotency_key: identity.user.status_changed:{user_id}:{aggregate_version}
  retry_policy: 持久化 Outbox 重试；消费者按 user_id 与 aggregate_version 单调处理。
  failure_policy: 授权缓存和投影可重试；身份撤销事实以 identity 持久化状态为准。
  related_rules: [BR-IAM-007, BR-IAM-015, BR-IAM-017, BR-IAM-023, BR-IAM-028]
  related_user_stories: [US-IAM-002, US-IAM-009, US-IAM-011, US-IAM-015, US-IAM-017]

identity.registration.reviewed:
  producer: identity.user
  consumers: [notification-service, admin-projection]
  trigger_condition: RegistrationApplication 被批准或拒绝并与 User 状态原子提交后。
  payload:
    event_id: string
    event_name: string
    occurred_at: string(date-time)
    aggregate_id: string
    aggregate_version: integer
    registration_application_id: string
    user_id: string
    attempt_no: integer
    decision: string(APPROVED|REJECTED)
    decision_reason: string|null
    authorization_version: integer
    actor_principal_type: string(USER|SERVICE_ACCOUNT)
    actor_principal_id: string
    actor_user_id: string|null
  idempotency_key: identity.registration.reviewed:{registration_application_id}:{aggregate_version}
  retry_policy: 持久化 Outbox 重试；消费者按 registration_application_id 与 aggregate_version 去重。
  failure_policy: 审批事实已提交后事件可重试；客户端不得因事件延迟自行推断批准或拒绝结果。
  related_rules: [BR-IAM-015, BR-IAM-023]
  related_user_stories: [US-IAM-015, US-IAM-020]

identity.auth.session_created:
  producer: identity.session
  consumers: [security-monitor]
  trigger_condition: 登录或 Refresh Token 轮换创建有效 AuthSession/TokenCredential 后。
  payload:
    event_id: string
    event_name: string
    occurred_at: string(date-time)
    aggregate_id: string
    aggregate_version: integer
    session_id: string
    principal_type: string(USER|SERVICE_ACCOUNT)
    principal_id: string
    user_id: string|null
    client_id: string
    auth_method: string(PASSWORD|REFRESH_TOKEN|SERVICE_CREDENTIAL)
    ip_address: string|null
    user_agent: string|null
  idempotency_key: identity.auth.session_created:{session_id}:{aggregate_version}
  retry_policy: 持久化 Outbox 重试；安全监控按 event_id 去重。
  failure_policy: 安全监控事件投递失败不改变已经创建的会话；会话对调用方可用前必须已通过 platform-management 同步审计确认，不能依赖本事件补偿审计。
  related_rules: [BR-IAM-005, BR-IAM-015]
  related_user_stories: [US-IAM-001, US-IAM-004, US-IAM-009]

identity.auth.session_revoked:
  producer: identity.session
  consumers: [principal-cache, security-monitor]
  trigger_condition: 局部登出、全局登出、密码修改、Token 重用、用户禁用或服务凭据撤销导致会话失效后。
  payload:
    event_id: string
    event_name: string
    occurred_at: string(date-time)
    aggregate_id: string
    aggregate_version: integer
    session_id: string
    principal_type: string(USER|SERVICE_ACCOUNT)
    principal_id: string
    user_id: string|null
    reason: string(LOGOUT|LOGOUT_ALL|PASSWORD_CHANGED|INITIAL_PASSWORD_RESET|TOKEN_REUSE|USER_DISABLED|CREDENTIAL_REVOKED)
    actor_principal_type: string(USER|SERVICE_ACCOUNT)
    actor_principal_id: string
    actor_user_id: string|null
  idempotency_key: identity.auth.session_revoked:{session_id}:{aggregate_version}
  retry_policy: 持久化 Outbox 重试；消费者按 session_id 与 aggregate_version 去重。
  failure_policy: 撤销事实已经持久化即生效；事件恢复期间禁止依赖事件恢复访问。
  related_rules: [BR-IAM-006, BR-IAM-007, BR-IAM-015]
  related_user_stories: [US-IAM-004, US-IAM-009]

identity.authorization.changed:
  producer: identity.rbac
  consumers: [principal-cache, security-monitor]
  trigger_condition: 角色权限、用户/服务账号直接角色、用户组成员或用户组角色变化影响某个主体并提交后；每个受影响主体独立发布失效通知。
  payload:
    event_id: string
    event_name: string
    occurred_at: string(date-time)
    aggregate_id: string
    aggregate_version: integer
    principal_type: string(USER|SERVICE_ACCOUNT)
    principal_id: string
    authorization_version: integer
    change_source_type: string(USER_ROLE|SERVICE_ACCOUNT_ROLE|GROUP_MEMBER|GROUP_ROLE|ROLE_PERMISSION|ROLE_STATUS)
    change_source_id: string
    changed_permission_codes: string[]
    actor_principal_type: string(USER|SERVICE_ACCOUNT)
    actor_principal_id: string
    actor_user_id: string|null
  idempotency_key: identity.authorization.changed:{principal_type}:{principal_id}:{authorization_version}
  retry_policy: 持久化 Outbox 重试；缓存和 SSE 投影按 principal 与 authorization_version 单调失效。
  failure_policy: 权限事实以 Identity 提交结果为准；客户端收到事件后必须重新读取完整授权投影，不能从事件 payload 拼装权限。
  related_rules: [BR-IAM-008, BR-IAM-009, BR-IAM-015, BR-IAM-024, BR-IAM-025, BR-IAM-026]
  related_user_stories: [US-IAM-005, US-IAM-006, US-IAM-009, US-IAM-016, US-IAM-018]

identity.resource_grant.changed:
  producer: identity.resource-access
  consumers: [principal-cache, resource-domain-projection]
  trigger_condition: 已接入资源 domain 的 ResourceAccessGrant 创建、修改、过期或撤销并提交后。
  payload:
    event_id: string
    event_name: string
    occurred_at: string(date-time)
    aggregate_id: string
    aggregate_version: integer
    resource_type: string
    resource_id: string
    subject_type: string(USER|GROUP)
    subject_id: string
    access_level: string(VIEW|USE|EDIT|MANAGE)
    change_type: string(CREATED|UPDATED|EXPIRED|REVOKED)
    owner_user_id: string|null
    actor_principal_type: string(USER|SERVICE_ACCOUNT)
    actor_principal_id: string
    actor_user_id: string|null
  idempotency_key: identity.resource_grant.changed:{resource_type}:{resource_id}:{aggregate_version}
  retry_policy: 持久化 Outbox 重试；消费者按资源和 aggregate_version 去重。
  failure_policy: 共享授权事实以 Identity 提交结果为准；资源 domain 必须重新读取授权结果，不依赖事件完整性。
  related_rules: [BR-IAM-011, BR-IAM-012, BR-IAM-013]
  related_user_stories: [US-IAM-006, US-IAM-007, US-IAM-011]

identity.service_account.changed:
  producer: identity.service-account
  consumers: [principal-cache, security-monitor]
  trigger_condition: ServiceAccount 创建、状态变化、权限变化或凭据轮换/撤销并提交后。
  payload:
    event_id: string
    event_name: string
    occurred_at: string(date-time)
    aggregate_id: string
    aggregate_version: integer
    service_account_id: string
    owner_type: string
    owner_id: string
    owner_state: string(AVAILABLE|DELETED|UNAVAILABLE|NOT_VISIBLE)
    status: string(ACTIVE|DISABLED)
    authorization_version: integer
    credential_version: integer
    change_type: string(CREATED|UPDATED|DISABLED|ENABLED|ROLE_CHANGED|ROTATED|CREDENTIAL_REVOKED)
    actor_principal_type: string(USER|SERVICE_ACCOUNT)
    actor_principal_id: string
    actor_user_id: string|null
  idempotency_key: identity.service_account.changed:{service_account_id}:{aggregate_version}
  retry_policy: 持久化 Outbox 重试；消费者按 service_account_id 与 aggregate_version 去重。
  failure_policy: 凭据撤销和状态事实以 Identity 为准；消费者不可因事件延迟继续授权旧凭据。
  related_rules: [BR-IAM-010, BR-IAM-014, BR-IAM-015, BR-IAM-025, BR-IAM-026, BR-IAM-027]
  related_user_stories: [US-IAM-008, US-IAM-009, US-IAM-011, US-IAM-018]
