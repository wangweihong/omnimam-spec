identity.user.read:
  domain: identity
  module: user
  resource: user
  action: read, list
  subject: ordinary_user, system_admin
  description: 查询当前主体可见的用户摘要和用户管理范围内的用户。
  frontend_usage: 用户共享选择器和管理员用户管理。
  backend_enforcement: 普通用户只返回资源共享场景所需的最小摘要；管理员查询必须按身份管理范围过滤，不返回密码、Token 或安全字段。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-IAM-001, BR-IAM-012, BR-IAM-019]
  related_user_stories: [US-IAM-002, US-IAM-007, US-IAM-012]

identity.user.manage:
  domain: identity
  module: user
  resource: user
  action: create, update, disable, enable, unlock, delete
  subject: system_admin
  description: 管理用户资料、状态、角色归属和删除流程。
  frontend_usage: 管理后台用户管理。
  backend_enforcement: 禁止读取密码或完整凭据；删除前检查业务资源、任务、服务账号、共享关系和最后一个 SUPER_ADMIN 保护。
  default_roles: [ADMIN, SUPER_ADMIN]
  related_rules: [BR-IAM-002, BR-IAM-007, BR-IAM-017]
  related_user_stories: [US-IAM-002]

identity.role.manage:
  domain: identity
  module: rbac
  resource: role
  action: read, create, update, assign
  subject: system_admin
  description: 管理角色和角色权限分配。
  frontend_usage: 角色管理和权限分配页面。
  backend_enforcement: 内置角色受保护；只能分配已登记且未废弃的权限码；角色变更必须递增授权版本并写审计。
  default_roles: [SUPER_ADMIN]
  related_rules: [BR-IAM-008, BR-IAM-009, BR-IAM-015]
  related_user_stories: [US-IAM-005, US-IAM-009]

identity.permission.read:
  domain: identity
  module: rbac
  resource: permission
  action: read, list
  subject: ordinary_user, system_admin, service_principal
  description: 查询已登记权限目录或当前主体的权限投影。
  frontend_usage: 动态菜单、按钮和权限目录展示。
  backend_enforcement: 普通用户只可读取当前主体可用权限投影；不得把权限目录视为授权结果或资源可见性证明。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-IAM-005, BR-IAM-009]
  related_user_stories: [US-IAM-005, US-IAM-006]

identity.group.manage:
  domain: identity
  module: rbac
  resource: group
  action: read, create, update, manage_members, manage_roles
  subject: system_admin
  description: 管理静态用户组、成员和用户组角色。
  frontend_usage: 用户组管理页面。
  backend_enforcement: 只允许静态组；成员和角色关系变化必须刷新授权版本并审计。
  default_roles: [ADMIN, SUPER_ADMIN]
  related_rules: [BR-IAM-008, BR-IAM-015]
  related_user_stories: [US-IAM-005]

identity.authz.check:
  domain: identity
  module: principal
  resource: authorization
  action: check
  subject: service_principal, system_admin
  description: 为业务 domain 返回当前 PrincipalContext 的权限判定。
  frontend_usage: 不直接暴露给普通前端。
  backend_enforcement: 必须校验调用服务主体、请求权限码、委托用户上下文和审计要求；不返回完整 IAM 私有数据。
  related_rules: [BR-IAM-009, BR-IAM-010, BR-IAM-019]
  related_user_stories: [US-IAM-006, US-IAM-011]

identity.resource_grant.read:
  domain: identity
  module: resource-access
  resource: resource_access_grant
  action: read, list
  subject: ordinary_user, system_admin
  description: 查询已接入资源 domain 的共享授权。
  frontend_usage: 资源共享面板。
  backend_enforcement: 目标 domain 必须声明接入和可用等级；授权详情按当前主体可见范围裁剪。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-IAM-012, BR-IAM-019]
  related_user_stories: [US-IAM-007, US-IAM-012]

identity.resource_grant.manage:
  domain: identity
  module: resource-access
  resource: resource_access_grant
  action: create, update, delete
  subject: resource_owner, authorized_manager, system_admin
  description: 为已接入的资源 domain 创建、修改、过期或撤销用户/用户组共享授权。
  frontend_usage: 资源详情的共享和撤销入口。
  backend_enforcement: 通过目标 domain 受控接口确认资源存在、owner、visibility、状态和当前动作权限；Identity 不接受客户端直接覆盖 owner。
  related_rules: [BR-IAM-011, BR-IAM-012, BR-IAM-013]
  related_user_stories: [US-IAM-006, US-IAM-007]

identity.service_account.read:
  domain: identity
  module: service-account
  resource: service_account
  action: read, list
  subject: system_admin
  description: 查询服务账号非敏感摘要和状态。
  frontend_usage: 服务账号管理页面。
  backend_enforcement: 不返回 client_secret、凭据哈希或完整 Access Token；按管理范围过滤 owner_type/owner_id。
  default_roles: [ADMIN, SUPER_ADMIN]
  related_rules: [BR-IAM-014, BR-IAM-015]
  related_user_stories: [US-IAM-008, US-IAM-009]

identity.service_account.manage:
  domain: identity
  module: service-account
  resource: service_account
  action: create, update, disable, enable, rotate_credential
  subject: system_admin
  description: 管理受控 ServiceAccount 及其凭据轮换和撤销。
  frontend_usage: 服务账号创建、停用和凭据轮换。
  backend_enforcement: 默认最小权限；凭据明文只展示一次；禁用或轮换必须使旧凭据/Token 失效并写审计。
  default_roles: [SUPER_ADMIN]
  related_rules: [BR-IAM-010, BR-IAM-014, BR-IAM-015]
  related_user_stories: [US-IAM-008, US-IAM-009, US-IAM-011]

identity.principal.introspect:
  domain: identity
  module: principal
  resource: principal_context
  action: introspect
  subject: service_principal
  description: 供受控业务 domain 获取经过验证的一跳 PrincipalContext 和授权结果。
  frontend_usage: 不向前端暴露。
  backend_enforcement: 只允许注册服务主体；结果不包含密码、Token 原文、完整角色关系或 IAM 私有表数据。
  related_rules: [BR-IAM-010, BR-IAM-019]
  related_user_stories: [US-IAM-006, US-IAM-011]

identity.auth.session:
  domain: identity
  module: session
  resource: auth_session
  action: read, revoke, heartbeat
  subject: ordinary_user, system_admin
  description: 查询当前用户会话、撤销会话或更新当前会话在线心跳。
  frontend_usage: 登录会话列表、当前设备登出和在线状态维护。
  backend_enforcement: 用户只能操作自己的会话；heartbeat 只能更新当前认证会话的 last_active_at，不延长 Token 或会话期限；管理员操作必须有明确管理权限并记录审计。
  default_roles: [USER, ADMIN, SUPER_ADMIN]
  related_rules: [BR-IAM-005, BR-IAM-007, BR-IAM-015, BR-IAM-022]
  related_user_stories: [US-IAM-004, US-IAM-009, US-IAM-014]
