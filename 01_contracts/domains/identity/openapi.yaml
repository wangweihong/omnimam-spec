openapi: 3.0.3
info:
  title: OmniMAM Identity API
  version: 0.1.0-draft
  license:
    name: Internal Spec Draft
    url: https://omnimam.invalid/spec
  description: >-
    Identity 认证、用户、RBAC、PrincipalContext、资源授权和 ServiceAccount
    合同；系统认证配置与 AuditLog 由 platform-management 提供。业务错误统一使用 HTTP 200 与稳定 code/value。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - {name: auth, description: 注册、登录、Token 和会话操作。}
  - {name: users, description: 用户注册后的管理操作。}
  - {name: rbac, description: 角色、权限和静态用户组。}
  - {name: resource-access, description: 已接入资源 domain 的共享授权。}
  - {name: service-accounts, description: 受控服务主体和凭据。}
  - {name: principal, description: 受控服务间 PrincipalContext 授权检查。}

paths:
  /api/v1/iam/auth/register:
    post:
      tags: [auth]
      summary: 用户自主注册
      operationId: register_user
      security: []
      x-authorization: anonymous
      x-s1-refs: {user_stories: [US-IAM-001], business_rules: [BR-IAM-001, BR-IAM-002, BR-IAM-003, BR-IAM-016, BR-IAM-021]}
      x-error-codes: [ERR_IDENTITY_USERNAME_ALREADY_EXISTS, ERR_IDENTITY_EMAIL_ALREADY_EXISTS, ERR_IDENTITY_PASSWORD_POLICY_FAILED, ERR_IDENTITY_USER_CREATE_INVALID]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses:
        '200': {description: 注册后的认证结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AuthResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      operationId: login_user
      security: []
      x-authorization: anonymous
      x-s1-refs: {user_stories: [US-IAM-001, US-IAM-003], business_rules: [BR-IAM-003, BR-IAM-004, BR-IAM-005, BR-IAM-015, BR-IAM-021]}
      x-error-codes: [ERR_IDENTITY_INVALID_CREDENTIALS, ERR_IDENTITY_ACCOUNT_PENDING, ERR_IDENTITY_ACCOUNT_DISABLED, ERR_IDENTITY_ACCOUNT_LOCKED, ERR_IDENTITY_FIRST_LOGIN_REQUIRED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {description: 登录结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AuthResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新登录凭据
      operationId: refresh_token
      security: []
      x-authorization: anonymous
      x-s1-refs: {user_stories: [US-IAM-004], business_rules: [BR-IAM-005, BR-IAM-006, BR-IAM-015, BR-IAM-022]}
      x-error-codes: [ERR_IDENTITY_REFRESH_TOKEN_INVALID, ERR_IDENTITY_REFRESH_TOKEN_REUSED, ERR_IDENTITY_TOKEN_REVOKED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}}
      responses:
        '200': {description: 新凭据或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AuthResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/presence/heartbeat:
    post:
      tags: [auth]
      summary: 更新当前会话在线心跳
      operationId: heartbeat_presence
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-014], business_rules: [BR-IAM-007, BR-IAM-022]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_IDENTITY_SESSION_STATE_INVALID]
      responses:
        '200': {description: 在线心跳结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/PresenceHeartbeatResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/logout:
    post:
      tags: [auth]
      summary: 当前设备登出
      operationId: logout_current_session
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-004], business_rules: [BR-IAM-007, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_IDENTITY_SESSION_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      responses:
        '200': {description: 登出结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ActionResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/logout-all:
    post:
      tags: [auth]
      summary: 全部设备登出
      operationId: logout_all_sessions
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-004], business_rules: [BR-IAM-007, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      responses:
        '200': {description: 全部登出结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ActionResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/change-password:
    post:
      tags: [auth]
      summary: 修改当前密码
      operationId: change_password
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-003, US-IAM-004], business_rules: [BR-IAM-004, BR-IAM-007, BR-IAM-015, BR-IAM-016, BR-IAM-021]}
      x-error-codes: [ERR_IDENTITY_OLD_PASSWORD_INVALID, ERR_IDENTITY_PASSWORD_POLICY_FAILED, ERR_IDENTITY_FIRST_LOGIN_REQUIRED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordRequest'}}}}
      responses:
        '200': {description: 密码修改结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ActionResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/me:
    get:
      tags: [auth]
      summary: 获取当前用户
      operationId: get_current_user
      x-permission: identity.user.read
      x-s1-refs: {user_stories: [US-IAM-001, US-IAM-013], business_rules: [BR-IAM-001, BR-IAM-005, BR-IAM-022]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_IDENTITY_USER_NOT_VISIBLE]
      responses:
        '200': {description: 当前用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    put:
      tags: [auth]
      summary: 更新当前用户资料
      operationId: update_current_user
      x-permission: identity.user.read
      x-s1-refs: {user_stories: [US-IAM-001, US-IAM-003], business_rules: [BR-IAM-001, BR-IAM-004, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_EMAIL_ALREADY_EXISTS, ERR_IDENTITY_USER_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserSelfUpdateRequest'}}}}
      responses:
        '200': {description: 更新后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/sessions:
    get:
      tags: [auth]
      summary: 查询当前用户会话
      operationId: list_current_sessions
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-004], business_rules: [BR-IAM-005, BR-IAM-007, BR-IAM-019]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_IDENTITY_SESSION_NOT_VISIBLE]
      parameters:
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
      responses:
        '200': {description: 会话列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/SessionListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/sessions/{session_id}:
    delete:
      tags: [auth]
      summary: 撤销指定会话
      operationId: revoke_session
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-004], business_rules: [BR-IAM-007, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_SESSION_NOT_VISIBLE, ERR_IDENTITY_SESSION_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/session_id'}]
      responses:
        '200': {description: 撤销结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ActionResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users:
    get:
      tags: [users]
      summary: 查询用户列表
      operationId: list_users
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002, US-IAM-013], business_rules: [BR-IAM-001, BR-IAM-012, BR-IAM-019, BR-IAM-022]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE]
      parameters:
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
        - {$ref: '#/components/parameters/keyword'}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
        - {name: statuses, in: query, description: 用户状态逗号分隔。, schema: {type: string}}
      responses:
        '200': {description: 用户列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/UserListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [users]
      summary: 管理员创建用户
      operationId: admin_create_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-002, BR-IAM-003, BR-IAM-004, BR-IAM-016, BR-IAM-021]}
      x-error-codes: [ERR_IDENTITY_USERNAME_ALREADY_EXISTS, ERR_IDENTITY_EMAIL_ALREADY_EXISTS, ERR_IDENTITY_USER_CREATE_INVALID, ERR_IDENTITY_PASSWORD_POLICY_FAILED]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserCreateRequest'}}}}
      responses:
        '200': {description: 新用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}:
    get:
      tags: [users]
      summary: 获取用户详情
      operationId: get_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002, US-IAM-013], business_rules: [BR-IAM-001, BR-IAM-012, BR-IAM-019, BR-IAM-022]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200': {description: 用户详情或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    put:
      tags: [users]
      summary: 更新用户资料和状态相关非敏感字段
      operationId: update_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-001, BR-IAM-007, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_EMAIL_ALREADY_EXISTS, ERR_IDENTITY_USER_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserAdminUpdateRequest'}}}}
      responses:
        '200': {description: 更新后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    delete:
      tags: [users]
      summary: 逻辑删除用户
      operationId: delete_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-007, BR-IAM-017, BR-IAM-019]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_SELF_DELETE_FORBIDDEN, ERR_IDENTITY_LAST_SUPER_ADMIN_PROTECTED, ERR_IDENTITY_USER_DELETE_BLOCKED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200': {description: 删除后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}/disable:
    post:
      tags: [users]
      summary: 禁用用户
      operationId: disable_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-007, BR-IAM-017]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_LAST_SUPER_ADMIN_PROTECTED, ERR_IDENTITY_USER_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      requestBody: {$ref: '#/components/requestBodies/ActionReason'}
      responses:
        '200': {description: 禁用后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}/enable:
    post:
      tags: [users]
      summary: 恢复用户
      operationId: enable_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-007]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_USER_STATE_INVALID]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200': {description: 恢复后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}/unlock:
    post:
      tags: [users]
      summary: 解除登录锁定
      operationId: unlock_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-003, BR-IAM-007]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_USER_STATE_INVALID]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200': {description: 解锁后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/permissions:
    get:
      tags: [rbac]
      summary: 查询当前主体权限投影
      operationId: get_current_permissions
      x-permission: identity.permission.read
      x-s1-refs: {user_stories: [US-IAM-006], business_rules: [BR-IAM-005, BR-IAM-009, BR-IAM-010]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_IDENTITY_AUTHZ_CONTEXT_INVALID]
      responses:
        '200': {description: 当前主体权限投影或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/PermissionProjection'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/permissions:
    get:
      tags: [rbac]
      summary: 查询已登记权限目录
      operationId: list_permission_definitions
      x-permission: identity.permission.read
      x-s1-refs: {user_stories: [US-IAM-005], business_rules: [BR-IAM-009, BR-IAM-019]}
      x-error-codes: [ERR_IDENTITY_AUTHZ_DENIED]
      parameters: [{$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}, {$ref: '#/components/parameters/keyword'}]
      responses:
        '200': {description: 权限目录或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/PermissionListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/roles:
    get:
      tags: [rbac]
      summary: 查询角色
      operationId: list_roles
      x-permission: identity.role.manage
      x-s1-refs: {user_stories: [US-IAM-005], business_rules: [BR-IAM-008, BR-IAM-009]}
      x-error-codes: [ERR_IDENTITY_ROLE_NOT_VISIBLE]
      parameters: [{$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses:
        '200': {description: 角色列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/RoleListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [rbac]
      summary: 创建角色
      operationId: create_role
      x-permission: identity.role.manage
      x-s1-refs: {user_stories: [US-IAM-005], business_rules: [BR-IAM-009]}
      x-error-codes: [ERR_IDENTITY_ROLE_GRANT_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleWriteRequest'}}}}
      responses:
        '200': {description: 创建的角色或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Role'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/roles/{role_id}:
    get:
      tags: [rbac]
      summary: 获取角色详情
      operationId: get_role
      x-permission: identity.role.manage
      x-s1-refs: {user_stories: [US-IAM-005], business_rules: [BR-IAM-008, BR-IAM-009]}
      x-error-codes: [ERR_IDENTITY_ROLE_NOT_VISIBLE]
      parameters: [{$ref: '#/components/parameters/role_id'}]
      responses:
        '200': {description: 角色详情或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Role'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    put:
      tags: [rbac]
      summary: 更新角色
      operationId: update_role
      x-permission: identity.role.manage
      x-s1-refs: {user_stories: [US-IAM-005], business_rules: [BR-IAM-009, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_ROLE_NOT_VISIBLE, ERR_IDENTITY_ROLE_BUILTIN_PROTECTED, ERR_IDENTITY_ROLE_GRANT_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/role_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleWriteRequest'}}}}
      responses:
        '200': {description: 更新后的角色或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Role'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/roles/{role_id}/permissions:
    put:
      tags: [rbac]
      summary: 整体替换角色权限
      operationId: replace_role_permissions
      x-permission: identity.role.manage
      x-s1-refs: {user_stories: [US-IAM-005], business_rules: [BR-IAM-009, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_ROLE_NOT_VISIBLE, ERR_IDENTITY_ROLE_BUILTIN_PROTECTED, ERR_IDENTITY_PERMISSION_NOT_FOUND, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/role_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PermissionReplaceRequest'}}}}
      responses:
        '200': {description: 角色权限替换结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Role'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/groups:
    get:
      tags: [rbac]
      summary: 查询用户组
      operationId: list_groups
      x-permission: identity.group.manage
      x-s1-refs: {user_stories: [US-IAM-005], business_rules: [BR-IAM-008]}
      x-error-codes: [ERR_IDENTITY_GROUP_NOT_VISIBLE]
      parameters: [{$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses:
        '200': {description: 用户组列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/GroupListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [rbac]
      summary: 创建用户组
      operationId: create_group
      x-permission: identity.group.manage
      x-s1-refs: {user_stories: [US-IAM-005], business_rules: [BR-IAM-008, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_GROUP_MEMBER_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupWriteRequest'}}}}
      responses:
