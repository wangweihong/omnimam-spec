openapi: 3.0.3
info:
  title: OmniMAM Identity API
  version: 0.2.0-draft
  license:
    name: Internal Spec Draft
    url: https://omnimam.invalid/spec
  description: >-
    Identity 认证、用户、RBAC、PrincipalContext、资源授权和 ServiceAccount
    合同；系统认证配置与 AuditLog 由 platform-management 提供。业务错误统一使用 HTTP 200 与稳定 code/value。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - {name: auth, description: 注册、登录、Token 和会话操作。}
  - {name: users, description: 用户注册后的管理操作。}
  - {name: rbac, description: 角色、权限和静态用户组。}
  - {name: resource-access, description: 已接入资源 domain 的共享授权。}
  - {name: service-accounts, description: 受控服务主体和凭据。}
  - {name: principal, description: 受控服务间 PrincipalContext 授权检查。}

paths:
  /api/v1/iam/auth/register/start:
    post:
      tags: [auth]
      summary: 开始 OPAQUE 注册
      operationId: register_start
      security: []
      x-authorization: anonymous
      x-s1-refs: {user_stories: [US-IAM-001, US-IAM-015], business_rules: [BR-IAM-001, BR-IAM-002, BR-IAM-003, BR-IAM-016, BR-IAM-021, BR-IAM-023]}
      x-error-codes: [ERR_IDENTITY_USERNAME_ALREADY_EXISTS, ERR_IDENTITY_EMAIL_ALREADY_EXISTS, ERR_IDENTITY_PASSWORD_PROTOCOL_INVALID, ERR_IDENTITY_REGISTRATION_STATE_INVALID]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterStartRequest'}}}}
      responses:
        '200': {description: OPAQUE registration response 或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/OpaqueRegistrationStartResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/register/finish:
    post:
      tags: [auth]
      summary: 完成 OPAQUE 注册
      operationId: register_finish
      security: []
      x-authorization: anonymous
      x-s1-refs: {user_stories: [US-IAM-001, US-IAM-015], business_rules: [BR-IAM-002, BR-IAM-021, BR-IAM-023]}
      x-error-codes: [ERR_IDENTITY_PASSWORD_PROTOCOL_INVALID, ERR_IDENTITY_PASSWORD_EXCHANGE_EXPIRED, ERR_IDENTITY_PASSWORD_EXCHANGE_REPLAYED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterFinishRequest'}}}}
      responses:
        '200': {description: OPEN 注册后的认证结果、ADMIN_APPROVAL 待审批结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AuthResponse'}, {$ref: '#/components/schemas/PendingRegistrationResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/login/start:
    post:
      tags: [auth]
      summary: 开始 OPAQUE 登录
      operationId: login_start
      security: []
      x-authorization: anonymous
      x-s1-refs: {user_stories: [US-IAM-001, US-IAM-003, US-IAM-016, US-IAM-020], business_rules: [BR-IAM-003, BR-IAM-004, BR-IAM-005, BR-IAM-015, BR-IAM-021, BR-IAM-024]}
      x-error-codes: [ERR_IDENTITY_PASSWORD_PROTOCOL_INVALID, ERR_IDENTITY_PASSWORD_EXCHANGE_EXPIRED]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginStartRequest'}}}}
      responses:
        '200': {description: OPAQUE KE2 或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/OpaqueLoginStartResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/login/finish:
    post:
      tags: [auth]
      summary: 完成 OPAQUE 登录
      operationId: login_finish
      security: []
      x-authorization: anonymous
      x-s1-refs: {user_stories: [US-IAM-001, US-IAM-003, US-IAM-016, US-IAM-020], business_rules: [BR-IAM-003, BR-IAM-004, BR-IAM-005, BR-IAM-015, BR-IAM-021, BR-IAM-024]}
      x-error-codes: [ERR_IDENTITY_INVALID_CREDENTIALS, ERR_IDENTITY_ACCOUNT_PENDING, ERR_IDENTITY_ACCOUNT_REJECTED, ERR_IDENTITY_ACCOUNT_DISABLED, ERR_IDENTITY_ACCOUNT_LOCKED, ERR_IDENTITY_PASSWORD_PROTOCOL_INVALID, ERR_IDENTITY_PASSWORD_EXCHANGE_EXPIRED, ERR_IDENTITY_PASSWORD_EXCHANGE_REPLAYED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginFinishRequest'}}}}
      responses:
        '200': {description: 登录结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AuthResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新登录凭据
      operationId: refresh_token
      security: []
      x-authorization: anonymous
      x-s1-refs: {user_stories: [US-IAM-004, US-IAM-016, US-IAM-020], business_rules: [BR-IAM-005, BR-IAM-006, BR-IAM-015, BR-IAM-022, BR-IAM-024]}
      x-error-codes: [ERR_IDENTITY_REFRESH_TOKEN_INVALID, ERR_IDENTITY_REFRESH_TOKEN_REUSED, ERR_IDENTITY_TOKEN_REVOKED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}}
      responses:
        '200': {description: 新凭据或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AuthResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/presence/heartbeat:
    post:
      tags: [auth]
      summary: 更新当前会话在线心跳
      operationId: heartbeat_presence
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-014], business_rules: [BR-IAM-007, BR-IAM-022]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_IDENTITY_SESSION_STATE_INVALID]
      responses:
        '200': {description: 在线心跳结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/PresenceHeartbeatResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/logout:
    post:
      tags: [auth]
      summary: 当前设备登出
      operationId: logout_current_session
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-004], business_rules: [BR-IAM-007, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_IDENTITY_SESSION_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      responses:
        '200': {description: 登出结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ActionResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/logout-all:
    post:
      tags: [auth]
      summary: 全部设备登出
      operationId: logout_all_sessions
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-004], business_rules: [BR-IAM-007, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      responses:
        '200': {description: 全部登出结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ActionResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/change-password/start:
    post:
      tags: [auth]
      summary: 开始 OPAQUE 改密
      operationId: change_password_start
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-003, US-IAM-004], business_rules: [BR-IAM-004, BR-IAM-007, BR-IAM-015, BR-IAM-016, BR-IAM-021]}
      x-error-codes: [ERR_IDENTITY_PASSWORD_PROTOCOL_INVALID, ERR_IDENTITY_PASSWORD_EXCHANGE_EXPIRED, ERR_IDENTITY_TOKEN_REVOKED]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordStartRequest'}}}}
      responses:
        '200': {description: OPAQUE KE2 或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/OpaqueLoginStartResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/change-password/finish:
    post:
      tags: [auth]
      summary: 完成 OPAQUE 改密
      operationId: change_password_finish
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-003, US-IAM-004], business_rules: [BR-IAM-004, BR-IAM-007, BR-IAM-015, BR-IAM-016, BR-IAM-021]}
      x-error-codes: [ERR_IDENTITY_OLD_PASSWORD_INVALID, ERR_IDENTITY_PASSWORD_PROTOCOL_INVALID, ERR_IDENTITY_PASSWORD_EXCHANGE_EXPIRED, ERR_IDENTITY_PASSWORD_EXCHANGE_REPLAYED, ERR_IDENTITY_FIRST_LOGIN_REQUIRED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordFinishRequest'}}}}
      responses:
        '200': {description: 密码修改结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ActionResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/me:
    get:
      tags: [auth]
      summary: 获取当前用户
      operationId: get_current_user
      x-permission: identity.user.read
      x-s1-refs: {user_stories: [US-IAM-001, US-IAM-013], business_rules: [BR-IAM-001, BR-IAM-005, BR-IAM-022]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_IDENTITY_USER_NOT_VISIBLE]
      responses:
        '200': {description: 当前用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    put:
      tags: [auth]
      summary: 更新当前用户资料
      operationId: update_current_user
      x-permission: identity.user.read
      x-s1-refs: {user_stories: [US-IAM-001, US-IAM-003], business_rules: [BR-IAM-001, BR-IAM-004, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_EMAIL_ALREADY_EXISTS, ERR_IDENTITY_USER_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserSelfUpdateRequest'}}}}
      responses:
        '200': {description: 更新后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/sessions:
    get:
      tags: [auth]
      summary: 查询当前用户会话
      operationId: list_current_sessions
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-004], business_rules: [BR-IAM-005, BR-IAM-007, BR-IAM-019]}
      x-error-codes: [ERR_IDENTITY_TOKEN_REVOKED, ERR_IDENTITY_SESSION_NOT_VISIBLE]
      parameters:
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
      responses:
        '200': {description: 会话列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/SessionListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/auth/sessions/{session_id}:
    delete:
      tags: [auth]
      summary: 撤销指定会话
      operationId: revoke_session
      x-permission: identity.auth.session
      x-s1-refs: {user_stories: [US-IAM-004], business_rules: [BR-IAM-007, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_SESSION_NOT_VISIBLE, ERR_IDENTITY_SESSION_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/session_id'}]
      responses:
        '200': {description: 撤销结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ActionResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/service-accounts/token:
    post:
      tags: [service-accounts]
      summary: 使用服务凭据交换短期 Access Token
      operationId: exchange_service_account_token
      security: []
      x-authorization: service_credential
      x-s1-refs: {user_stories: [US-IAM-008, US-IAM-018], business_rules: [BR-IAM-010, BR-IAM-014, BR-IAM-026]}
      x-error-codes: [ERR_IDENTITY_SERVICE_ACCOUNT_CREDENTIAL_INVALID, ERR_IDENTITY_SERVICE_ACCOUNT_DISABLED, ERR_IDENTITY_SERVICE_ACCOUNT_OWNER_UNAVAILABLE, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceAccountTokenRequest'}}}}
      responses:
        '200': {description: 服务主体短期凭据和授权投影，或不泄露账号存在性的业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ServiceAccountTokenResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users:
    get:
      tags: [users]
      summary: 查询用户列表
      operationId: list_users
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002, US-IAM-013], business_rules: [BR-IAM-001, BR-IAM-012, BR-IAM-019, BR-IAM-022]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE]
      parameters:
        - {$ref: '#/components/parameters/page_num'}
        - {$ref: '#/components/parameters/page_size'}
        - {$ref: '#/components/parameters/keyword'}
        - {$ref: '#/components/parameters/sort_order'}
        - {$ref: '#/components/parameters/created_after'}
        - {$ref: '#/components/parameters/created_before'}
        - {name: statuses, in: query, description: 用户状态逗号分隔。, schema: {type: string}}
      responses:
        '200': {description: 用户列表或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/UserListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [users]
      summary: 管理员创建用户
      operationId: admin_create_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002, US-IAM-020], business_rules: [BR-IAM-002, BR-IAM-003, BR-IAM-004, BR-IAM-016, BR-IAM-021, BR-IAM-027]}
      x-error-codes: [ERR_IDENTITY_USERNAME_ALREADY_EXISTS, ERR_IDENTITY_EMAIL_ALREADY_EXISTS, ERR_IDENTITY_USER_CREATE_INVALID, ERR_IDENTITY_PASSWORD_POLICY_FAILED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserCreateRequest'}}}}
      responses:
        '200': {description: 新用户和一次性初始密码，或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AdminUserCreatedResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}:
    get:
      tags: [users]
      summary: 获取用户详情
      operationId: get_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002, US-IAM-013], business_rules: [BR-IAM-001, BR-IAM-012, BR-IAM-019, BR-IAM-022]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200': {description: 用户详情或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    put:
      tags: [users]
      summary: 更新用户资料和状态相关非敏感字段
      operationId: update_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-001, BR-IAM-007, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_EMAIL_ALREADY_EXISTS, ERR_IDENTITY_USER_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserAdminUpdateRequest'}}}}
      responses:
        '200': {description: 更新后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    delete:
      tags: [users]
      summary: 逻辑删除用户
      operationId: delete_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002, US-IAM-017], business_rules: [BR-IAM-007, BR-IAM-017, BR-IAM-019, BR-IAM-028]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_SELF_DELETE_FORBIDDEN, ERR_IDENTITY_LAST_SUPER_ADMIN_PROTECTED, ERR_IDENTITY_USER_DELETE_BLOCKED, ERR_IDENTITY_USER_DELETE_DEPENDENCY_UNAVAILABLE, ERR_IDENTITY_USER_DELETE_CHECK_STALE, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}, {$ref: '#/components/parameters/dependency_check_id'}]
      responses:
        '200': {description: 删除后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}/disable:
    post:
      tags: [users]
      summary: 禁用用户
      operationId: disable_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-007, BR-IAM-017]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_LAST_SUPER_ADMIN_PROTECTED, ERR_IDENTITY_USER_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      requestBody: {$ref: '#/components/requestBodies/ActionReason'}
      responses:
        '200': {description: 禁用后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}/enable:
    post:
      tags: [users]
      summary: 恢复用户
      operationId: enable_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-007]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_USER_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200': {description: 恢复后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}/unlock:
    post:
      tags: [users]
      summary: 解除登录锁定
      operationId: unlock_user
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002], business_rules: [BR-IAM-003, BR-IAM-007]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_USER_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200': {description: 解锁后的用户或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}/reset-initial-password:
    post:
      tags: [users]
      summary: 重新生成一次性初始密码
      operationId: reset_initial_password
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002, US-IAM-020], business_rules: [BR-IAM-004, BR-IAM-007, BR-IAM-015, BR-IAM-027]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_USER_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200': {description: 只返回一次的新初始密码或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/InitialPasswordResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}/roles:
    put:
      tags: [users, rbac]
      summary: 整体替换用户直接角色授权
      operationId: replace_user_roles
      x-permission: identity.user.manage
      x-s1-refs: {user_stories: [US-IAM-002, US-IAM-005, US-IAM-016], business_rules: [BR-IAM-008, BR-IAM-009, BR-IAM-024, BR-IAM-025]}
      x-error-codes: [ERR_IDENTITY_USER_NOT_VISIBLE, ERR_IDENTITY_ROLE_NOT_VISIBLE, ERR_IDENTITY_ROLE_GRANT_INVALID, ERR_IDENTITY_LAST_SUPER_ADMIN_PROTECTED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/user_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleGrantReplaceRequest'}}}}
      responses:
        '200': {description: 更新后的用户授权摘要或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/User'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/users/{user_id}/deletion-dependencies:
