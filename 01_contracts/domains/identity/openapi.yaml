      x-s1-refs: {user_stories: [US-IAM-008], business_rules: [BR-IAM-014, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_SERVICE_ACCOUNT_NOT_VISIBLE, ERR_IDENTITY_SERVICE_ACCOUNT_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/service_account_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceAccountUpdateRequest'}}}}
      responses:
        '200': {description: 更新后的服务账号或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ServiceAccount'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/service-accounts/{service_account_id}/disable:
    post:
      tags: [service-accounts]
      summary: 禁用服务账号
      operationId: disable_service_account
      x-permission: identity.service_account.manage
      x-s1-refs: {user_stories: [US-IAM-008, US-IAM-009], business_rules: [BR-IAM-014, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_SERVICE_ACCOUNT_NOT_VISIBLE, ERR_IDENTITY_SERVICE_ACCOUNT_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/service_account_id'}]
      requestBody: {$ref: '#/components/requestBodies/ActionReason'}
      responses:
        '200': {description: 禁用后的服务账号或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ServiceAccount'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/service-accounts/{service_account_id}/enable:
    post:
      tags: [service-accounts]
      summary: 启用服务账号
      operationId: enable_service_account
      x-permission: identity.service_account.manage
      x-s1-refs: {user_stories: [US-IAM-008], business_rules: [BR-IAM-014]}
      x-error-codes: [ERR_IDENTITY_SERVICE_ACCOUNT_NOT_VISIBLE, ERR_IDENTITY_SERVICE_ACCOUNT_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/service_account_id'}]
      responses:
        '200': {description: 启用后的服务账号或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ServiceAccount'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/service-accounts/{service_account_id}/rotate-credential:
    post:
      tags: [service-accounts]
      summary: 轮换服务账号凭据
      operationId: rotate_service_account_credential
      x-permission: identity.service_account.manage
      x-s1-refs: {user_stories: [US-IAM-008, US-IAM-009], business_rules: [BR-IAM-014, BR-IAM-015]}
      x-error-codes: [ERR_IDENTITY_SERVICE_ACCOUNT_NOT_VISIBLE, ERR_IDENTITY_SERVICE_ACCOUNT_CREDENTIAL_ROTATION_FAILED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/service_account_id'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceAccountCredentialRotateRequest'}}}}
      responses:
        '200': {description: 新凭据一次性返回或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ServiceAccountCredentialResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/service-accounts/{service_account_id}/roles:
    put:
      tags: [service-accounts, rbac]
      summary: 整体替换服务账号直接角色授权
      operationId: replace_service_account_roles
      x-permission: identity.service_account.manage
      x-s1-refs: {user_stories: [US-IAM-018], business_rules: [BR-IAM-014, BR-IAM-025, BR-IAM-026]}
      x-error-codes: [ERR_IDENTITY_SERVICE_ACCOUNT_NOT_VISIBLE, ERR_IDENTITY_SERVICE_ACCOUNT_STATE_INVALID, ERR_IDENTITY_ROLE_NOT_VISIBLE, ERR_IDENTITY_ROLE_GRANT_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/service_account_id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleGrantReplaceRequest'}}}}
      responses:
        '200': {description: 更新后的服务账号授权摘要或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ServiceAccount'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/service-accounts/{service_account_id}/credentials:
    get:
      tags: [service-accounts]
      summary: 查询服务账号凭据历史
      operationId: list_service_account_credentials
      x-permission: identity.service_account.read
      x-s1-refs: {user_stories: [US-IAM-018], business_rules: [BR-IAM-014, BR-IAM-027]}
      x-error-codes: [ERR_IDENTITY_SERVICE_ACCOUNT_NOT_VISIBLE]
      parameters: [{$ref: '#/components/parameters/service_account_id'}, {$ref: '#/components/parameters/page_num'}, {$ref: '#/components/parameters/page_size'}]
      responses:
        '200': {description: 不含 Secret 或哈希的凭据历史，或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ServiceAccountCredentialListResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/admin/service-accounts/{service_account_id}/credentials/{credential_id}/revoke:
    post:
      tags: [service-accounts]
      summary: 撤销指定服务账号凭据
      operationId: revoke_service_account_credential
      x-permission: identity.service_account.manage
      x-s1-refs: {user_stories: [US-IAM-018], business_rules: [BR-IAM-014, BR-IAM-015, BR-IAM-027]}
      x-error-codes: [ERR_IDENTITY_SERVICE_ACCOUNT_NOT_VISIBLE, ERR_IDENTITY_SERVICE_ACCOUNT_CREDENTIAL_NOT_VISIBLE, ERR_IDENTITY_SERVICE_ACCOUNT_STATE_INVALID, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/service_account_id'}, {$ref: '#/components/parameters/credential_id'}]
      requestBody: {$ref: '#/components/requestBodies/ActionReason'}
      responses:
        '200': {description: 撤销后的凭据摘要或幂等结果，或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ServiceAccountCredential'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/iam/internal/principal/check:
    post:
      tags: [principal]
      summary: 受控服务主体权限检查
      operationId: check_principal
      x-permission: identity.authz.check
      x-s1-refs: {user_stories: [US-IAM-006, US-IAM-011], business_rules: [BR-IAM-009, BR-IAM-010, BR-IAM-019]}
      x-error-codes: [ERR_IDENTITY_AUTHZ_CONTEXT_INVALID, ERR_IDENTITY_AUTHZ_DENIED, ERR_IDENTITY_PRINCIPAL_CONTEXT_INVALID]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PrincipalCheckRequest'}}}}
      responses:
        '200': {description: PrincipalContext 授权结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/PrincipalCheckResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page_num: {name: page_num, in: query, schema: {type: integer, minimum: 0, default: 0}}
    page_size: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    keyword: {name: keyword, in: query, schema: {type: string, default: ''}}
    sort_order: {name: sort_order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
    created_after: {name: created_after, in: query, schema: {type: string, format: date-time}}
    created_before: {name: created_before, in: query, schema: {type: string, format: date-time}}
    dependency_check_id: {name: dependency_check_id, in: query, required: true, schema: {type: string}, description: 最新且未过期的完整删除依赖检查 ID。}
    user_id: {name: user_id, in: path, required: true, schema: {type: string}}
    session_id: {name: session_id, in: path, required: true, schema: {type: string}}
    role_id: {name: role_id, in: path, required: true, schema: {type: string}}
    group_id: {name: group_id, in: path, required: true, schema: {type: string}}
    resource_type: {name: resource_type, in: path, required: true, schema: {type: string}}
    resource_id: {name: resource_id, in: path, required: true, schema: {type: string}}
    grant_id: {name: grant_id, in: path, required: true, schema: {type: string}}
    service_account_id: {name: service_account_id, in: path, required: true, schema: {type: string}}
    registration_application_id: {name: registration_application_id, in: path, required: true, schema: {type: string}}
    credential_id: {name: credential_id, in: path, required: true, schema: {type: string}}
  requestBodies:
    ActionReason:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionReasonRequest'
  responses:
    UnexpectedError:
      description: 未预期服务器异常。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UnexpectedErrorResponse'}
  schemas:
    ErrorResponse:
      type: object
      required: [code, value, message, messages]
      properties:
        code: {type: string}
        value: {type: integer}
        message: {type: string}
        messages: {type: object, additionalProperties: {type: string}}
        detail: {type: string, nullable: true}
        causes: {type: array, items: {type: object, additionalProperties: true}}
        data: {type: object, additionalProperties: true}
    UnexpectedErrorResponse:
      type: object
      required: [message]
      properties:
        message: {type: string}
    ActionResult:
      type: object
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
    RegisterStartRequest:
      type: object
      required: [username, email, registration_request]
      additionalProperties: false
      properties:
        username: {type: string, minLength: 1}
        email: {type: string, format: email}
        display_name: {type: string}
        registration_request: {$ref: '#/components/schemas/OpaqueMessage'}
    RegisterFinishRequest:
      type: object
      required: [exchange_id, registration_record]
      additionalProperties: false
      properties:
        exchange_id: {type: string}
        registration_record: {$ref: '#/components/schemas/OpaqueMessage'}
    LoginStartRequest:
      type: object
      required: [login, ke1]
      additionalProperties: false
      properties:
        login: {type: string}
        ke1: {$ref: '#/components/schemas/OpaqueMessage'}
        client_id: {type: string, default: omnimam-web}
        device_info: {type: string}
    LoginFinishRequest:
      type: object
      required: [exchange_id, ke3]
      additionalProperties: false
      properties:
        exchange_id: {type: string}
        ke3: {$ref: '#/components/schemas/OpaqueMessage'}
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: {type: string}
    ChangePasswordStartRequest:
      type: object
      required: [ke1]
      additionalProperties: false
      properties:
        ke1: {$ref: '#/components/schemas/OpaqueMessage'}
    ChangePasswordFinishRequest:
      type: object
      required: [exchange_id, ke3, registration_record]
      additionalProperties: false
      properties:
        exchange_id: {type: string}
        ke3: {$ref: '#/components/schemas/OpaqueMessage'}
        registration_record: {$ref: '#/components/schemas/OpaqueMessage'}
    UserSelfUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string}
        alias: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
    AdminUserCreateRequest:
      type: object
      required: [username, email, display_name]
      additionalProperties: false
      properties:
        username: {type: string}
        email: {type: string, format: email}
        display_name: {type: string}
        role_grants: {type: array, items: {$ref: '#/components/schemas/RoleGrantItem'}}
        registration_record: {$ref: '#/components/schemas/OpaqueMessage'}
    UserAdminUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string}
        alias: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
    AdminUserCreatedResponse:
      type: object
      required: [user, first_login_required]
      properties:
        user: {$ref: '#/components/schemas/User'}
        first_login_required: {type: boolean, enum: [true]}
    InitialPasswordResponse:
      type: object
      required: [user_id, first_login_required]
      properties:
        user_id: {type: string}
        first_login_required: {type: boolean, enum: [true]}
    OpaqueMessage:
      type: string
      format: byte
      description: OPAQUE 二进制消息的 base64url 编码；禁止包含原始密码。
      minLength: 1
      maxLength: 16384
    OpaqueRegistrationStartResponse:
      type: object
      required: [exchange_id, registration_response]
      properties:
        exchange_id: {type: string}
        registration_response: {$ref: '#/components/schemas/OpaqueMessage'}
    OpaqueLoginStartResponse:
      type: object
      required: [exchange_id, ke2]
      properties:
        exchange_id: {type: string}
        ke2: {$ref: '#/components/schemas/OpaqueMessage'}
    User:
      type: object
      required: [id, username, display_name, status, first_login_required, security_version, authorization_version, created_at, updated_at]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        alias: {type: string}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        status: {type: string, enum: [ACTIVE, PENDING, REJECTED, DISABLED, LOCKED, DELETED]}
        first_login_required: {type: boolean}
        security_version: {type: integer}
        authorization_version: {type: integer}
        locked_until: {type: string, format: date-time, nullable: true}
        last_login_at: {type: string, format: date-time, nullable: true}
        online: {type: boolean, nullable: true, description: 当前用户或受权管理员可见的派生在线状态；普通资源共享目录返回 null。}
        effective_roles: {type: array, items: {$ref: '#/components/schemas/EffectiveRole'}}
        direct_role_grants: {type: array, items: {$ref: '#/components/schemas/RoleGrantSummary'}}
        latest_registration_application: {$ref: '#/components/schemas/RegistrationApplicationSummary'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UserListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
    AuthResponse:
      type: object
      required: [user, access_token, refresh_token, token_type, expires_in, first_login_required, authorization]
      properties:
        user: {$ref: '#/components/schemas/User'}
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer}
        first_login_required: {type: boolean}
        authorization: {$ref: '#/components/schemas/PermissionProjection'}
    PendingRegistrationResponse:
      type: object
      required: [registration_application_id, user_id, status, submitted_at]
      properties:
        registration_application_id: {type: string}
        user_id: {type: string}
        status: {type: string, enum: [PENDING]}
        submitted_at: {type: string, format: date-time}
    Session:
      type: object
      required: [id, client_id, status, is_current, created_at, expires_at]
      properties:
        id: {type: string}
        client_id: {type: string}
        device_info: {type: string}
        ip_address: {type: string, nullable: true}
        user_agent: {type: string, nullable: true}
        status: {type: string, enum: [ACTIVE, REVOKED, EXPIRED]}
        is_current: {type: boolean}
        last_active_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    SessionListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/Session'}}
    PresenceHeartbeatResponse:
      type: object
      required: [online, last_active_at]
      properties:
        online: {type: boolean, description: 当前会话更新后的派生在线状态。}
        last_active_at: {type: string, format: date-time}
    EffectiveRole:
      type: object
      required: [id, code, name, source]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        source: {type: string, enum: [DIRECT, GROUP]}
        source_id: {type: string, nullable: true, description: GROUP 来源时为用户组 ID；DIRECT 时为空。}
    RoleGrantItem:
      type: object
      required: [role_id]
      additionalProperties: false
      properties:
        role_id: {type: string}
        effective_from: {type: string, format: date-time, nullable: true}
        effective_to: {type: string, format: date-time, nullable: true}
    RoleGrantReplaceRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RoleGrantItem'}}
    RoleGrantSummary:
      type: object
      required: [id, role_id, role, effective]
      properties:
        id: {type: string}
        role_id: {type: string}
        role: {$ref: '#/components/schemas/RoleSummary'}
        effective_from: {type: string, format: date-time, nullable: true}
        effective_to: {type: string, format: date-time, nullable: true}
        effective: {type: boolean}
    RoleSummary:
      type: object
      required: [id, code, name, status]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
    Role:
      type: object
      required: [id, code, name, builtin, status, permission_codes, affected_user_count, affected_service_account_count, created_at, updated_at]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        builtin: {type: boolean}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        permission_codes: {type: array, items: {type: string}}
        affected_user_count: {type: integer, minimum: 0}
        affected_service_account_count: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RoleWriteRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
    RoleListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/Role'}}
    PermissionDefinition:
      type: object
      required: [id, code, domain, resource, action, risk_level, status]
      properties:
        id: {type: string}
        code: {type: string}
        domain: {type: string}
        resource: {type: string}
        action: {type: string}
        name: {type: string}
        description: {type: string}
        risk_level: {type: string, enum: [NORMAL, SENSITIVE, DANGEROUS]}
        status: {type: string, enum: [ACTIVE, DEPRECATED]}
    PermissionListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/PermissionDefinition'}}
    PermissionReplaceRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [permission_code]
            additionalProperties: false
            properties:
              permission_code: {type: string}
    PermissionProjection:
      type: object
      required: [principal_type, principal_id, authorization_version, effective_roles, permission_codes, session_mode, allowed_actions]
      properties:
        principal_type: {type: string, enum: [USER, SERVICE_ACCOUNT]}
        principal_id: {type: string}
        actor_user_id: {type: string, nullable: true}
        authorization_version: {type: integer}
        effective_roles: {type: array, items: {$ref: '#/components/schemas/EffectiveRole'}}
        permission_codes: {type: array, items: {type: string}}
        session_mode: {type: string, enum: [NORMAL, FIRST_LOGIN_RESTRICTED]}
        allowed_actions: {type: array, items: {type: string}, description: 会话级动作白名单；正常会话为空数组表示仅受 permission_codes 约束。}
    RegistrationApplicationSummary:
      type: object
      required: [id, attempt_no, status, submitted_at]
      properties:
        id: {type: string}
        attempt_no: {type: integer, minimum: 1}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
        submitted_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time, nullable: true}
        decision_reason: {type: string, nullable: true}
    RegistrationApplication:
      type: object
      required: [id, user, attempt_no, status, submitted_at, created_at, updated_at]
      properties:
        id: {type: string}
        user: {$ref: '#/components/schemas/User'}
        attempt_no: {type: integer, minimum: 1}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
        submitted_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time, nullable: true}
        decided_by: {type: string, nullable: true}
        decision_reason: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RegistrationApplicationListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/RegistrationApplication'}}
    RegistrationRejectRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1}
    RegistrationDecisionResponse:
      type: object
      required: [application, user]
      properties:
        application: {$ref: '#/components/schemas/RegistrationApplication'}
        user: {$ref: '#/components/schemas/User'}
    Group:
      type: object
      required: [id, code, name, status, member_user_ids, role_ids, created_at, updated_at]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        member_user_ids: {type: array, items: {type: string}}
        role_ids: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    GroupWriteRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
    GroupListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/Group'}}
    GroupMembersReplaceRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
