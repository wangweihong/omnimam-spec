      x-error-codes: [ERR_IDENTITY_AUTHZ_CONTEXT_INVALID, ERR_IDENTITY_AUTHZ_DENIED, ERR_IDENTITY_PRINCIPAL_CONTEXT_INVALID]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PrincipalCheckRequest'}}}}
      responses:
        '200': {description: PrincipalContext 授权结果或业务错误。, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/PrincipalCheckResponse'}, {$ref: '#/components/schemas/ErrorResponse'}]}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page_num: {name: page_num, in: query, schema: {type: integer, minimum: 0, default: 0}}
    page_size: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    keyword: {name: keyword, in: query, schema: {type: string, default: ''}}
    sort_order: {name: sort_order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
    created_after: {name: created_after, in: query, schema: {type: string, format: date-time}}
    created_before: {name: created_before, in: query, schema: {type: string, format: date-time}}
    user_id: {name: user_id, in: path, required: true, schema: {type: string}}
    session_id: {name: session_id, in: path, required: true, schema: {type: string}}
    role_id: {name: role_id, in: path, required: true, schema: {type: string}}
    group_id: {name: group_id, in: path, required: true, schema: {type: string}}
    resource_type: {name: resource_type, in: path, required: true, schema: {type: string}}
    resource_id: {name: resource_id, in: path, required: true, schema: {type: string}}
    grant_id: {name: grant_id, in: path, required: true, schema: {type: string}}
    service_account_id: {name: service_account_id, in: path, required: true, schema: {type: string}}
  requestBodies:
    ActionReason:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionReasonRequest'
  responses:
    UnexpectedError:
      description: 未预期服务器异常。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UnexpectedErrorResponse'}
  schemas:
    ErrorResponse:
      type: object
      required: [code, value, message, messages]
      properties:
        code: {type: string}
        value: {type: integer}
        message: {type: string}
        messages: {type: object, additionalProperties: {type: string}}
        detail: {type: string, nullable: true}
        causes: {type: array, items: {type: object, additionalProperties: true}}
        data: {type: object, additionalProperties: true}
    UnexpectedErrorResponse:
      type: object
      required: [message]
      properties:
        message: {type: string}
    ActionResult:
      type: object
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
    RegisterRequest:
      type: object
      required: [username, email, password]
      additionalProperties: false
      properties:
        username: {type: string, minLength: 1}
        email: {type: string, format: email}
        password: {type: string, minLength: 1}
        display_name: {type: string}
    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login: {type: string}
        password: {type: string}
        client_id: {type: string, default: omnimam-web}
        device_info: {type: string}
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: {type: string}
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password, confirm_password]
      additionalProperties: false
      properties:
        old_password: {type: string}
        new_password: {type: string}
        confirm_password: {type: string}
    UserSelfUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string}
        alias: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
    AdminUserCreateRequest:
      type: object
      required: [username, email, display_name]
      additionalProperties: false
      properties:
        username: {type: string}
        email: {type: string, format: email}
        display_name: {type: string}
        initial_password: {type: string, nullable: true}
        status: {type: string, enum: [ACTIVE, PENDING], default: ACTIVE}
        role_ids: {type: array, items: {type: string}}
    UserAdminUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string}
        alias: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        status: {type: string, enum: [ACTIVE, PENDING, DISABLED, LOCKED]}
        role_ids: {type: array, items: {type: string}}
    User:
      type: object
      required: [id, username, display_name, status, first_login_required, security_version, authorization_version, created_at, updated_at]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        alias: {type: string}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        status: {type: string, enum: [ACTIVE, PENDING, DISABLED, LOCKED, DELETED]}
        first_login_required: {type: boolean}
        security_version: {type: integer}
        authorization_version: {type: integer}
        last_login_at: {type: string, format: date-time, nullable: true}
        online: {type: boolean, nullable: true, description: 当前用户或受权管理员可见的派生在线状态；普通资源共享目录返回 null。}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UserListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
    AuthResponse:
      type: object
      required: [user, access_token, refresh_token, token_type, expires_in, first_login_required]
      properties:
        user: {$ref: '#/components/schemas/User'}
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer}
        first_login_required: {type: boolean}
    Session:
      type: object
      required: [id, client_id, status, created_at, expires_at]
      properties:
        id: {type: string}
        client_id: {type: string}
        device_info: {type: string}
        ip_address: {type: string, nullable: true}
        user_agent: {type: string, nullable: true}
        status: {type: string, enum: [ACTIVE, REVOKED, EXPIRED]}
        last_active_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    SessionListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/Session'}}
    PresenceHeartbeatResponse:
      type: object
      required: [online, last_active_at]
      properties:
        online: {type: boolean, description: 当前会话更新后的派生在线状态。}
        last_active_at: {type: string, format: date-time}
    Role:
      type: object
      required: [id, code, name, builtin, status, permission_codes, created_at, updated_at]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        builtin: {type: boolean}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        permission_codes: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RoleWriteRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
    RoleListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/Role'}}
    PermissionDefinition:
      type: object
      required: [id, code, domain, resource, action, risk_level, status]
      properties:
        id: {type: string}
        code: {type: string}
        domain: {type: string}
        resource: {type: string}
        action: {type: string}
        name: {type: string}
        description: {type: string}
        risk_level: {type: string, enum: [NORMAL, SENSITIVE, DANGEROUS]}
        status: {type: string, enum: [ACTIVE, DEPRECATED]}
    PermissionListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/PermissionDefinition'}}
    PermissionReplaceRequest:
      type: object
      required: [permission_codes]
      additionalProperties: false
      properties:
        permission_codes: {type: array, items: {type: string}}
    PermissionProjection:
      type: object
      required: [principal_type, principal_id, authorization_version, permission_codes]
      properties:
        principal_type: {type: string, enum: [USER, SERVICE_ACCOUNT]}
        principal_id: {type: string}
        actor_user_id: {type: string, nullable: true}
        authorization_version: {type: integer}
        permission_codes: {type: array, items: {type: string}}
    Group:
      type: object
      required: [id, code, name, status, member_user_ids, role_ids, created_at, updated_at]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
