      x-error-codes: [ERR_IDENTITY_SERVICE_ACCOUNT_NOT_VISIBLE, ERR_IDENTITY_SERVICE_ACCOUNT_CREDENTIAL_ROTATION_FAILED, ERR_PLATFORM_AUDIT_WRITE_UNAVAILABLE]
      parameters: [{$ref: '#/components/parameters/service_account_id'}]
