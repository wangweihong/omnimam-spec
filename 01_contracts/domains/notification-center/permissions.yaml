notification.inbox.read:
  domain: notification-center
  module: inbox
  resource: notification, notification_recipient_counter
  action: read
  subject: authenticated_user
  description: 查询当前登录用户的通知列表、筛选结果和未读计数。
  frontend_usage: 控制顶部铃铛、通知下拉面板和通知中心页面。
  backend_enforcement: 强制 recipient_user_id=当前认证用户；禁止请求指定其他用户，不可见源资源只保留最小历史摘要并隐藏导航。
  related_rules: [BR-NOTIFY-001, BR-NOTIFY-012, BR-NOTIFY-013, BR-NOTIFY-022]
  related_user_stories: [US-NOTIFY-001, US-NOTIFY-004, US-NOTIFY-005]

notification.inbox.manage:
  domain: notification-center
  module: inbox
  resource: notification, notification_recipient_counter, notification_outbox
  action: read, unread, read_all, archive, unarchive
  subject: authenticated_user
  description: 修改当前登录用户通知的收件箱状态并维护未读计数。
  frontend_usage: 控制单条/批量已读、标记未读、全部已读、归档和取消归档入口。
  backend_enforcement: 每项先校验 recipient_user_id；状态、计数与 outbox 原子提交，批量单项失败相互隔离且不改变 attention_status。
  related_rules: [BR-NOTIFY-008, BR-NOTIFY-012, BR-NOTIFY-017, BR-NOTIFY-022]
  related_user_stories: [US-NOTIFY-002]

notification.preference.read:
  domain: notification-center
  module: preference
  resource: notification_preference, notification_topic
  action: read
  subject: authenticated_user
  description: 查询当前用户显式偏好、默认值、强制主题和渠道能力。
  frontend_usage: 控制通知设置页面的基础站内偏好和禁用态渠道说明。
  backend_enforcement: 强制 user_id=当前认证用户；主题目录只返回非敏感产品元数据，不返回规则表达式或内部源事件载荷。
  related_rules: [BR-NOTIFY-011, BR-NOTIFY-012, BR-NOTIFY-014, BR-NOTIFY-015, BR-NOTIFY-020]
  related_user_stories: [US-NOTIFY-003]

notification.preference.manage:
  domain: notification-center
  module: preference
  resource: notification_preference
  action: replace
  subject: authenticated_user
  description: 整体替换当前用户的基础站内通知偏好。
  frontend_usage: 保存分类或主题级站内开关、最低严重程度和重复合并设置。
  backend_enforcement: 强制 user_id=当前认证用户；整体校验 category/topic 唯一与归属，拒绝关闭 mandatory topic，拒绝写入未启用渠道字段。
  related_rules: [BR-NOTIFY-011, BR-NOTIFY-012, BR-NOTIFY-014, BR-NOTIFY-015, BR-NOTIFY-020]
  related_user_stories: [US-NOTIFY-003]

notification.admin.receive:
  domain: notification-center
  module: access
  resource: administrator_notification_scope
  action: receive
  subject: ADMIN, SUPER_ADMIN
  description: 成为已契约管理员级通知主题的候选接收者。
  frontend_usage: 不直接控制管理动作；决定管理员通知是否出现在当前用户收件箱。
  backend_enforcement: 同时校验内置角色和主题要求的通知权限；不得向普通用户扩散基础设施通知或敏感失败摘要。
  related_rules: [BR-NOTIFY-010, BR-NOTIFY-011, BR-NOTIFY-012, BR-NOTIFY-019]
  related_user_stories: [US-NOTIFY-006]

notification.ingestion.internal:
  domain: notification-center
  module: ingestion
  resource: notification_event, notification, notification_outbox
  action: consume, normalize, deduplicate, aggregate, resolve, publish
  subject: notification_worker_service
  description: 独立 Worker 消费已登记 source event 并可靠生成或更新通知。
  frontend_usage: 不向前端直接暴露。
  backend_enforcement: 仅服务身份可用；校验源域、事件类型、版本、接收者依据和安全快照，只接受更高聚合版本，不读跨域私有表。
  related_rules: [BR-NOTIFY-002, BR-NOTIFY-004, BR-NOTIFY-005, BR-NOTIFY-006, BR-NOTIFY-007, BR-NOTIFY-009, BR-NOTIFY-010, BR-NOTIFY-017, BR-NOTIFY-019, BR-NOTIFY-020, BR-NOTIFY-021]
  related_user_stories: [US-NOTIFY-006, US-NOTIFY-007]
