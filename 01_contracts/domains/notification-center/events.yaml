x-source-event-mappings:
  active:
    - source_event: task-center.atomic_task_status_changed
      notification_topics: [task.atomic_task.succeeded, task.atomic_task.failed, task.atomic_task.timed_out, task.atomic_task.action_required]
      notes: 仅 standalone AtomicTask 且满足预设价值规则的终态或需处理结果生成通知；Group/DAG 子任务及 ApplicationRun/CanvasRun 关联任务由上层业务域表达，普通成功默认不通知。
    - source_event: workflow-canvas.canvas_run_status_changed
      notification_topics: [canvas.run.succeeded, canvas.run.partially_succeeded, canvas.run.failed]
      notes: 只接受更高 CanvasRun aggregate_version；PARTIAL_SUCCESS 独立映射。
  contract_gap:
    - source_event: task-center.task_group_status_changed
      missing: notification-service 消费关系和 action_required 判定。
    - source_event: asset-library.asset_version_processing_changed
      missing: notification-service 消费关系和单项/批次映射。
    - source_event: asset-library.artifact_processing_changed
      missing: notification-service 消费关系。
    - source_event: asset-library.artifact_registration_changed
      missing: notification-service 消费关系。
    - source_event: application-platform.application_run_projection_changed
      missing: notification-service 消费关系和 initiator/owner 字段。
    - source_event: application-platform.engine_instance_health_changed
      missing: notification-service 消费关系、前态和管理员范围。
    - source_event: model-management.model_health_status_changed
      missing: notification-service 消费关系。
  future_topics:
    - asset.scan.completed
    - asset.scan.partially_failed
    - asset.scan.failed
    - asset.import.completed
    - asset.import.partially_failed
    - storage.backend.unavailable
    - storage.capacity.warning
    - application.engine_instance.credential_expiring
    - model.provider.credential_expiring
    - system.update.available
    - system.background_job.failed
    - agent.run.succeeded
    - agent.run.failed
    - agent.approval.requested

