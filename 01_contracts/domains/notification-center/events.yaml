notification_created:
  producer: notification-center.inbox
  consumers: [sse-event-projector]
  trigger_condition: 当前用户的 Notification 首次持久化，且 Notification 与 notification_outbox 已在同一事务提交。
  payload:
    notification_id: string
    recipient_user_id: string
    notification_topic: string
    category: string
    severity: string
    inbox_status: string(unread)
    attention_status: string(informational|action_required|resolved)
    source_type: string
    source_id: string
    navigation_available: boolean
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: notification_id:resource_version:created
  retry_policy: 由 notification_outbox 持续重试；SSE projector 按 source event 和 notification resource_version 幂等。
  failure_policy: Notification 是收件箱事实；发布失败不回滚通知，客户端可通过列表和未读数查询恢复。
  related_rules: [BR-NOTIFY-001, BR-NOTIFY-005, BR-NOTIFY-013, BR-NOTIFY-016, BR-NOTIFY-017, BR-NOTIFY-019]
  related_user_stories: [US-NOTIFY-001, US-NOTIFY-004, US-NOTIFY-005, US-NOTIFY-007]

notification_updated:
  producer: notification-center.inbox
  consumers: [sse-event-projector]
  trigger_condition: Notification 的内容、严重程度、聚合计数、收件箱状态、处理状态、导航或保留事实发生单调更新。
  payload:
    notification_id: string
    recipient_user_id: string
    notification_topic: string
    category: string
    severity: string
    inbox_status: string(unread|read|archived)
    attention_status: string(informational|action_required|resolved)
    occurrence_count: integer
    navigation_available: boolean
    changed_fields: array<string>
    resource_version: integer
    occurred_at: string(date-time)
  idempotency_key: notification_id:resource_version:updated
  retry_policy: 由 notification_outbox 持续重试；消费者丢弃相同或更低 resource_version。
  failure_policy: Notification 数据库事实不回滚；SSE 失败时客户端通过 REST 重同步，不从 UserEvent 覆盖更高版本通知。
  related_rules: [BR-NOTIFY-006, BR-NOTIFY-007, BR-NOTIFY-008, BR-NOTIFY-009, BR-NOTIFY-013, BR-NOTIFY-016, BR-NOTIFY-017]
  related_user_stories: [US-NOTIFY-001, US-NOTIFY-002, US-NOTIFY-004, US-NOTIFY-005, US-NOTIFY-006, US-NOTIFY-007]

notification_deleted:
  producer: notification-center.retention
  consumers: [sse-event-projector]
  trigger_condition: Notification 按保留策略完成逻辑删除或物理清理，且当前用户客户端需要移除本地投影。
  payload:
    notification_id: string
    recipient_user_id: string
    resource_version: integer
    deleted_at: string(date-time)
    occurred_at: string(date-time)
  idempotency_key: notification_id:resource_version:deleted
  retry_policy: 由 notification_outbox 持续重试；重复删除事件幂等。
  failure_policy: 清理不影响源业务事实；SSE 丢失时列表重同步会移除已清理通知。
  related_rules: [BR-NOTIFY-016, BR-NOTIFY-017, BR-NOTIFY-018]
  related_user_stories: [US-NOTIFY-004, US-NOTIFY-007]

notification_unread_count_changed:
  producer: notification-center.counter
  consumers: [sse-event-projector]
  trigger_condition: 当前用户的 unread、critical unread 或 unresolved action_required 计数发生变化，并与计数投影和 outbox 原子提交。
  payload:
    recipient_user_id: string
    unread_count: integer
    critical_count: integer
    action_required_count: integer
    counter_version: integer
    occurred_at: string(date-time)
  idempotency_key: recipient_user_id:counter_version:unread_count_changed
  retry_policy: 由 notification_outbox 持续重试；SSE projector 按 recipient_user_id 和 counter_version 幂等。
  failure_policy: notification_recipient_counters 是计数投影事实；发布失败不回滚收件箱操作，客户端可重查未读数。
  related_rules: [BR-NOTIFY-008, BR-NOTIFY-012, BR-NOTIFY-016, BR-NOTIFY-017]
  related_user_stories: [US-NOTIFY-001, US-NOTIFY-002, US-NOTIFY-004]
