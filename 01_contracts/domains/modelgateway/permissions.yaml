"model_gateway.provider_type.read":
  module: modelgateway
  resource: provider_type
  action: read
  description: 读取稳定 ProviderType 公共目录。
  frontend_usage: Provider 账号创建与筛选。
  backend_enforcement: 删除 Adapter、Executor 与内部实现字段后返回。
  related_rules: [BR-MGW-003]
  related_user_stories: [US-MGW-007]

"model_gateway.provider_capability.read":
  module: modelgateway
  resource: provider_capability
  action: read
  description: 读取 ProviderCapability 公共目录与脱敏详情。
  frontend_usage: 能力浏览、Operation/Variant 选择与目标策略配置。
  backend_enforcement: 列表只返回公共摘要；详情只增加脱敏后的 models、operations、variants 与参数 schema。
  related_rules: [BR-MGW-004]
  related_user_stories: [US-MGW-007]

"model_gateway.provider_capability.read_diagnostics":
  module: modelgateway
  resource: provider_capability
  action: read_diagnostics
  description: 读取文件级能力加载诊断。
  frontend_usage: 平台管理诊断页。
  backend_enforcement: 仅平台诊断主体；来源路径按安全策略裁剪。
  related_rules: [BR-MGW-004]
  related_user_stories: [US-MGW-007]

"model_gateway.provider_account.read_own":
  module: modelgateway
  resource: provider_account
  action: read_own
  description: 读取当前用户自己的 USER ProviderAccount 与资源。
  frontend_usage: 个人 Provider 管理。
  backend_enforcement: 强制 scope=USER 且 owner_user_id=current_user。
  related_rules: [BR-MGW-001]
  related_user_stories: [US-MGW-001]

"model_gateway.provider_account.manage_own":
  module: modelgateway
  resource: provider_account
  action: manage_own
  description: 创建、修改和删除当前用户 USER ProviderAccount。
  frontend_usage: 个人 Provider 管理。
  backend_enforcement: 服务端强制 owner；拒绝 PLATFORM 写入。
  related_rules: [BR-MGW-001]
  related_user_stories: [US-MGW-001]

"model_gateway.provider_account.test_own":
  module: modelgateway
  resource: provider_account
  action: test_own
  description: 测试未保存或已保存的本人 USER Provider 账号与资源。
  frontend_usage: 连接和资源测试。
  backend_enforcement: 强制 owner、ProviderType 和网络策略。
  related_rules: [BR-MGW-018]
  related_user_stories: [US-MGW-004]

"model_gateway.provider_account.read_platform":
  module: modelgateway
  resource: provider_account
  action: read_platform
  description: 读取 PLATFORM ProviderAccount 非敏感投影。
  frontend_usage: 平台 Provider 管理与应用目标选择。
  backend_enforcement: 不返回 credential_ref 解析值或私有配置。
  related_rules: [BR-MGW-001, BR-MGW-014]
  related_user_stories: [US-MGW-001]

"model_gateway.provider_account.manage_platform":
  module: modelgateway
  resource: provider_account
  action: manage_platform
  description: 管理和测试 PLATFORM ProviderAccount 与资源。
  frontend_usage: 平台 Provider 管理。
  backend_enforcement: 仅平台管理员；owner_user_id 必须为空。
  related_rules: [BR-MGW-001]
  related_user_stories: [US-MGW-001, US-MGW-004]

"model_gateway.provider_resource.manage_own":
  module: modelgateway
  resource: provider_resource
  action: manage_own
  description: 管理、同步和测试本人 USER 账号资源。
  frontend_usage: 用户模型与 Workflow 资源管理。
  backend_enforcement: 校验父账号 owner 和 ProviderType 支持范围。
  related_rules: [BR-MGW-005]
  related_user_stories: [US-MGW-002]

"model_gateway.provider_binding.manage_platform":
  module: modelgateway
  resource: provider_account_capability_binding
  action: manage_platform
  description: 管理 PLATFORM 账号能力绑定。
  frontend_usage: 平台能力收窄与路由配置。
  backend_enforcement: 只允许收窄当前 ProviderCapability。
  related_rules: [BR-MGW-006]
  related_user_stories: [US-MGW-003]

"model_gateway.network_policy.read":
  module: modelgateway
  resource: provider_network_policy
  action: read
  description: 读取当前 Provider 网络策略及高危提示。
  frontend_usage: 网络安全配置页。
  backend_enforcement: 不返回运行时 DNS 缓存或内部审计明细。
  related_rules: [BR-MGW-016, BR-MGW-017]
  related_user_stories: [US-MGW-006]

"model_gateway.network_policy.manage":
  module: modelgateway
  resource: provider_network_policy
  action: manage
  description: 修改 Provider 出站网络策略。
  frontend_usage: 网络安全配置页。
  backend_enforcement: 仅平台管理员并记录审计事件。
  related_rules: [BR-MGW-016, BR-MGW-017]
  related_user_stories: [US-MGW-006]
