schema_version: "2.0"
description: >-
  Model Gateway 只读 Runtime Registry 契约。登记 CapabilityDefinition、ProviderType、
  Adapter 与 OperationExecutor；不包含 ProviderAccount、凭证或运行时配置。
x-s1-refs:
  user_stories: [US-MGW-003, US-MGW-007]
  business_rules: [BR-MGW-003, BR-MGW-004, BR-MGW-012, BR-MGW-015, BR-MGW-019]

capability_definitions:
  - {id: video.text_to_video, name_i18n: {zh-CN: 文生视频, en-US: Text to Video}, input_media_types: [text], output_media_types: [video]}
  - {id: video.image_to_video, name_i18n: {zh-CN: 图生视频, en-US: Image to Video}, input_media_types: [text, image], output_media_types: [video]}
  - {id: video.video_edit, name_i18n: {zh-CN: 视频编辑, en-US: Video Editing}, input_media_types: [text, image, video, audio], output_media_types: [video]}
  - {id: image.text_to_image, name_i18n: {zh-CN: 文生图, en-US: Text to Image}, input_media_types: [text], output_media_types: [image]}
  - {id: image.edit, name_i18n: {zh-CN: 图像编辑, en-US: Image Editing}, input_media_types: [text, image], output_media_types: [image]}
  - {id: image.upscale, name_i18n: {zh-CN: 图像放大, en-US: Image Upscaling}, input_media_types: [image], output_media_types: [image]}
  - {id: text.chat_completion, name_i18n: {zh-CN: 对话补全, en-US: Chat Completion}, input_media_types: [text, json], output_media_types: [text, json]}
  - {id: text.translate, name_i18n: {zh-CN: 文本翻译, en-US: Text Translation}, input_media_types: [text, json], output_media_types: [text, json]}
  - {id: image.understanding, name_i18n: {zh-CN: 图片理解, en-US: Image Understanding}, input_media_types: [text, image, json], output_media_types: [text, json]}

adapters:
  - id: comfyui
    responsibilities: [authentication, endpoint, object_info, health_check, upload, submit, poll, cancel, download, common_error_mapping]
  - id: runninghub
    responsibilities: [authentication, endpoint, resource_discovery, health_check, upload, submit, poll, cancel, download, common_error_mapping]
  - id: byteplus_modelark
    responsibilities: [authentication, endpoint, resource_discovery, health_check, upload, submit, poll, cancel, download, common_error_mapping]
  - id: deepseek_official
    responsibilities: [authentication, endpoint, resource_discovery, resource_probe, health_check, submit, cancel, common_error_mapping]
  - id: openai_compatible
    responsibilities: [authentication, endpoint, resource_discovery, resource_probe, health_check, submit, cancel, common_error_mapping]

operation_executors:
  - {id: comfyui_workflow, adapter_id: comfyui, capability_definition_ids: [video.text_to_video, video.image_to_video, video.video_edit, image.text_to_image, image.edit, image.upscale]}
  - {id: runninghub_workflow, adapter_id: runninghub, capability_definition_ids: [video.text_to_video, video.image_to_video, video.video_edit, image.text_to_image, image.edit, image.upscale]}
  - {id: byteplus_text_to_video, adapter_id: byteplus_modelark, capability_definition_ids: [video.text_to_video]}
  - {id: byteplus_image_to_video, adapter_id: byteplus_modelark, capability_definition_ids: [video.image_to_video]}
  - {id: byteplus_reference_to_video, adapter_id: byteplus_modelark, capability_definition_ids: [video.video_edit]}
  - {id: deepseek_chat_completions, adapter_id: deepseek_official, capability_definition_ids: [text.chat_completion]}
  - {id: openai_chat_completions, adapter_id: openai_compatible, capability_definition_ids: [text.chat_completion, text.translate, image.understanding]}

provider_types:
  - id: comfyui
    display_name_i18n: {zh-CN: ComfyUI, en-US: ComfyUI}
    supported_account_scopes: [USER, PLATFORM]
    supported_resource_kinds: []
    endpoint_policy: required_custom
    authentication_types: [none, api_key, bearer_token]
    authentication_schema:
      none: {type: object, maxProperties: 0}
      api_key: {type: object, additionalProperties: false, required: [credential_ref], properties: {credential_ref: {type: string}}}
      bearer_token: {type: object, additionalProperties: false, required: [credential_ref], properties: {credential_ref: {type: string}}}
    supports_resource_discovery: false
    supports_manual_resources: false
    supports_account_probe: true
    supports_resource_probe: false
    supports_object_info: true
    adapter_id: comfyui
    operation_executors:
      video.text_to_video: comfyui_workflow
      video.image_to_video: comfyui_workflow
      video.video_edit: comfyui_workflow
      image.text_to_image: comfyui_workflow
      image.edit: comfyui_workflow
      image.upscale: comfyui_workflow

  - id: runninghub
    display_name_i18n: {zh-CN: RunningHub, en-US: RunningHub}
    supported_account_scopes: [USER, PLATFORM]
    supported_resource_kinds: [WORKFLOW]
    endpoint_policy: fixed
    authentication_types: [api_key]
    authentication_schema:
      api_key: {type: object, additionalProperties: false, required: [credential_ref], properties: {credential_ref: {type: string}}}
    supports_resource_discovery: true
    supports_manual_resources: true
    supports_account_probe: true
    supports_resource_probe: true
    supports_object_info: false
    adapter_id: runninghub
    operation_executors:
      video.text_to_video: runninghub_workflow
      video.image_to_video: runninghub_workflow
      video.video_edit: runninghub_workflow
      image.text_to_image: runninghub_workflow
      image.edit: runninghub_workflow
      image.upscale: runninghub_workflow

  - id: openai_compatible
    display_name_i18n: {zh-CN: OpenAI Compatible, en-US: OpenAI Compatible}
    supported_account_scopes: [USER, PLATFORM]
    supported_resource_kinds: [MODEL, DEPLOYMENT]
    endpoint_policy: required_custom
    authentication_types: [none, api_key, bearer_token]
    authentication_schema:
      none: {type: object, maxProperties: 0}
      api_key: {type: object, additionalProperties: false, required: [credential_ref], properties: {credential_ref: {type: string}}}
      bearer_token: {type: object, additionalProperties: false, required: [credential_ref], properties: {credential_ref: {type: string}}}
    supports_resource_discovery: true
    supports_manual_resources: true
    supports_account_probe: true
    supports_resource_probe: true
    supports_object_info: false
    adapter_id: openai_compatible
    operation_executors:
      text.chat_completion: openai_chat_completions
      text.translate: openai_chat_completions
      image.understanding: openai_chat_completions

  - id: deepseek_official
    display_name_i18n: {zh-CN: DeepSeek 官方 API, en-US: DeepSeek Official API}
    supported_account_scopes: [USER, PLATFORM]
    supported_resource_kinds: [MODEL]
    endpoint_policy: fixed
    authentication_types: [api_key]
    authentication_schema:
      api_key: {type: object, additionalProperties: false, required: [credential_ref], properties: {credential_ref: {type: string}}}
    supports_resource_discovery: true
    supports_manual_resources: true
    supports_account_probe: true
    supports_resource_probe: true
    supports_object_info: false
    adapter_id: deepseek_official
    operation_executors:
      text.chat_completion: deepseek_chat_completions

  - id: byteplus_modelark
    display_name_i18n: {zh-CN: BytePlus ModelArk, en-US: BytePlus ModelArk}
    supported_account_scopes: [USER, PLATFORM]
    supported_resource_kinds: [MODEL, DEPLOYMENT]
    endpoint_policy: fixed
    authentication_types: [api_key, ak_sk]
    authentication_schema:
      api_key: {type: object, additionalProperties: false, required: [credential_ref], properties: {credential_ref: {type: string}}}
      ak_sk: {type: object, additionalProperties: false, required: [credential_ref], properties: {credential_ref: {type: string}}}
    supports_resource_discovery: true
    supports_manual_resources: true
    supports_account_probe: true
    supports_resource_probe: true
    supports_object_info: false
    adapter_id: byteplus_modelark
    operation_executors:
      video.text_to_video: byteplus_text_to_video
      video.image_to_video: byteplus_image_to_video
      video.video_edit: byteplus_reference_to_video

# adapter_id 与 operation_executors 仅供 Gateway 内部解析，ProviderType 公共投影必须删除这些字段。
