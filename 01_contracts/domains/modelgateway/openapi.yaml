openapi: 3.0.3
info:
  title: OmniMAM Model Gateway API
  version: 1.7.0
  description: >-
    ApplicationEngineType、目录加载 ProviderCapability、EngineInstance、Binding、
    EngineAdapter、OperationExecutor、健康检测与 ComfyUI object_info 的 S2 契约。
    ProviderCapability 为只读注册表资源，不提供写入或重新加载 API。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: provider-capabilities
  - name: application-engine-types
  - name: engine-instances
  - name: engine-capability-bindings

paths:
  /api/v1/provider-capabilities:
    get:
      tags: [provider-capabilities]
      operationId: list_provider_capabilities
      summary: 查询只读 ProviderCapability 目录
      description: 返回可解析能力及其运行态状态，不返回来源文件路径和完整失败详情。
      x-permission: aiapp.provider_capability.read
      x-s1-refs:
        user_stories: [US-AIAPP-039, US-AIAPP-040]
        business_rules: [BR-AIAPP-130, BR-AIAPP-135, BR-AIAPP-136, BR-AIAPP-139, BR-AIAPP-188]
      parameters:
        - $ref: '#/components/parameters/page_num'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/keyword'
        - $ref: '#/components/parameters/search_fields'
        - $ref: '#/components/parameters/sort_field'
        - $ref: '#/components/parameters/sort_order'
        - name: application_engine_type_id
          in: query
          schema: {type: string}
        - name: availability
          in: query
          schema: {$ref: '#/components/schemas/ProviderCapabilityAvailability'}
      responses:
        '200':
          description: 查询完成。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderCapabilityListResponse'}

  /api/v1/provider-capabilities/{provider_capability_id}:
    get:
      tags: [provider-capabilities]
      operationId: get_provider_capability
      summary: 查询 ProviderCapability 详情
      x-permission: aiapp.provider_capability.read
      x-s1-refs:
        user_stories: [US-AIAPP-039, US-AIAPP-040]
        business_rules: [BR-AIAPP-130, BR-AIAPP-135, BR-AIAPP-136, BR-AIAPP-188]
      parameters:
        - $ref: '#/components/parameters/provider_capability_id'
      responses:
        '200':
          description: 返回能力详情或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProviderCapability'
                  - $ref: '#/components/schemas/ErrorResponse'

  /api/v1/provider-capability-load-results:
    get:
      tags: [provider-capabilities]
      operationId: list_provider_capability_load_results
      summary: 查询启动加载诊断
      description: 仅管理员可读取目录与文件路径、稳定错误码和完整失败详情。
      x-permission: aiapp.provider_capability.read_diagnostics
      x-s1-refs:
        user_stories: [US-AIAPP-040]
        business_rules: [BR-AIAPP-131, BR-AIAPP-132, BR-AIAPP-133, BR-AIAPP-134, BR-AIAPP-139, BR-AIAPP-188]
      parameters:
        - $ref: '#/components/parameters/page_num'
        - $ref: '#/components/parameters/page_size'
        - name: result
          in: query
          schema: {type: string, enum: [loaded, disabled, failed]}
      responses:
        '200':
          description: 查询完成。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderCapabilityLoadResultListResponse'}

  /api/v1/application-engine-types:
    get:
      tags: [application-engine-types]
      operationId: list_application_engine_types
      summary: 查询系统内置 ApplicationEngineType
      x-permission: aiapp.provider_capability.read
      x-s1-refs:
        user_stories: [US-AIAPP-039, US-AIAPP-041]
        business_rules: [BR-AIAPP-135, BR-AIAPP-140, BR-AIAPP-151, BR-AIAPP-193]
      parameters:
        - $ref: '#/components/parameters/page_num'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/keyword'
      responses:
        '200':
          description: 查询完成。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationEngineTypeListResponse'}

  /api/v1/engine-instances:
    get:
      tags: [engine-instances]
      operationId: list_engine_instances
      summary: 查询 ApplicationEngineInstance
      x-permission: aiapp.engine_instance.read
      x-s1-refs:
        user_stories: [US-AIAPP-041, US-AIAPP-044, US-AIAPP-045]
        business_rules: [BR-AIAPP-140, BR-AIAPP-162]
      parameters:
        - $ref: '#/components/parameters/page_num'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/keyword'
        - $ref: '#/components/parameters/sort_field'
        - $ref: '#/components/parameters/sort_order'
        - name: application_engine_type_id
          in: query
          schema: {type: string}
        - name: health_status
          in: query
          schema: {$ref: '#/components/schemas/EngineHealthStatus'}
      responses:
        '200':
          description: 查询完成。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EngineInstanceListResponse'}
    post:
      tags: [engine-instances]
      operationId: create_engine_instance
      summary: 创建 ApplicationEngineInstance
      x-permission: aiapp.engine_instance.manage
      x-s1-refs:
        user_stories: [US-AIAPP-041]
        business_rules: [BR-AIAPP-140, BR-AIAPP-189]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EngineInstanceCreateRequest'}
      responses:
        '200':
          description: 创建结果或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EngineInstance'
                  - $ref: '#/components/schemas/ErrorResponse'

  /api/v1/engine-instances/{engine_instance_id}:
    get:
      tags: [engine-instances]
      operationId: get_engine_instance
      summary: 查询 ApplicationEngineInstance
      x-permission: aiapp.engine_instance.manage
      x-s1-refs:
        user_stories: [US-AIAPP-041]
        business_rules: [BR-AIAPP-140]
      parameters: [{$ref: '#/components/parameters/engine_instance_id'}]
      responses:
        '200':
          description: 查询结果或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EngineInstance'
                  - $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [engine-instances]
      operationId: update_engine_instance
      summary: 更新 ApplicationEngineInstance
      x-permission: aiapp.engine_instance.manage
      x-s1-refs:
        user_stories: [US-AIAPP-041]
        business_rules: [BR-AIAPP-140]
      parameters: [{$ref: '#/components/parameters/engine_instance_id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EngineInstanceUpdateRequest'}
      responses:
        '200':
          description: 更新结果或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EngineInstance'
                  - $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [engine-instances]
      operationId: delete_engine_instance
      summary: 删除未被历史运行引用的 EngineInstance
      x-permission: aiapp.engine_instance.manage
      x-s1-refs:
        user_stories: [US-AIAPP-041]
        business_rules: [BR-AIAPP-140, BR-AIAPP-143]
      parameters: [{$ref: '#/components/parameters/engine_instance_id'}]
      responses:
        '200':
          description: 删除结果或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DeleteResult'
                  - $ref: '#/components/schemas/ErrorResponse'

  /api/v1/engine-instances/{engine_instance_id}/health-check:
    post:
      tags: [engine-instances]
      operationId: check_engine_instance_health
      summary: 执行并保存实例健康检测
      x-permission: aiapp.engine_instance.manage
      x-s1-refs:
        user_stories: [US-AIAPP-041]
        business_rules: [BR-AIAPP-140]
      parameters: [{$ref: '#/components/parameters/engine_instance_id'}]
      responses:
        '200':
          description: 健康检测结果或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EngineHealthCheckResult'
                  - $ref: '#/components/schemas/ErrorResponse'

  /api/v1/engine-instances/{engine_instance_id}/object-info:
    get:
      tags: [engine-instances]
      operationId: get_engine_instance_object_info
      summary: 查询 ComfyUI EngineInstance 当前 object_info
      description: >-
        返回实例唯一当前目录。目录超过 48 小时时仍可只读返回并标记 stale；
        响应支持基于 Accept-Encoding 的 gzip 内容压缩，不得包含 Engine 凭证。
      x-permission: aiapp.engine_instance.read
      x-s1-refs:
        user_stories: [US-AIAPP-049]
        business_rules: [BR-AIAPP-169, BR-AIAPP-175, BR-AIAPP-187]
      parameters: [{$ref: '#/components/parameters/engine_instance_id'}]
      responses:
        '200':
          description: 当前目录或业务错误。
          headers:
            Vary:
              schema: {type: string, example: Accept-Encoding}
              description: 压缩协商缓存键。
            Content-Encoding:
              schema: {type: string, enum: [gzip]}
              description: 客户端接受 gzip 且响应经过压缩时返回。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ComfyUIEngineObjectInfo'
                  - $ref: '#/components/schemas/ErrorResponse'

  /api/v1/engine-instances/{engine_instance_id}/object-info/refresh:
    post:
      tags: [engine-instances]
      operationId: refresh_engine_instance_object_info
      summary: 手动刷新 ComfyUI EngineInstance 当前 object_info
      description: >-
        仅 enabled、online 的 ComfyUI 实例可刷新；成功完整校验后原子替换当前目录，
        失败保留最后一次成功目录且不创建目录历史。
      x-permission: aiapp.engine_instance.manage
      x-s1-refs:
        user_stories: [US-AIAPP-049]
        business_rules: [BR-AIAPP-169, BR-AIAPP-170, BR-AIAPP-187]
      parameters: [{$ref: '#/components/parameters/engine_instance_id'}]
      responses:
        '200':
          description: 刷新后的目录状态或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ComfyUIEngineObjectInfoStatus'
                  - $ref: '#/components/schemas/ErrorResponse'

  /api/v1/engine-capability-bindings:
    get:
      tags: [engine-capability-bindings]
      operationId: list_engine_capability_bindings
      summary: 查询 EngineCapabilityBinding
      x-permission: aiapp.engine_binding.manage
      x-s1-refs:
        user_stories: [US-AIAPP-040, US-AIAPP-041]
        business_rules: [BR-AIAPP-135, BR-AIAPP-137, BR-AIAPP-141, BR-AIAPP-188, BR-AIAPP-189]
      parameters:
        - $ref: '#/components/parameters/page_num'
        - $ref: '#/components/parameters/page_size'
        - name: engine_instance_id
          in: query
          schema: {type: string}
        - name: provider_capability_id
          in: query
          schema: {type: string}
      responses:
        '200':
          description: 查询完成。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EngineCapabilityBindingListResponse'}
    post:
      tags: [engine-capability-bindings]
      operationId: create_engine_capability_binding
      summary: 创建 EngineCapabilityBinding
      x-permission: aiapp.engine_binding.manage
      x-s1-refs:
        user_stories: [US-AIAPP-041]
        business_rules: [BR-AIAPP-135, BR-AIAPP-137, BR-AIAPP-141, BR-AIAPP-189]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EngineCapabilityBindingCreateRequest'}
      responses:
        '200':
          description: 创建结果或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EngineCapabilityBinding'
                  - $ref: '#/components/schemas/ErrorResponse'

  /api/v1/engine-capability-bindings/{binding_id}:
    patch:
      tags: [engine-capability-bindings]
      operationId: update_engine_capability_binding
      summary: 更新绑定的启用状态或收紧限制
      x-permission: aiapp.engine_binding.manage
      x-s1-refs:
        user_stories: [US-AIAPP-041]
        business_rules: [BR-AIAPP-137, BR-AIAPP-141, BR-AIAPP-189]
      parameters: [{$ref: '#/components/parameters/binding_id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EngineCapabilityBindingUpdateRequest'}
      responses:
        '200':
          description: 更新结果或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EngineCapabilityBinding'
                  - $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [engine-capability-bindings]
      operationId: delete_engine_capability_binding
      summary: 删除 EngineCapabilityBinding
      x-permission: aiapp.engine_binding.manage
      x-s1-refs:
        user_stories: [US-AIAPP-041]
        business_rules: [BR-AIAPP-137, BR-AIAPP-141, BR-AIAPP-189]
      parameters: [{$ref: '#/components/parameters/binding_id'}]
      responses:
        '200':
          description: 删除结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteResult'}


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page_num:
      name: page_num
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    page_size:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 20}
    keyword:
      name: keyword
      in: query
      schema: {type: string, default: ''}
    search_fields:
      name: search_fields
      in: query
      schema: {type: string, default: "name,description"}
    sort_field:
      name: sort_field
      in: query
      schema: {type: string, default: name}
    sort_order:
      name: sort_order
      in: query
      schema: {type: string, enum: [asc, desc], default: asc}
    created_after:
      name: created_after
      in: query
      schema: {type: string, format: date-time}
    created_before:
      name: created_before
      in: query
      schema: {type: string, format: date-time}
    provider_capability_id:
      name: provider_capability_id
      in: path
      required: true
      schema: {type: string}
    engine_instance_id:
      name: engine_instance_id
      in: path
      required: true
      schema: {type: string}
    binding_id:
      name: binding_id
      in: path
      required: true
      schema: {type: string}

  schemas:
    ProviderCapabilityAvailability:
      type: string
      enum: [available, disabled, unavailable]
    RegistryStatus:
      type: string
      enum: [ready, degraded]
    Lifecycle:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [active, preview, deprecated, retired]}
        available_since: {type: string, format: date}
        deprecated_at: {type: string, format: date}
        retired_at: {type: string, format: date}
        replacement_model_id: {type: string}
    ProviderModel:
      type: object
      required: [id, provider_model_id, display_name, family, variant, lifecycle]
      properties:
        id: {type: string}
        provider_model_id: {type: string}
        display_name: {type: string}
        family: {type: string}
        variant: {type: string}
        lifecycle: {$ref: '#/components/schemas/Lifecycle'}
        context_window_tokens: {type: integer}
        maximum_output_tokens: {type: integer}
        limits: {type: object, additionalProperties: true}
    ProviderOperation:
      type: object
      required: [id, capability_definition_id, execution_mode, input_media_types, output_media_types]
      properties:
        id: {type: string}
        capability_definition_id: {type: string}
        execution_mode: {type: string, enum: [synchronous, asynchronous]}
        input_media_types: {type: array, items: {type: string}}
        output_media_types: {type: array, items: {type: string}}
        description: {type: string}
    CapabilityVariant:
      type: object
      required: [id, model_id, operation_id, lifecycle, input_schema, output_schema]
      properties:
        id: {type: string}
        model_id: {type: string}
        operation_id: {type: string}
        lifecycle: {$ref: '#/components/schemas/Lifecycle'}
        input_schema: {type: object, additionalProperties: true}
        output_schema: {type: object, additionalProperties: true}
        unsupported_parameters: {type: array, items: {type: string}}
        notes: {type: array, items: {type: string}}
    ProviderCapability:
      type: object
      required: [schema_version, id, name, kind, origin, binding_policy, application_engine_type_id, revision, enabled, provider, sources, models, operations, variants, availability, loaded_at]
      properties:
        schema_version: {type: string}
        id: {type: string}
        name: {type: string}
        description: {type: string}
        kind:
          type: string
          enum: [catalog, engine_binding]
          description: catalog 提供模型/Operation/Variant 目录；engine_binding 只表示引擎基础运行时身份。
        origin:
          type: string
          enum: [builtin, directory]
          readOnly: true
          description: 由加载器派生；外部清单不能声明 builtin。
        binding_policy:
          type: string
          enum: [manual, required_immutable]
          description: manual 由管理员维护绑定；required_immutable 由系统为匹配 EngineType 的实例维护且不可修改。
        application_engine_type_id: {type: string}
        revision: {type: string}
        enabled: {type: boolean}
        provider: {type: object, additionalProperties: true}
        sources: {type: array, items: {type: object, additionalProperties: true}}
        models: {type: array, items: {$ref: '#/components/schemas/ProviderModel'}}
        operations: {type: array, items: {$ref: '#/components/schemas/ProviderOperation'}}
        variants: {type: array, items: {$ref: '#/components/schemas/CapabilityVariant'}}
        labels: {type: object, additionalProperties: {type: string}}
        notes: {type: array, items: {type: string}}
        extensions: {type: object, additionalProperties: true}
        availability: {$ref: '#/components/schemas/ProviderCapabilityAvailability'}
        unavailable_code: {type: string}
        unavailable_summary: {type: string}
        loaded_at: {type: string, format: date-time}
    ProviderCapabilityListResponse:
      type: object
      required: [total, registry_status, items]
      properties:
        total: {type: integer}
        registry_status: {$ref: '#/components/schemas/RegistryStatus'}
        items: {type: array, items: {$ref: '#/components/schemas/ProviderCapability'}}
    ProviderCapabilityLoadResult:
      type: object
      required: [source_file, result, loaded_at]
      properties:
        provider_capability_id: {type: string, nullable: true}
        source_file:
          type: string
          description: 目录文件路径或内置清单的 embedded:// 虚拟路径。
        result: {type: string, enum: [loaded, disabled, failed]}
        error_code: {type: string}
        error_value: {type: integer}
        failure_detail: {type: string}
        loaded_at: {type: string, format: date-time}
    ProviderCapabilityLoadResultListResponse:
      type: object
      required: [total, registry_status, items]
      properties:
        total: {type: integer}
        registry_status: {$ref: '#/components/schemas/RegistryStatus'}
        items: {type: array, items: {$ref: '#/components/schemas/ProviderCapabilityLoadResult'}}
    LocalizedCapabilityDefinitionNames:
      type: object
      additionalProperties: false
      required: [zh-CN, en-US]
      description: 两组名称均按所属 ApplicationEngineType 的 operation_executors key 字典序排列。
      properties:
        zh-CN: {type: array, items: {type: string}}
        en-US: {type: array, items: {type: string}}
    ApplicationEngineType:
      type: object
      required: [id, name, enabled, engine_adapter_id, operation_executors, capability_definitions]
      properties:
        id: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        engine_adapter_id: {type: string}
        operation_executors:
          type: object
          description: key 是下拉选项提交的 CapabilityDefinition ID，value 是只读 OperationExecutor ID。
          additionalProperties: {type: string}
        capability_definitions: {$ref: '#/components/schemas/LocalizedCapabilityDefinitionNames'}
        authentication_types: {type: array, items: {type: string, enum: [none, api_key, bearer_token, ak_sk]}}
    ApplicationEngineTypeListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/ApplicationEngineType'}}
    EngineHealthStatus:
      type: string
      enum: [unknown, online, offline, degraded]
    ApiKeyAuthConfig:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: {type: string, minLength: 1}
    BearerTokenAuthConfig:
      type: object
      additionalProperties: false
      required: [bearer_token]
      properties:
        bearer_token: {type: string, minLength: 1}
    AkSkAuthConfig:
      type: object
      additionalProperties: false
      required: [access_key, secret_key]
      properties:
        access_key: {type: string, minLength: 1}
        secret_key: {type: string, minLength: 1}
    EngineInstance:
      type: object
      required: [id, name, application_engine_type_id, base_url, auth_type, enabled, health_status, created_at, updated_at, resource_version]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        application_engine_type_id: {type: string}
        base_url: {type: string, format: uri}
        auth_type: {type: string, enum: [none, api_key, bearer_token, ak_sk]}
        auth_config:
          description: 仅有管理权限的详情接口可返回；返回时必须与 auth_type 匹配。
          oneOf:
            - $ref: '#/components/schemas/ApiKeyAuthConfig'
            - $ref: '#/components/schemas/BearerTokenAuthConfig'
            - $ref: '#/components/schemas/AkSkAuthConfig'
        enabled: {type: boolean}
        health_status: {$ref: '#/components/schemas/EngineHealthStatus'}
        last_health_check_at: {type: string, format: date-time, nullable: true}
        unhealthy_reason: {type: string}
        region: {type: string}
        max_concurrency: {type: integer, minimum: 1}
        request_timeout_seconds: {type: integer, minimum: 1}
        task_timeout_seconds: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        resource_version: {type: integer}
      allOf:
        - oneOf:
            - properties:
                auth_type: {type: string, enum: [none]}
              not: {required: [auth_config]}
            - properties:
                auth_type: {type: string, enum: [api_key]}
                auth_config: {$ref: '#/components/schemas/ApiKeyAuthConfig'}
            - properties:
                auth_type: {type: string, enum: [bearer_token]}
                auth_config: {$ref: '#/components/schemas/BearerTokenAuthConfig'}
            - properties:
                auth_type: {type: string, enum: [ak_sk]}
                auth_config: {$ref: '#/components/schemas/AkSkAuthConfig'}
    EngineInstanceCreateRequest:
      type: object
      additionalProperties: false
      description: auth_type 与 auth_config 必须严格匹配；校验失败返回 ERR_AIAPP_ENGINE_AUTH_CONFIG_INVALID。
      required: [name, application_engine_type_id, base_url, auth_type, enabled, max_concurrency]
      properties:
        name: {type: string}
        description: {type: string}
        application_engine_type_id: {type: string}
        base_url: {type: string, format: uri}
        auth_type: {type: string, enum: [none, api_key, bearer_token, ak_sk]}
        auth_config:
          oneOf:
            - $ref: '#/components/schemas/ApiKeyAuthConfig'
            - $ref: '#/components/schemas/BearerTokenAuthConfig'
            - $ref: '#/components/schemas/AkSkAuthConfig'
        enabled: {type: boolean}
        region: {type: string}
        max_concurrency: {type: integer, minimum: 1}
        request_timeout_seconds: {type: integer, minimum: 1}
        task_timeout_seconds: {type: integer, minimum: 1}
      allOf:
        - oneOf:
            - properties:
                auth_type: {type: string, enum: [none]}
              not: {required: [auth_config]}
            - required: [auth_config]
              properties:
                auth_type: {type: string, enum: [api_key]}
                auth_config: {$ref: '#/components/schemas/ApiKeyAuthConfig'}
            - required: [auth_config]
              properties:
                auth_type: {type: string, enum: [bearer_token]}
                auth_config: {$ref: '#/components/schemas/BearerTokenAuthConfig'}
            - required: [auth_config]
              properties:
                auth_type: {type: string, enum: [ak_sk]}
                auth_config: {$ref: '#/components/schemas/AkSkAuthConfig'}
    EngineInstanceUpdateRequest:
      type: object
      additionalProperties: false
      description: 普通字段可独立更新；鉴权更新必须成组提交 auth_type 与匹配的 auth_config，切换为 none 时必须省略 auth_config。校验失败返回 ERR_AIAPP_ENGINE_AUTH_CONFIG_INVALID。
      properties:
        name: {type: string}
        description: {type: string}
        base_url: {type: string, format: uri}
        auth_type: {type: string, enum: [none, api_key, bearer_token, ak_sk]}
        auth_config:
          oneOf:
            - $ref: '#/components/schemas/ApiKeyAuthConfig'
            - $ref: '#/components/schemas/BearerTokenAuthConfig'
            - $ref: '#/components/schemas/AkSkAuthConfig'
        enabled: {type: boolean}
        region: {type: string}
        max_concurrency: {type: integer, minimum: 1}
        request_timeout_seconds: {type: integer, minimum: 1}
        task_timeout_seconds: {type: integer, minimum: 1}
        resource_version: {type: integer}
      allOf:
        - oneOf:
            - not:
                anyOf:
                  - required: [auth_type]
                  - required: [auth_config]
            - required: [auth_type]
              properties:
                auth_type: {type: string, enum: [none]}
              not: {required: [auth_config]}
            - required: [auth_type, auth_config]
              properties:
                auth_type: {type: string, enum: [api_key]}
                auth_config: {$ref: '#/components/schemas/ApiKeyAuthConfig'}
            - required: [auth_type, auth_config]
              properties:
                auth_type: {type: string, enum: [bearer_token]}
                auth_config: {$ref: '#/components/schemas/BearerTokenAuthConfig'}
            - required: [auth_type, auth_config]
              properties:
                auth_type: {type: string, enum: [ak_sk]}
                auth_config: {$ref: '#/components/schemas/AkSkAuthConfig'}
    EngineInstanceListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/EngineInstanceSummary'}}
    EngineInstanceSummary:
      type: object
      required: [id, name, application_engine_type_id, base_url, enabled, health_status, unhealthy_reason, object_info_available, object_info_stale]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        application_engine_type_id: {type: string}
        base_url:
          type: string
          format: uri
          description: EngineInstance 的调用端点；列表不返回 auth_config 等鉴权信息。
        enabled: {type: boolean}
        health_status: {$ref: '#/components/schemas/EngineHealthStatus'}
        last_health_check_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次成功持久化的健康检测完成时间；从未检测时为 null。
        unhealthy_reason:
          type: string
          maxLength: 512
          description: 最近一次健康检测的安全失败摘要；健康或从未失败时为空字符串。
        object_info_available:
          type: boolean
          description: ComfyUI 实例是否存在最后一次成功获取的当前目录；非 ComfyUI 实例固定为 false。
        object_info_refreshed_at:
          type: string
          format: date-time
          nullable: true
          description: ComfyUI 当前目录最近成功刷新时间；不存在目录或非 ComfyUI 实例时为 null。
        object_info_stale:
          type: boolean
          description: 当前目录是否不存在或已超过 48 小时；非 ComfyUI 实例固定为 false。
        region: {type: string}
    EngineHealthCheckResult:
      type: object
      required: [engine_instance_id, health_status, checked_at]
      properties:
        engine_instance_id: {type: string}
        health_status: {$ref: '#/components/schemas/EngineHealthStatus'}
        checked_at: {type: string, format: date-time}
        failure_summary: {type: string}
    ComfyUIEngineObjectInfoStatus:
      type: object
      additionalProperties: false
      required: [engine_instance_id, available, stale]
      properties:
        engine_instance_id: {type: string}
        available: {type: boolean}
        stale: {type: boolean}
        comfyui_version: {type: string, nullable: true}
        refreshed_at: {type: string, format: date-time, nullable: true}
    ComfyUIEngineObjectInfo:
      type: object
      additionalProperties: false
      required: [engine_instance_id, available, stale, object_info]
      properties:
        engine_instance_id: {type: string}
        available: {type: boolean, enum: [true]}
        stale: {type: boolean}
        comfyui_version: {type: string}
        refreshed_at: {type: string, format: date-time}
        object_info:
          type: object
          additionalProperties: true
          x-naming-exception: 第三方 ComfyUI 原始字段名保持不变。
    EngineCapabilityBinding:
      type: object
      required: [id, name, engine_instance_id, provider_capability_id, provider_capability_revision, enabled, effective_status, restrictions, system_managed, created_at, updated_at, resource_version]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        engine_instance_id: {type: string}
        provider_capability_id: {type: string}
        provider_capability_revision: {type: string}
        enabled: {type: boolean}
        effective_status: {type: string, enum: [available, disabled, unavailable]}
        restrictions: {type: object, additionalProperties: true}
        system_managed:
          type: boolean
          readOnly: true
          description: true 表示 required_immutable 系统绑定，不能通过绑定管理 API 修改或删除。
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        resource_version: {type: integer}
    EngineCapabilityBindingCreateRequest:
      type: object
      additionalProperties: false
      required: [name, engine_instance_id, provider_capability_id, enabled, restrictions]
      properties:
        name: {type: string}
        description: {type: string}
        engine_instance_id: {type: string}
        provider_capability_id: {type: string}
        enabled: {type: boolean}
        restrictions: {type: object, additionalProperties: true}
    EngineCapabilityBindingUpdateRequest:
      type: object
      additionalProperties: false
      required: [resource_version]
      properties:
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        restrictions: {type: object, additionalProperties: true}
        resource_version: {type: integer}
    EngineCapabilityBindingListResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/EngineCapabilityBinding'}}
    DeleteResult:
      type: object
      required: [id, deleted]
      properties:
        id: {type: string}
        deleted: {type: boolean}
    ErrorResponse:
      type: object
      required: [code, value, message, messages, retryable]
      properties:
        code: {type: string}
        value: {type: integer}
        message: {type: string}
        messages:
          type: object
          required: [zh-CN, en-US]
          properties:
            zh-CN: {type: string}
            en-US: {type: string}
        detail: {type: string}
        retryable: {type: boolean}
        data: {type: object, additionalProperties: true}
