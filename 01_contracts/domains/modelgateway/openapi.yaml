openapi: 3.0.3
info:
  title: OmniMAM Model Gateway API
  version: 2.0.0-draft
  description: >-
    ProviderType、ProviderCapability、ProviderAccount、ProviderResource、账号能力绑定、
    ComfyUI object_info 与 ProviderNetworkPolicy 的 canonical API。
    不兼容旧 Engine 与 User Model Provider API。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - {name: Provider Types}
  - {name: Provider Capabilities}
  - {name: Provider Accounts}
  - {name: Provider Resources}
  - {name: Provider Bindings}
  - {name: Provider Network Policy}

paths:
  /api/v1/model-gateway/provider-types:
    get:
      tags: [Provider Types]
      operationId: listProviderTypes
      summary: 读取稳定 ProviderType 目录
      x-s1-refs: {user_stories: [US-MGW-007], business_rules: [BR-MGW-003, BR-MGW-019]}
      parameters:
        - {$ref: '#/components/parameters/PageNum'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Keyword'}
        - {$ref: '#/components/parameters/SortField'}
        - {$ref: '#/components/parameters/SortOrder'}
        - {name: account_scope, in: query, schema: {$ref: '#/components/schemas/AccountScope'}}
        - {name: resource_kind, in: query, schema: {$ref: '#/components/schemas/ResourceKind'}}
      responses:
        '200':
          description: ProviderType 列表或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ProviderTypeList'}
                  - {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/model-gateway/provider-capabilities:
    get:
      tags: [Provider Capabilities]
      operationId: listProviderCapabilities
      summary: 读取 ProviderCapability 公共目录
      x-s1-refs: {user_stories: [US-MGW-007], business_rules: [BR-MGW-004]}
      parameters:
        - {$ref: '#/components/parameters/PageNum'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Keyword'}
        - {$ref: '#/components/parameters/SortField'}
        - {$ref: '#/components/parameters/SortOrder'}
        - {name: provider_type, in: query, schema: {type: string}}
        - {name: capability_definition_id, in: query, schema: {type: string}}
        - {name: availability, in: query, schema: {type: string, enum: [available, disabled, unavailable]}}
      responses:
        '200':
          description: ProviderCapability 列表或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ProviderCapabilityList'}
                  - {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/model-gateway/provider-capability-load-results:
    get:
      tags: [Provider Capabilities]
      operationId: listProviderCapabilityLoadResults
      summary: 读取文件级加载诊断
      x-s1-refs: {user_stories: [US-MGW-007], business_rules: [BR-MGW-004]}
      parameters:
        - {$ref: '#/components/parameters/PageNum'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Keyword'}
      responses:
        '200':
          description: 加载诊断列表或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ProviderCapabilityLoadResultList'}
                  - {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/model-gateway/provider-accounts:
    get:
      tags: [Provider Accounts]
      operationId: listProviderAccounts
      summary: 分页读取当前主体可见 ProviderAccount
      x-s1-refs: {user_stories: [US-MGW-001], business_rules: [BR-MGW-001, BR-MGW-014]}
      parameters:
        - {$ref: '#/components/parameters/PageNum'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Keyword'}
        - {$ref: '#/components/parameters/SortField'}
        - {$ref: '#/components/parameters/SortOrder'}
        - {name: scope, in: query, schema: {$ref: '#/components/schemas/AccountScope'}}
        - {name: provider_type, in: query, schema: {type: string}}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: health_status, in: query, schema: {$ref: '#/components/schemas/HealthStatus'}}
      responses:
        '200':
          description: ProviderAccount 列表或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ProviderAccountList'}
                  - {$ref: '#/components/schemas/ErrorResponse'}
    post:
      tags: [Provider Accounts]
      operationId: createProviderAccount
      summary: 创建 USER 或 PLATFORM ProviderAccount
      description: USER owner 由服务端固定为当前主体；PLATFORM 仅平台管理员可创建。
      x-s1-refs: {user_stories: [US-MGW-001], business_rules: [BR-MGW-001, BR-MGW-003]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderAccountCreateRequest'}
      responses:
        '200':
          description: 创建结果或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ProviderAccount'}
                  - {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/model-gateway/provider-accounts/test:
    post:
      tags: [Provider Accounts]
      operationId: testUnsavedProviderAccount
      summary: 测试未保存 ProviderAccount 配置
      description: 不创建账号、资源或健康历史。
      x-s1-refs: {user_stories: [US-MGW-004], business_rules: [BR-MGW-017, BR-MGW-018]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderAccountTestRequest'}
      responses:
        '200':
          description: 安全测试结果或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ProviderTestResult'}
                  - {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/model-gateway/provider-accounts/{account_id}:
    parameters:
      - {$ref: '#/components/parameters/AccountId'}
    get:
      tags: [Provider Accounts]
      operationId: getProviderAccount
      summary: 读取 ProviderAccount 详情
      x-s1-refs: {user_stories: [US-MGW-001], business_rules: [BR-MGW-001, BR-MGW-014]}
      responses:
        '200':
          description: 详情或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderAccount'}, {$ref: '#/components/schemas/ErrorResponse'}]}
    patch:
      tags: [Provider Accounts]
      operationId: updateProviderAccount
      summary: 局部更新 ProviderAccount
      x-s1-refs: {user_stories: [US-MGW-001], business_rules: [BR-MGW-001, BR-MGW-007]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderAccountUpdateRequest'}
      responses:
        '200':
          description: 更新结果或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderAccount'}, {$ref: '#/components/schemas/ErrorResponse'}]}
    delete:
      tags: [Provider Accounts]
      operationId: deleteProviderAccount
      summary: 删除 ProviderAccount
      x-s1-refs: {user_stories: [US-MGW-001], business_rules: [BR-MGW-001, BR-MGW-020]}
      responses:
        '200':
          description: 删除确认或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/DeleteResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/provider-accounts/{account_id}/test:
    parameters:
      - {$ref: '#/components/parameters/AccountId'}
    post:
      tags: [Provider Accounts]
      operationId: testProviderAccount
      summary: 测试已保存 ProviderAccount 并更新健康事实
      x-s1-refs: {user_stories: [US-MGW-004], business_rules: [BR-MGW-007, BR-MGW-018]}
      responses:
        '200':
          description: 测试结果或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderTestResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/provider-accounts/{account_id}/resources:
    parameters:
      - {$ref: '#/components/parameters/AccountId'}
    get:
      tags: [Provider Resources]
      operationId: listProviderAccountResources
      summary: 分页读取账号资源
      x-s1-refs: {user_stories: [US-MGW-002], business_rules: [BR-MGW-005]}
      parameters:
        - {$ref: '#/components/parameters/PageNum'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Keyword'}
        - {name: resource_kind, in: query, schema: {$ref: '#/components/schemas/ResourceKind'}}
        - {name: discovery_status, in: query, schema: {$ref: '#/components/schemas/DiscoveryStatus'}}
      responses:
        '200':
          description: 资源列表或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderResourceList'}, {$ref: '#/components/schemas/ErrorResponse'}]}
    post:
      tags: [Provider Resources]
      operationId: createProviderResource
      summary: 手动创建 ProviderType 允许维护的资源
      x-s1-refs: {user_stories: [US-MGW-002], business_rules: [BR-MGW-003, BR-MGW-005]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderResourceCreateRequest'}
      responses:
        '200':
          description: 创建结果或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderResource'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/provider-accounts/{account_id}/resources/sync:
    parameters:
      - {$ref: '#/components/parameters/AccountId'}
    post:
      tags: [Provider Resources]
      operationId: syncProviderAccountResources
      summary: 同步远端资源且保留本地启用决定
      x-s1-refs: {user_stories: [US-MGW-002], business_rules: [BR-MGW-005, BR-MGW-017]}
      responses:
        '200':
          description: 逐项同步结果或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderResourceSyncResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/provider-resources/{resource_id}:
    parameters:
      - {$ref: '#/components/parameters/ResourceId'}
    get:
      tags: [Provider Resources]
      operationId: getProviderResource
      summary: 读取 ProviderResource 详情
      x-s1-refs: {user_stories: [US-MGW-002], business_rules: [BR-MGW-005, BR-MGW-014]}
      responses:
        '200':
          description: 详情或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderResource'}, {$ref: '#/components/schemas/ErrorResponse'}]}
    patch:
      tags: [Provider Resources]
      operationId: updateProviderResource
      summary: 更新本地展示、启用与能力关闭范围
      x-s1-refs: {user_stories: [US-MGW-002], business_rules: [BR-MGW-005]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderResourceUpdateRequest'}
      responses:
        '200':
          description: 更新结果或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderResource'}, {$ref: '#/components/schemas/ErrorResponse'}]}
    delete:
      tags: [Provider Resources]
      operationId: deleteProviderResource
      summary: 删除手动资源或不再需要的本地资源记录
      x-s1-refs: {user_stories: [US-MGW-002], business_rules: [BR-MGW-005]}
      responses:
        '200':
          description: 删除确认或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/DeleteResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/provider-resources/{resource_id}/test:
    parameters:
      - {$ref: '#/components/parameters/ResourceId'}
    post:
      tags: [Provider Resources]
      operationId: testProviderResource
      summary: 测试已保存资源并更新健康事实
      x-s1-refs: {user_stories: [US-MGW-004], business_rules: [BR-MGW-007, BR-MGW-018]}
      responses:
        '200':
          description: 测试结果或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderTestResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/provider-account-capability-bindings:
    get:
      tags: [Provider Bindings]
      operationId: listProviderAccountCapabilityBindings
      summary: 分页读取账号能力绑定
      x-s1-refs: {user_stories: [US-MGW-003], business_rules: [BR-MGW-006]}
      parameters:
        - {$ref: '#/components/parameters/PageNum'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: provider_account_id, in: query, schema: {type: string}}
        - {name: provider_capability_id, in: query, schema: {type: string}}
      responses:
        '200':
          description: Binding 列表或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderBindingList'}, {$ref: '#/components/schemas/ErrorResponse'}]}
    post:
      tags: [Provider Bindings]
      operationId: createProviderAccountCapabilityBinding
      summary: 创建账号能力绑定
      x-s1-refs: {user_stories: [US-MGW-003], business_rules: [BR-MGW-006]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderBindingCreateRequest'}
      responses:
        '200':
          description: 创建结果或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderBinding'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/provider-account-capability-bindings/{binding_id}:
    parameters:
      - {$ref: '#/components/parameters/BindingId'}
    patch:
      tags: [Provider Bindings]
      operationId: updateProviderAccountCapabilityBinding
      summary: 更新账号能力绑定收窄配置
      x-s1-refs: {user_stories: [US-MGW-003], business_rules: [BR-MGW-006]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderBindingUpdateRequest'}
      responses:
        '200':
          description: 更新结果或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderBinding'}, {$ref: '#/components/schemas/ErrorResponse'}]}
    delete:
      tags: [Provider Bindings]
      operationId: deleteProviderAccountCapabilityBinding
      summary: 删除账号能力绑定
      x-s1-refs: {user_stories: [US-MGW-003], business_rules: [BR-MGW-006]}
      responses:
        '200':
          description: 删除确认或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/DeleteResult'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/provider-accounts/{account_id}/object-info:
    parameters:
      - {$ref: '#/components/parameters/AccountId'}
    get:
      tags: [Provider Accounts]
      operationId: getProviderAccountObjectInfo
      summary: 读取 ComfyUI 账号当前 object_info
      x-s1-refs: {user_stories: [US-MGW-005], business_rules: [BR-MGW-008]}
      responses:
        '200':
          description: 当前目录或业务错误；响应支持标准 HTTP 压缩。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ComfyUIObjectInfo'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/provider-accounts/{account_id}/object-info/refresh:
    parameters:
      - {$ref: '#/components/parameters/AccountId'}
    post:
      tags: [Provider Accounts]
      operationId: refreshProviderAccountObjectInfo
      summary: 刷新 ComfyUI 账号当前 object_info
      x-s1-refs: {user_stories: [US-MGW-005], business_rules: [BR-MGW-007, BR-MGW-008]}
      responses:
        '200':
          description: 原子刷新结果或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ComfyUIObjectInfo'}, {$ref: '#/components/schemas/ErrorResponse'}]}

  /api/v1/model-gateway/network-policy:
    get:
      tags: [Provider Network Policy]
      operationId: getProviderNetworkPolicy
      summary: 读取当前 Provider 出站网络策略
      x-s1-refs: {user_stories: [US-MGW-006], business_rules: [BR-MGW-016, BR-MGW-017]}
      responses:
        '200':
          description: 当前策略或业务错误。ALLOW_ALL 响应必须携带 high_risk_warning。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderNetworkPolicy'}, {$ref: '#/components/schemas/ErrorResponse'}]}
    put:
      tags: [Provider Network Policy]
      operationId: replaceProviderNetworkPolicy
      summary: 整体替换 Provider 出站网络策略
      x-s1-refs: {user_stories: [US-MGW-006], business_rules: [BR-MGW-016, BR-MGW-017]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderNetworkPolicyReplaceRequest'}
      responses:
        '200':
          description: 新策略或业务错误。
          content:
            application/json:
              schema: {oneOf: [{$ref: '#/components/schemas/ProviderNetworkPolicy'}, {$ref: '#/components/schemas/ErrorResponse'}]}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    PageNum: {name: page_num, in: query, schema: {type: integer, minimum: 0, default: 0}}
    PageSize: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
    Keyword: {name: keyword, in: query, schema: {type: string, default: ''}}
    SortField: {name: sort_field, in: query, schema: {type: string, default: ''}}
    SortOrder: {name: sort_order, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
    AccountId: {name: account_id, in: path, required: true, schema: {type: string}}
    ResourceId: {name: resource_id, in: path, required: true, schema: {type: string}}
    BindingId: {name: binding_id, in: path, required: true, schema: {type: string}}
  schemas:
    AccountScope: {type: string, enum: [USER, PLATFORM]}
    ResourceKind: {type: string, enum: [MODEL, WORKFLOW, APPLICATION, DEPLOYMENT]}
    HealthStatus: {type: string, enum: [UNKNOWN, HEALTHY, DEGRADED, UNHEALTHY]}
    DiscoveryStatus: {type: string, enum: [MANUAL, DISCOVERED, MISSING, INVALID]}
    ProviderTypeSummary:
      type: object
      required: [id, display_name, supported_account_scopes, supported_resource_kinds, endpoint_policy, authentication_types, supports_resource_discovery, supports_manual_resources, supports_account_probe, supports_resource_probe, supports_object_info]
      properties:
        id: {type: string}
        display_name: {type: string}
        supported_account_scopes: {type: array, items: {$ref: '#/components/schemas/AccountScope'}}
        supported_resource_kinds: {type: array, items: {$ref: '#/components/schemas/ResourceKind'}}
        endpoint_policy: {type: string, enum: [fixed, optional_custom, required_custom]}
        authentication_types: {type: array, items: {type: string}}
        configuration_schema: {type: object, additionalProperties: true}
        supports_resource_discovery: {type: boolean}
        supports_manual_resources: {type: boolean}
        supports_account_probe: {type: boolean}
        supports_resource_probe: {type: boolean}
        supports_object_info: {type: boolean}
    ProviderTypeList:
      type: object
      required: [total, items]
      properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/ProviderTypeSummary'}}}
    ProviderCapabilitySummary:
      type: object
      required: [id, name, kind, provider_type, revision, availability, capability_definition_ids]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [catalog, runtime]}
        provider_type: {type: string}
        revision: {type: string}
        availability: {type: string, enum: [available, disabled, unavailable]}
        capability_definition_ids: {type: array, items: {type: string}}
    ProviderCapabilityList:
      type: object
      required: [total, items]
      properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/ProviderCapabilitySummary'}}}
    ProviderCapabilityLoadResult:
      type: object
      required: [diagnostic_id, status, diagnostic_code, loaded_at]
      properties:
        diagnostic_id: {type: string}
        provider_capability_id: {type: string, nullable: true}
        provider_type: {type: string, nullable: true}
        status: {type: string, enum: [available, disabled, unavailable]}
        diagnostic_code: {type: string}
        safe_detail: {type: string}
        loaded_at: {type: string, format: date-time}
    ProviderCapabilityLoadResultList:
      type: object
      required: [total, items]
      properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/ProviderCapabilityLoadResult'}}}
    TimeoutConfig:
      type: object
      additionalProperties: false
      properties:
        connect_seconds: {type: integer, minimum: 1, maximum: 120}
        read_seconds: {type: integer, minimum: 1, maximum: 3600}
        operation_seconds: {type: integer, minimum: 1, maximum: 86400}
    ProviderAccountBase:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        endpoint: {type: string, nullable: true}
        auth_type: {type: string}
        credential_ref: {type: string, writeOnly: true, nullable: true}
        extra_config: {type: object, additionalProperties: true, writeOnly: true}
        enabled: {type: boolean}
        routing_priority: {type: integer, minimum: 0}
        max_concurrency: {type: integer, minimum: 1, maximum: 1024}
        timeouts: {$ref: '#/components/schemas/TimeoutConfig'}
    ProviderAccountCreateRequest:
      allOf:
        - {$ref: '#/components/schemas/ProviderAccountBase'}
        - type: object
          required: [name, scope, provider_type, auth_type]
          properties:
            scope: {$ref: '#/components/schemas/AccountScope'}
            provider_type: {type: string}
    ProviderAccountTestRequest:
      allOf:
        - {$ref: '#/components/schemas/ProviderAccountCreateRequest'}
    ProviderAccountUpdateRequest:
      allOf:
        - {$ref: '#/components/schemas/ProviderAccountBase'}
        - type: object
          required: [resource_version]
          properties: {resource_version: {type: integer, minimum: 0}}
    ProviderAccountSummary:
      type: object
      required: [id, name, scope, provider_type, enabled, config_version, health_status, routing_priority, max_concurrency, resource_version, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        scope: {$ref: '#/components/schemas/AccountScope'}
        owner_user_id: {type: string, nullable: true}
        provider_type: {type: string}
        enabled: {type: boolean}
        config_version: {type: integer}
        health_status: {$ref: '#/components/schemas/HealthStatus'}
        health_reason: {type: string, nullable: true, maxLength: 512}
        last_health_check_at: {type: string, format: date-time, nullable: true}
        routing_priority: {type: integer}
        max_concurrency: {type: integer}
        resource_version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProviderAccount:
      allOf:
        - {$ref: '#/components/schemas/ProviderAccountSummary'}
        - type: object
          properties:
